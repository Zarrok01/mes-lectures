<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes lectures</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#141414">
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--field:#fff;--ink:#2b2622;--muted:#7a6f66;--line:#e6ddd0;--accent:#b5562f;--accent-soft:#f3e2d8;--green:#4f7a52;--star:#e0a526;--red:#c0392b;--radius:14px;--shadow:0 1px 3px rgba(60,40,20,.08),0 4px 14px rgba(60,40,20,.06);color-scheme:light}
:root[data-theme=dark]{--bg:#1b1815;--card:#26221e;--field:#2f2a25;--ink:#efe7dd;--muted:#a99d90;--line:#3d362e;--accent:#dd7a4c;--accent-soft:#3e2a20;--green:#82b082;--red:#e3735f;--shadow:0 1px 3px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
main.wrap{padding-bottom:110px}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;margin:0;flex:1}
.flame{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 10px;font-weight:700;font-size:.9rem}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;background:none;padding:10px 8px;font:inherit;font-size:.93rem;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.tab .n{display:inline-block;min-width:1.5em;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--line);font-size:.75rem;color:var(--ink)}
.tools{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}
.tools input,.tools select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.tools input{flex:1 1 200px}
.tools select{flex:1 1 120px}
.list{display:grid;gap:12px}
.list.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
.card{display:flex;gap:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;cursor:pointer}
.gcard{cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative}
.gcard .ph{width:100%;height:auto;aspect-ratio:2/3;border-radius:8px;font-size:2rem;box-shadow:var(--shadow)}
.gcard .t{font-size:.84rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .pin{position:absolute;top:4px;right:4px;font-size:1rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:bold;flex:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover{width:64px;height:96px;border-radius:6px;font-size:1.5rem}
.rc{width:40px;height:60px;border-radius:4px;font-size:.9rem}
.big{width:80px;height:120px;border-radius:6px;font-size:1.8rem}
.mini{width:30px;height:45px;border-radius:3px;font-size:.8rem}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t{font-weight:650;line-height:1.25}
.a{color:var(--muted);font-size:.92rem}
.avis{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.meta{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 9px;font-size:.78rem}
.chip.warn{background:#fdecc8;color:#8a5a00}
.chip.late{background:var(--red);color:#fff}
.stars{color:var(--star);letter-spacing:1px}
.bar{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:5px}
.acts{margin-top:auto;display:flex;gap:6px;padding-top:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--red);border-color:#e8c5c5}
.btn.del.sure{background:var(--red);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:50px 20px;grid-column:1/-1}
.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(150,60,20,.35);cursor:pointer;z-index:20}
.fab2{position:fixed;right:88px;bottom:28px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;padding:0 14px;box-shadow:var(--shadow);cursor:pointer;z-index:20}
.pill{position:fixed;left:16px;bottom:28px;height:46px;border-radius:23px;border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:0 16px;box-shadow:var(--shadow);cursor:pointer;z-index:20}
.ov{position:fixed;inset:0;background:rgba(20,14,8,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.show{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:18px}}
.modal h2{margin:0 0 12px;font-family:Georgia,serif;font-size:1.25rem}
details{margin-bottom:12px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:8px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;min-width:0}
.f>label,.lbl{font-size:.82rem;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea,.search input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);width:100%}
.row{display:flex;gap:10px}.row>.f{flex:1}
.row>.f.small{flex:0 0 90px}
.search{display:flex;gap:6px;align-items:center}.search input{flex:1}
.srcs{font-size:.78rem;color:var(--muted);margin:6px 0 0;display:flex;gap:4px 10px;flex-wrap:wrap}
.srcs .ok{color:var(--green)}.srcs .ko{color:var(--red)}
.res{display:grid;gap:6px;margin:8px 0}
.res button.r{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:6px;cursor:pointer;width:100%}
.own{color:var(--green);font-weight:600;font-size:.82rem}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.starpick button{font-size:1.8rem;background:none;border:0;color:var(--line);cursor:pointer;padding:0 2px}
.starpick button.on{color:var(--star)}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.prev{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px}
.prev .btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qlist{display:grid;gap:6px;margin-bottom:6px}
.q{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;font-size:.92rem;display:flex;gap:8px}
.q p{margin:0;flex:1;font-style:italic;white-space:pre-wrap}
.q button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}
.quote{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer}
.quote p{margin:0 0 6px;font-family:Georgia,serif;font-size:1.05rem;white-space:pre-wrap}
.hist{font-size:.85rem;color:var(--muted);margin:-4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.tile b{display:block;font-size:1.5rem;font-family:Georgia,serif}
.tile span{font-size:.82rem;color:var(--muted)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:1rem}
.chart{display:flex;gap:4px;height:140px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--muted);min-width:0}
.chart .col{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.chart.green i{background:var(--green)}
.chart em{font-style:normal;color:var(--ink);font-weight:600;font-size:.68rem}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr 24px;gap:8px;align-items:center;font-size:.88rem;margin-bottom:7px}
.hb .bar>i{background:var(--accent)}
.facts{display:grid;gap:8px}
.fact{display:flex;gap:10px;align-items:center;font-size:.92rem}
.fact .k{color:var(--muted);min-width:118px;font-size:.85rem}
.top5{display:grid;gap:8px;margin-bottom:12px}
.top5 div{display:flex;gap:10px;align-items:center;font-size:.92rem}
.top5 .rk{font-family:Georgia,serif;font-weight:bold;color:var(--accent);width:18px}
.lines{display:grid;gap:8px}
.line{display:flex;gap:10px;align-items:center;font-size:.92rem;cursor:pointer}
.line .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.95}
.toast.act{pointer-events:auto}
.toast button{background:none;border:0;color:var(--star);font:inherit;font-weight:700;margin-left:10px;cursor:pointer}
#scanOv,#bulkOv,#timerOv{z-index:35}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .aim::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff5a36;animation:sweep 1.6s ease-in-out infinite}
.cam.flash .aim{border-color:#5be37d}
@keyframes sweep{0%,100%{transform:translateY(-35px)}50%{transform:translateY(35px)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;padding:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.blist{display:grid;gap:6px;margin-top:10px;max-height:32vh;overflow:auto}
.bl{display:flex;gap:8px;align-items:center;font-size:.88rem;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.bl .grow{flex:1;min-width:0}
.clock{font-family:Georgia,serif;font-size:3.4rem;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chipb{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 11px;border-radius:20px;cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:4px 0 12px;cursor:pointer}
.nxspin{text-align:center;font-family:Georgia,serif;font-size:1.2rem;padding:28px 10px;color:var(--muted)}
.nxcard{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px;margin:6px 0 4px}
.nxcard .t{font-size:1.1rem}
.cal{overflow-x:auto;padding-bottom:6px}
.calm,.calg{display:grid;grid-auto-columns:12px;gap:2px}
.calm{grid-template-rows:14px;grid-auto-flow:column;font-size:.64rem;color:var(--muted);white-space:nowrap}
.calg{grid-template-rows:repeat(7,12px);grid-auto-flow:column}
.calg i,.calleg i{display:block;width:12px;height:12px;border-radius:3px;background:var(--line);cursor:pointer}
.calleg{display:flex;align-items:center;gap:3px;font-size:.72rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.calleg i{display:inline-block;cursor:default}.calleg .sp{flex:1}
.calg .l1,.calleg .l1{background:rgba(95,155,98,.35)}.calg .l2,.calleg .l2{background:rgba(95,155,98,.6)}
.calg .l3,.calleg .l3{background:rgba(70,135,74,.85)}.calg .l4,.calleg .l4{background:#2f6b34}
.calg .l5,.calleg .l5{background:var(--accent)}
.calg .f{opacity:.3}.calg .now{outline:2px solid var(--ink);outline-offset:-1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.badge.ok{border-color:var(--accent);background:var(--accent-soft)}
.badge .be{font-size:1.7rem;filter:grayscale(1);opacity:.55}
.badge.ok .be{filter:none;opacity:1}
.badge span{color:var(--muted)}
.badge .won{color:var(--green);font-weight:700}
.badge .bar{margin-top:3px}
.sugs{display:grid;gap:12px}
.sug{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.sugtop{display:flex;gap:12px}
.sugres{font-size:.88rem;margin:10px 0 2px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;cursor:pointer}
.sugres.open{display:block}
.resum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.84rem}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-bottom:12px}
.cpick button{border:2px solid var(--line);padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--line);aspect-ratio:2/3}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}
.notice{background:var(--accent-soft);color:var(--ink);font-size:.85rem;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:12px/1.4 Georgia,serif}
  #print h1{font-size:20px;margin:0 0 4px}#print h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #999}
  #print table{width:100%;border-collapse:collapse}#print td,#print th{text-align:left;padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top}
  #print blockquote{margin:0 0 8px;font-style:italic}
}

/* =====================================================================
   Style « critique culturelle » (inspiré de SensCritique) :
   barre sombre, contenu clair et aéré, typo grasse, couvertures façon affiches,
   notes en pastilles colorées, rangées qui défilent, accent vert.
   ===================================================================== */
:root{--bg:#f2f2f0;--card:#fff;--field:#f6f6f4;--ink:#141414;--muted:#6e6e6e;--line:#e4e4e0;--accent:#11a05a;--accent-soft:#e2f4ea;--green:#11a05a;--star:#f5b301;--red:#d64541;--radius:12px;--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);--bar:#141414}
:root[data-theme=dark]{--bg:#0d0d0d;--card:#191919;--field:#222;--ink:#f1f1f1;--muted:#9b9b9b;--line:#2b2b2b;--accent:#2ecc71;--accent-soft:#143022;--green:#2ecc71;--shadow:0 1px 3px rgba(0,0,0,.5);--bar:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.005em}
h1,.modal h2,.tile b,.clock,.quote p,.top5 .rk,.nxspin,.ph{font-family:inherit}
header{background:var(--bar);border-bottom:0;box-shadow:0 2px 10px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
header h1{color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
header .icon{background:#262626;border-color:#333;color:#fff}
.flame{background:#262626;color:#ffb23e}
.tabs{gap:0;padding-bottom:2px}
.tab{color:#a8a8a8;font-weight:600;font-size:.92rem;padding:11px 10px 10px;border-bottom-width:3px;transition:color .15s}
.tab.on{color:#fff;border-color:var(--accent)}
.tab .n{background:#2c2c2c;color:#ddd;font-weight:700}
.tab.on .n{background:var(--accent);color:#fff}
.notice{background:#1f1f1f;color:#eee}
.notice .btn{background:#2c2c2c;border-color:#3a3a3a;color:#fff}.notice .btn.pri{background:var(--accent);border-color:var(--accent)}
.tools input,.tools select{background:var(--card);border-color:var(--line);border-radius:22px;padding:9px 14px}
.icon{border-radius:50%}
.card{border-radius:var(--radius);padding:12px;gap:14px;border:1px solid var(--line);box-shadow:none}
.cover{width:72px;height:108px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.big{border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ph{font-weight:800}
.t{font-weight:750;font-size:1.02rem;letter-spacing:-.01em}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;border-radius:6px;padding:1px 7px}
.chip.warn{background:#fff4d6;border-color:#f3d27a;color:#8a5a00}
.chip.late{background:var(--red);border-color:var(--red);color:#fff}
.btn{border-radius:20px;font-weight:600}
.btn.pri{box-shadow:0 2px 8px rgba(17,160,90,.25)}
.fab{background:var(--accent);box-shadow:0 8px 22px rgba(17,160,90,.4)}
.fab2{border-radius:23px;font-weight:600}
.panel{border-radius:var(--radius);border:1px solid var(--line);box-shadow:none}
.panel h3,.lbl{text-transform:uppercase;letter-spacing:.06em;font-size:.76rem;font-weight:800;color:var(--muted)}
.panel h3{color:var(--ink)}
.tile{border:1px solid var(--line);box-shadow:none}
.tile b{font-weight:800;letter-spacing:-.02em}
.modal{border-radius:20px 20px 0 0}
.modal h2{font-weight:800;letter-spacing:-.02em}
.bar>i{background:var(--accent)}
.chart i{background:var(--ink)}.chart.green i{background:var(--accent)}
.hb .bar>i{background:var(--ink)}
.quote{border:1px solid var(--line);box-shadow:none;border-left:4px solid var(--accent)}
.q{background:var(--field);border-left-color:var(--accent)}
/* Notes en pastille colorée (vert = coup de cœur … rouge = déçu) */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-weight:800;font-size:.85rem;color:#fff;background:#9a9a9a}
.score small{font-size:.65rem;opacity:.85;margin-left:1px}
.n5{background:#11a05a}.n4{background:#5cb85c}.n3{background:#e5a50a}.n2{background:#e67e22}.n1{background:#d64541}
.gcard .ph{border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.gcard .gscore{position:absolute;left:6px;top:6px;z-index:2}
.list.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 12px}
/* Sélection du mois : rangée de livres qui défile à l'horizontale */
.sugs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs .sug{flex:0 0 86%;scroll-snap-align:start}
.sug{border-radius:var(--radius)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
/* Glisser entre onglets : petite animation */

<script src="recherche.js"></script>
<script>
/* =====================================================================
   Mes lectures : l'appli
   ===================================================================== */
const STATUTS = {en_cours: 'En cours', a_lire: 'À lire', lu: 'Lus', abandon: 'Abandonnés'};
const STATUT_UN = {en_cours: 'En cours', a_lire: 'À lire', lu: 'Lu', abandon: 'Abandonné'};
const GENRES = ['Roman', 'Polar / Thriller', 'SF / Fantasy', 'Essai', 'Pro / VAE', 'Développement perso', 'BD / Manga', 'Biographie', 'Jeunesse', 'Autre'];
const FORMATS = {papier: '📖 Papier', numerique: '📱 Numérique', audio: '🎧 Audio'};
const POSSESSION = {a_moi: 'Je l\'ai', emprunte: 'Emprunté (médiathèque, ami…)', prete: 'Prêté à quelqu\'un', non: 'Je ne l\'ai pas'};
const MOIS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const EMPTY = {
  en_cours: 'Aucune lecture en cours.<br>Va dans « À lire » et appuie sur « Commencer », ou ajoute un livre avec le bouton +.',
  a_lire: 'Ta liste de livres à lire est vide.<br>Ajoute un livre avec le bouton +, ou scanne-les avec 📦 Scan rapide.',
  lu: 'Aucun livre terminé pour l\'instant.',
  abandon: 'Aucun livre abandonné. 👍'
};
// Bibliothèque complètement vide (premier lancement, réinstallation, nouveau téléphone) : récupérer une sauvegarde en un geste
const ACCUEIL = `<div style="font-size:1.6rem;margin-bottom:6px">👋</div><b style="color:var(--ink)">Ta bibliothèque est vide.</b><br>
  Ajoute ton premier livre avec le bouton ＋.<br><br>Tu avais déjà l'appli ?
  <div style="margin-top:10px"><button class="btn pri" type="button" data-export="restore">📂 J'ai une sauvegarde : récupérer mes livres</button></div>
  <div style="font-size:.8rem;margin-top:8px">(le fichier « mes-lectures-sauvegarde-… », dans tes Téléchargements, ton Drive ou tes mails)</div>`;

let books = [], goal = 0, form = null, lastRes = [];
const ui = {tab: 'en_cours', q: '', cq: '', genre: '', cat: '', own: '', sort: 'recent', year: new Date().getFullYear()};
// Page de tests (index.html?tests) : elle travaille dans une mémoire à part, jamais sur les vrais livres
const ESSAI = new URLSearchParams(location.search).has('tests');
const CLE = ESSAI ? 'test-mes-lectures' : 'mes-lectures';
const prefs = Object.assign({view: 'liste', theme: 'auto', googleKey: '', bulkDest: 'a_lire'},
  (() => { try { return JSON.parse(localStorage.getItem(CLE + '-prefs')) || {}; } catch (e) { return {}; } })());
function savePrefs() { try { localStorage.setItem(CLE + '-prefs', JSON.stringify(prefs)); } catch (e) {} }
Recherche.setGoogleKey(prefs.googleKey);

/* ---------- Petits outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const safeUrl = u => /^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(u || '') ? u : '';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
function fdate(s) { if (!s) return ''; const d = new Date(s + 'T00:00'); return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'}); }
function fdur(min) { min = Math.round(min); if (min < 60) return min + ' min'; const h = Math.floor(min / 60), m = min % 60; return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : ''); }
// Note en pastille colorée : 5 = vert … 1 = rouge
function scoreHtml(n, cls) { n = Math.round(n || 0); return n ? `<span class="score n${n} ${cls || ''}">${n}<small>/5</small></span>` : ''; }
function stars(n) { n = Math.round(n || 0); return n ? '★'.repeat(n) + '☆'.repeat(5 - n) : ''; }
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function plural(n, w) { return n + ' ' + w + (n > 1 ? 's' : ''); }
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = esc(msg) + (action ? `<button type="button" id="toastBtn">${esc(action.label)}</button>` : '');
  t.classList.toggle('act', !!action);
  t.classList.add('show'); clearTimeout(t._h);
  if (action) $('#toastBtn').onclick = () => { t.classList.remove('show', 'act'); action.fn(); };
  t._h = setTimeout(() => t.classList.remove('show', 'act'), action ? 6500 : 2400);
}
// Couverture : essaie les adresses une par une jusqu'à en trouver une qui existe
// Couverture choisie + couvertures de secours (si la première ne charge plus)
// (si le livre a un ISBN, les couvertures des librairies servent toujours de roue de secours)
function coverList(b) {
  return [b.couverture, ...(b.coversAlt || []), ...(b._covers || b.covers || []), ...Recherche.isbnCovers(Recherche.toIsbn13(b.isbn || ''))]
    .map(safeUrl).filter((u, i, a) => u && a.indexOf(u) === i);
}
// Une couverture visible à l'écran qui tarde : on force son chargement, puis si rien n'arrive
// au bout d'environ 8 secondes, on passe à la source suivante
setInterval(() => {
  if (document.hidden) return;
  document.querySelectorAll('img[data-alt]').forEach(i => {
    if (i.complete || !i.dataset.alt) { delete i.dataset.wait; return; }
    const r = i.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    i.dataset.wait = (+i.dataset.wait || 0) + 1;
    if (+i.dataset.wait === 1) i.loading = 'eager';
    if (+i.dataset.wait >= 5) { delete i.dataset.wait; coverNext(i); }
  });
}, 2000);
const brokenCovers = new Set();   // livres dont aucune couverture ne s'affiche (réparés par « Compléter mes livres »)
function coverHtml(b, cls) {
  const list = coverList(b);
  const ini = esc((b.titre || '?').trim().charAt(0).toUpperCase());
  return `<div class="${cls || 'cover'} ph" style="background:hsl(${hue(b.titre)} 32% 48%)">${ini}${list.length ?
    `<img src="${esc(list[0])}" data-alt="${esc(list.slice(1).join('|'))}"${b.id ? ` data-bid="${esc(b.id)}"` : ''} alt="" loading="lazy" referrerpolicy="no-referrer" onload="coverOk(this)" onerror="coverNext(this)">` : ''}</div>`;
}
// Couverture choisie + jusqu'à 4 de secours, à partir d'une liste de candidates
function setCovers(b, url, list) { b.couverture = url || ''; b.coversAlt = (list || []).filter(u => u && u !== url && !/^data:/.test(u)).slice(0, 4); }
// Si un livre n'a toujours pas de couverture : recherche élargie en arrière-plan
async function autoCover(id) {
  const b = books.find(x => x.id === id); if (!b || b.couverture || !b.titre || b.aCompleter) return;
  const l = await Recherche.chercherCouvertures(b, 5).catch(() => []);
  const i = books.findIndex(x => x.id === id);
  if (i >= 0 && l.length && !books[i].couverture) { books[i] = {...books[i]}; setCovers(books[i], l[0], l); Store.persist(); render(); }
}
window.coverNext = img => {
  const alt = (img.dataset.alt || '').split('|').filter(Boolean);
  if (!alt.length) { if (img.dataset.bid) brokenCovers.add(img.dataset.bid); return img.remove(); }
  img.dataset.alt = alt.slice(1).join('|'); img.src = alt[0];
};
window.coverOk = img => { if (Recherche.placeholder(img.naturalWidth, img.naturalHeight)) coverNext(img); };
function counts() { const c = {en_cours: 0, a_lire: 0, lu: 0, abandon: 0}; books.forEach(b => { if (b.statut in c) c[b.statut]++; }); return c; }
function allQuotes() { const out = []; books.forEach(b => (b.citations || []).forEach((q, i) => out.push({b, q, i}))); return out; }
function parseList(v) { if (Array.isArray(v)) return v; try { const x = JSON.parse(v || '[]'); return Array.isArray(x) ? x : []; } catch (e) { return []; } }
// Remet chaque fiche en bon état (au démarrage et à la restauration d'une sauvegarde) : bons types, dates valides.
// Une sauvegarde abîmée ou trafiquée ne peut ainsi ni bloquer l'appli, ni y glisser du code.
const jour = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : '';
const entier = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 && n < 100000 ? n : ''; };
const txt = v => typeof v === 'string' ? v : typeof v === 'number' && Number.isFinite(v) ? String(v) : '';
const objets = v => parseList(v).filter(x => x && typeof x === 'object' && !Array.isArray(x));
const mots = v => parseList(v).filter(x => typeof x === 'string');
function norm(b) {
  b = b && typeof b === 'object' && !Array.isArray(b) ? b : {};
  const out = {...b};
  for (const f of ['id', 'titre', 'auteur', 'serie', 'genre', 'avis', 'resume', 'isbn', 'editeur', 'annee', 'pretNom', 'couverture', 'ajoute']) out[f] = txt(b[f]);
  for (const f of ['dateDebut', 'dateFin', 'pretRetour']) out[f] = jour(b[f]);
  for (const f of ['tome', 'pagesTotal', 'pageActuelle']) out[f] = entier(b[f]);
  if (!out.id) out.id = newId();
  if (!out.titre && b.aCompleter !== true) out.titre = 'Sans titre';
  out.statut = b.statut in STATUT_UN ? b.statut : 'a_lire';
  out.note = Math.min(5, Math.max(0, Math.round(+b.note || 0)));
  out.epingle = b.epingle === true || b.epingle === 'true';
  out.aCompleter = b.aCompleter === true;
  out.format = b.format in FORMATS ? b.format : 'papier';
  out.possession = b.possession in POSSESSION ? b.possession : 'a_moi';
  out.citations = objets(b.citations).map(q => ({...q, texte: txt(q.texte), page: txt(q.page), date: jour(q.date)})).filter(q => q.texte);
  out.journal = objets(b.journal).map(e => ({date: jour(e.date), page: +e.page || 0})).filter(e => e.date);
  out.historique = objets(b.historique).map(h => ({debut: jour(h.debut), fin: jour(h.fin), note: Math.min(5, Math.max(0, +h.note || 0))}));
  out.sessions = objets(b.sessions).map(x => ({...x, date: jour(x.date), min: Math.max(0, +x.min || 0)})).filter(x => x.date);
  out.coversAlt = mots(b.coversAlt);
  out.sujets = mots(b.sujets);
  out.classements = objets(b.classements).filter(k => typeof k.l === 'string' && typeof k.c === 'string').map(k => ({c: k.c, l: k.l, ...(typeof k.s === 'string' ? {s: k.s} : {})}));
  out.catNon = mots(b.catNon); out.catOui = mots(b.catOui);
  return out;
}
const serieLabel = b => b.serie ? b.serie + (b.tome ? ' · T.' + b.tome : '') : '';

/* ---------- Thème ---------- */
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = prefs.theme === 'dark' || (prefs.theme === 'auto' && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
if (darkQuery.addEventListener) darkQuery.addEventListener('change', applyTheme);
applyTheme();

/* ---------- Stockage sur l'appareil (IndexedDB : grande capacité) ---------- */
const Store = {
  fallback: !('indexedDB' in window),
  queue: Promise.resolve(),
  erreur: false,    // le dernier enregistrement a échoué : bandeau d'alerte jusqu'à ce que ça remarche
  bloque: false,    // impossible de lire les livres au démarrage : on n'écrit plus rien (pour ne rien écraser)
  db() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open(CLE, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => {
        const db = r.result;
        // Connexion fermée par le système (manque de place, mise à jour…) : on la rouvrira à la prochaine opération
        db.onclose = () => { this._db = null; };
        db.onversionchange = () => { db.close(); this._db = null; };
        res(db);
      };
      r.onerror = () => { this._db = null; rej(r.error); };
    });
    return this._db;
  },
  async get(k) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const t = db.transaction('kv'), q = t.objectStore('kv').get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      t.onabort = () => rej(t.error || new Error('lecture interrompue'));
    });
  },
  async set(k, v) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
      // (mémoire pleine, appli fermée… : sans ça, l'enregistrement pouvait rester bloqué sans rien dire)
      t.onabort = () => rej(t.error || new Error('enregistrement interrompu'));
    });
  },
  // Copie de secours : écrite seulement quand la mémoire principale refuse un enregistrement
  secours() { try { return JSON.parse(localStorage.getItem(CLE + '-data')); } catch (e) { return null; } },
  async load() {
    const secours = this.secours();
    if (!this.fallback) {
      let d;
      try { d = await this.get('data'); }
      catch (e) {
        // Mémoire principale illisible : surtout ne pas afficher (puis enregistrer) une bibliothèque vide
        if (secours) { this.fallback = true; return secours; }
        this.bloque = true; throw new Error('lecture impossible');
      }
      if (d) {
        // Enregistrements faits pendant une panne : la copie de secours est plus récente, c'est elle la bonne
        // (à égalité aussi : la copie de secours n'existe que si un enregistrement a échoué APRÈS le dernier réussi)
        if (secours && (secours.savedAt || '') >= (d.savedAt || '')) return secours;
        return d;
      }
      // Première ouverture de cette version : on reprend les livres de l'ancienne mémoire
      const d2 = secours || {books: [], goal: 0};
      await this.set('data', d2);
      if (secours) { localStorage.setItem(CLE + '-data-ancienne', localStorage.getItem(CLE + '-data')); localStorage.removeItem(CLE + '-data'); }
      return d2;
    }
    return secours || {books: [], goal: 0};
  },
  persist() {
    if (this.bloque) return Promise.resolve();
    this.queue = this.queue.then(async () => {
      const snap = {books, goal, savedAt: new Date().toISOString()};
      let ok = false;
      if (!this.fallback) {
        try {
          await this.set('data', snap); ok = true;
          // La mémoire principale remarche : la copie de secours ne sert plus
          if (localStorage.getItem(CLE + '-data')) localStorage.removeItem(CLE + '-data');
        } catch (e) {}
      }
      if (!ok) localStorage.setItem(CLE + '-data', JSON.stringify(snap));   // peut échouer aussi (mémoire pleine)
      if (this.erreur) { this.erreur = false; paintNotice(); }
    }).catch(() => {
      this.erreur = true; paintNotice();
      toast('⚠️ Pas enregistré : mémoire du téléphone pleine ?');
    });
    return this.queue;
  }
};

/* ---------- Journal de lecture (pages par jour, série, vitesse) ---------- */
function logPage(b, page, date) {
  date = date || today();
  b.journal = (b.journal || []).filter(e => e.date !== date).concat({date, page: +page || 0})
    .sort((x, y) => x.date.localeCompare(y.date)).slice(-400);
}
function activity() {
  const m = {};
  books.forEach(b => {
    const j = b.journal || [];
    for (let i = 1; i < j.length; i++) { const d = j[i].page - j[i - 1].page; if (d > 0) m[j[i].date] = (m[j[i].date] || 0) + d; }
    (b.sessions || []).forEach(s => { if (!m[s.date]) m[s.date] = m[s.date] || 0.001; });
  });
  return m;
}
function streaks(m) {
  const d = new Date(); if (!m[iso(d)]) d.setDate(d.getDate() - 1);
  let cur = 0; while (m[iso(d)]) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  Object.keys(m).sort().forEach(k => {
    const x = new Date(k + 'T00:00');
    run = prev && Math.round((x - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = x;
  });
  return {cur, best};
}
function readings() {
  const out = [];
  books.forEach(b => {
    (b.historique || []).forEach(h => { if (h.fin) out.push({b, fin: h.fin, note: +h.note || 0}); });
    if (b.statut === 'lu' && b.dateFin) out.push({b, fin: b.dateFin, note: +b.note || 0});
  });
  return out;
}
function allSessions() { return books.flatMap(b => (b.sessions || []).map(s => ({...s, b}))); }
// Vitesse de lecture (pages par heure) à partir des séances chronométrées
function speed() {
  let p = 0, m = 0;
  allSessions().forEach(s => { const d = (+s.a || 0) - (+s.de || 0); if (d > 0 && s.min > 0) { p += d; m += s.min; } });
  return m >= 15 ? p / m * 60 : 0;
}

function dateKey(b) { return ((b.statut === 'lu' || b.statut === 'abandon') ? b.dateFin : b.statut === 'en_cours' ? b.dateDebut : '') || b.ajoute || ''; }

function renderCards() {
  const q = Recherche.norm(ui.q);
  let l = books.filter(b => b.statut === ui.tab);
  const trouve = b => Recherche.norm([b.titre, b.auteur, b.genre, b.avis, b.serie, b.isbn, b.pretNom, b.resume, ...(b.sujets || []), ...catsDe(b).map(c => c.nom)].join(' ')).includes(q);
  if (q) l = l.filter(trouve);
  // La recherche regarde aussi les autres onglets : on dit où se trouvent les autres livres qui correspondent
  const ailleurs = q ? Object.keys(STATUTS).filter(k => k !== ui.tab).map(k => [k, books.filter(b => b.statut === k && trouve(b)).length]).filter(x => x[1]) : [];
  if (ui.genre) l = l.filter(b => b.genre === ui.genre);
  if (ui.cat) l = l.filter(b => ui.cat === '_aucune' ? !catsDe(b).length : catsDe(b).some(c => c.id === ui.cat));
  if (ui.own) l = l.filter(b => ui.own === 'completer' ? b.aCompleter : ['numerique', 'audio'].includes(ui.own) ? b.format === ui.own : b.possession === ui.own);
  const by = {
    recent: (a, b) => dateKey(b).localeCompare(dateKey(a)),
    titre: (a, b) => a.titre.localeCompare(b.titre, 'fr'),
    auteur: (a, b) => (a.auteur || '').localeCompare(b.auteur || '', 'fr'),
    serie: (a, b) => (a.serie || '~').localeCompare(b.serie || '~', 'fr') || (+a.tome || 0) - (+b.tome || 0) || a.titre.localeCompare(b.titre, 'fr'),
    note: (a, b) => (b.note || 0) - (a.note || 0),
    // (les livres dont on ne connaît pas le nombre de pages à la fin)
    pages: (a, b) => (+a.pagesTotal || 1e9) - (+b.pagesTotal || 1e9) || a.titre.localeCompare(b.titre, 'fr')
  };
  l.sort((a, b) => (ui.tab === 'a_lire' ? (b.epingle ? 1 : 0) - (a.epingle ? 1 : 0) : 0) || by[ui.sort](a, b));
  $('#list').innerHTML = (ailleurs.length ? `<div class="ailleurs">Aussi dans ${ailleurs.map(([k, n]) => `<button type="button" class="chipb" data-tab="${k}">${STATUTS[k]} (${n})</button>`).join(' ')}</div>` : '') +
    (l.length ? l.map(prefs.view === 'grille' ? gcard : card).join('') :
    `<div class="empty">${q || ui.genre || ui.own || ui.cat ? 'Aucun livre ne correspond dans cet onglet.' : !books.length ? ACCUEIL : EMPTY[ui.tab]}</div>`);
}

function progress(b) {
  const tot = +b.pagesTotal || 0, cur = +b.pageActuelle || 0;
  return {tot, cur, pct: tot ? Math.min(100, Math.round(cur / tot * 100)) : 0};
}
function loanChip(b) {
  if (b.possession === 'prete') return `<span class="chip">📤 Prêté${b.pretNom ? ' à ' + esc(b.pretNom) : ''}</span>`;
  if (b.possession === 'emprunte') {
    const late = b.pretRetour && b.pretRetour < today(), soon = b.pretRetour && !late && b.pretRetour <= addDays(3);
    return `<span class="chip ${late ? 'late' : soon ? 'warn' : ''}">📥 ${b.pretRetour ? (late ? 'En retard ! ' : 'À rendre le ') + fdate(b.pretRetour) : 'Emprunté'}</span>`;
  }
  return '';
}
function card(b) {
  let extra = '', acts = '';
  const fois = (b.historique || []).length;
  if (b.statut === 'en_cours') {
    const p = progress(b), v = speed();
    const reste = p.tot && v ? ` · ≈ ${fdur((p.tot - p.cur) / v * 60)} restantes` : '';
    extra = p.tot ? `<div class="meta">p. ${p.cur} / ${p.tot} · ${p.pct} %${reste}</div><div class="bar"><i style="width:${p.pct}%"></i></div>`
      : (b.dateDebut ? `<div class="meta">Commencé le ${fdate(b.dateDebut)}</div>` : '');
    acts = `<button class="btn" data-act="timer">⏱️ Lire</button><button class="btn" data-act="pages">Où j'en suis</button><button class="btn" data-act="quote">＋ Citation</button><button class="btn pri" data-act="fini">J'ai fini ✓</button>`;
  } else if (b.statut === 'a_lire') {
    extra = (b.pagesTotal ? `<div class="meta">${esc(b.pagesTotal)} pages</div>` : '') +
      (b.resume ? `<div class="a resum">${esc(b.resume)}</div>` : '');
    acts = `<button class="btn ${b.epingle ? 'on' : ''}" data-act="pin" title="Épingler en haut">📌 ${b.epingle ? 'Épinglé' : 'Épingler'}</button><button class="btn pri" data-act="start">Commencer</button>`;
  } else if (b.statut === 'lu') {
    extra = `<div class="meta">${scoreHtml(b.note)}${b.dateFin ? `<span>Fini le ${fdate(b.dateFin)}</span>` : ''}${fois ? `<span class="chip">Lu ${fois + 1} fois</span>` : ''}</div>` +
      (b.avis ? `<div class="a avis">${esc(b.avis)}</div>` : '');
  } else {
    const p = progress(b);
    extra = `<div class="meta">${p.tot && p.cur ? `<span>Arrêté p. ${p.cur} / ${p.tot}</span>` : ''}${b.dateFin ? `<span>le ${fdate(b.dateFin)}</span>` : ''}</div>`;
    acts = `<button class="btn" data-act="resume">Reprendre</button>`;
  }
  const chips = [b.aCompleter ? '<span class="chip warn">⚠️ À compléter</span>' : '', serieLabel(b) ? `<span class="chip">${esc(serieLabel(b))}</span>` : '',
    b.genre ? `<span class="chip">${esc(b.genre)}</span>` : '', b.format !== 'papier' ? `<span class="chip">${FORMATS[b.format].split(' ')[0]}</span>` : '', loanChip(b)].join('');
  return `<article class="card" data-id="${esc(b.id)}">${coverHtml(b)}<div class="info">
      <div class="t">${b.epingle && b.statut === 'a_lire' ? '📌 ' : ''}${esc(b.titre)}</div>${b.auteur ? `<div class="a">${esc(b.auteur)}</div>` : ''}
      ${chips.trim() ? `<div class="meta">${chips}</div>` : ''}
      ${extra}${acts ? `<div class="acts">${acts}</div>` : ''}</div></article>`;
}
function gcard(b) {
  let extra = '';
  if (b.statut === 'en_cours') { const p = progress(b); if (p.tot) extra = `<div class="bar"><i style="width:${p.pct}%"></i></div>`; }
  return `<article class="gcard" data-id="${esc(b.id)}">${b.statut === 'lu' && b.note ? scoreHtml(b.note, 'gscore') : ''}${coverHtml(b, '')}${b.epingle && b.statut === 'a_lire' ? '<span class="pin">📌</span>' : ''}
    <div class="t">${esc(b.titre)}${b.tome ? ' <span class="a">T.' + esc(b.tome) + '</span>' : ''}</div>${extra}</article>`;
}

function renderStats() {
  const all = readings();
  const thisYear = new Date().getFullYear();
  const years = [...new Set([thisYear, ...all.map(r => +r.fin.slice(0, 4)).filter(Boolean)])].sort((a, b) => b - a);

  const ly = all.filter(r => r.fin.startsWith(String(y)));
  const pages = ly.reduce((s, r) => s + (+r.b.pagesTotal || 0), 0);
  const noted = ly.filter(r => r.note > 0);
  const moy = noted.length ? noted.reduce((s, r) => s + r.note, 0) / noted.length : 0;
  const act = activity(), st = streaks(act);
  const ses = allSessions(), sesY = ses.filter(s => (s.date || '').startsWith(String(y)));
  const minY = sesY.reduce((s, x) => s + (+x.min || 0), 0), v = speed();

  const monday = new Date(); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
  const weeks = [];
  for (let w = 7; w >= 0; w--) { const s = new Date(monday); s.setDate(s.getDate() - 7 * w); weeks.push({start: s, n: 0, min: 0}); }
  const wk = k => { const d = new Date(k + 'T00:00'); return weeks.findIndex(x => d >= x.start && d - x.start < 7 * 864e5); };
  Object.entries(act).forEach(([k, n]) => { const w = wk(k); if (w >= 0) weeks[w].n += Math.round(n); });
  ses.forEach(s => { const w = wk(s.date); if (w >= 0) weeks[w].min += +s.min || 0; });
  const wmax = Math.max(1, ...weeks.map(w => w.n));
  const thisWeek = weeks[7];

  const perM = Array(12).fill(0); ly.forEach(r => { const m = +r.fin.slice(5, 7); if (m) perM[m - 1]++; });
  const max = Math.max(1, ...perM);
  const g = {}; ly.forEach(r => { const k = r.b.genre || 'Sans genre'; g[k] = (g[k] || 0) + 1; });
  const gl = Object.entries(g).sort((a, b) => b[1] - a[1]);
  const pct = goal ? Math.min(100, Math.round(ly.length / goal * 100)) : 0;
  const s = ly.length > 1 ? 's' : '';

  $('#main').innerHTML = `
    <div class="tools"><select id="year" aria-label="Année">${years.map(v2 => `<option ${v2 === y ? 'selected' : ''}>${v2}</option>`).join('')}</select></div>

      <div class="tile"><b>${moy ? moy.toFixed(1).replace('.', ',') : '–'}</b><span>note moyenne / 5</span></div>
      <div class="tile"><b>🔥 ${st.cur}</b><span>jour${st.cur > 1 ? 's' : ''} d'affilée · record ${st.best}</span></div>
      <div class="tile"><b>${minY ? fdur(minY) : '–'}</b><span>de lecture chronométrée en ${y}</span></div>
      <div class="tile"><b>${v ? Math.round(v) : '–'}</b><span>pages par heure${v ? '' : ' (utilise ⏱️ Lire)'}</span></div>
    </div>
    ${y === thisYear ? `<div class="panel"><h3>Mon objectif ${y}</h3>
      ${goal ? `<div class="meta" style="margin-bottom:6px">${ly.length} / ${goal} livres · ${pct} %</div><div class="bar"><i style="width:${pct}%"></i></div>`
             : '<div class="a">Pas encore d\'objectif. Combien de livres veux-tu lire cette année ?</div>'}
      <div class="search" style="margin-top:10px"><input id="goal" type="number" min="0" inputmode="numeric" placeholder="Nombre de livres" value="${goal || ''}"><button class="btn" data-goal>${goal ? 'Changer' : 'Valider'}</button></div></div>` : ''}
    ${defisPanel(y)}
    <div class="panel"><h3>Pages lues par semaine</h3>
      <div class="a" style="margin:-4px 0 8px">Cette semaine : <b>${plural(thisWeek.n, 'page')}</b>${thisWeek.min ? ` en ${fdur(thisWeek.min)}` : ''}${thisWeek.n ? ` · ${Math.round(thisWeek.n / ((new Date().getDay() + 6) % 7 + 1))} par jour en moyenne` : ''}</div>
      <div class="chart green">${weeks.map(w => `<div><div class="col"><em>${w.n || ''}</em><i style="height:${w.n / wmax * 100}%"></i></div>${w.start.getDate()}/${w.start.getMonth() + 1}</div>`).join('')}</div>
      <div class="a" style="font-size:.78rem;margin-top:6px">Compté avec « Où j'en suis » et « ⏱️ Lire ».</div></div>

      `<div><div class="col"><em>${n || ''}</em><i style="height:${n / max * 100}%"></i></div>${MOIS[i]}</div>`).join('')}</div></div>
    <div class="panel"><h3>Par genre</h3>${gl.length ? gl.map(([k, n]) =>

      : `<div class="a">Aucun livre fini en ${y}.</div>`}</div>
    ${categoriesPanel()}
    ${seriesPanel()}
    ${loansPanel()}
    ${bilan(y, ly)}
    <div class="panel"><h3>Exporter ma liste</h3><div class="a" style="margin-bottom:10px">Tous tes livres (et tes citations dans le PDF), à garder ou à imprimer.</div>
      <div class="acts"><button class="btn pri" data-export="excel">📊 Excel</button><button class="btn pri" data-export="pdf">📄 PDF</button></div></div>

// Catégories déduites des classements des catalogues (BnF, Sudoc…) : un livre peut en avoir plusieurs

const sansClassement = () => books.filter(b => !b.aCompleter && b.titre && !b.classTente && !(b.classements || []).length);
function categoriesPanel() {
  if (!books.length) return '';

  books.forEach(b => { const cs = catsDe(b); if (!cs.length) sans++; cs.forEach(c => { n[c.id] = (n[c.id] || 0) + 1; if (b.statut === 'lu') lus[c.id] = (lus[c.id] || 0) + 1; }); });
  const l = Recherche.CATS.filter(c => n[c.id]).sort((a, b) => n[b.id] - n[a.id]);
  const total = l.reduce((s, c) => s + n[c.id], 0), classes = books.length - sans, top = Math.max(1, ...l.map(c => n[c.id]));
  const aChercher = sansClassement().length;

    ${sans ? `<button type="button" class="hb catrow" data-cat="_aucune"><span>❔ Sans catégorie</span><div class="bar"></div><span>${sans}</span></button>` : ''}
    ${total > classes ? `<div class="a" style="font-size:.78rem;margin-top:6px">Un livre peut avoir plusieurs catégories : le total (${total}) dépasse le nombre de livres classés (${classes}).</div>` : ''}
    ${aChercher ? `<div class="acts" style="margin-top:8px"><button class="btn small" type="button" id="catfill">🔄 Chercher les catégories de ${plural(aChercher, 'livre')}</button></div><div class="a" style="font-size:.82rem" id="catfillres"></div>` : ''}</div>`;
}
const catView = {sort: 'titre'};
function openCategorie(id) {
  const cat = Recherche.CATS.find(c => c.id === id);
  const l = books.filter(b => id === '_aucune' ? !catsDe(b).length : catsDe(b).some(c => c.id === id));
  const by = {
    titre: (a, b) => a.titre.localeCompare(b.titre, 'fr'),
    auteur: (a, b) => (a.auteur || '~').localeCompare(b.auteur || '~', 'fr') || a.titre.localeCompare(b.titre, 'fr'),
    pages: (a, b) => (+a.pagesTotal || 1e9) - (+b.pagesTotal || 1e9) || a.titre.localeCompare(b.titre, 'fr')
  };
  l.sort(by[catView.sort]);
  $('#modal').innerHTML = `<h2>${cat ? cat.e + ' ' + esc(cat.nom) : '❔ Sans catégorie'} <span class="a" style="font-weight:400">(${plural(l.length, 'livre')})</span></h2>
    <div class="lbl" style="margin-bottom:4px">Trier par</div>
    <div class="seg" id="cv_sort">${[['titre', 'Titre'], ['auteur', 'Auteur'], ['pages', 'Pages']].map(([k, v]) => `<button type="button" data-v="${k}" class="${catView.sort === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    ${id === '_aucune' ? '<div class="hint">Les catalogues ne donnent pas (encore) de classement pour ces livres. Ouvre un livre → 🏷️ Catégories pour lui en ajouter une à la main.</div>' : ''}
    <div class="catlist">${l.map(b => `<button type="button" class="catline" data-open="${esc(b.id)}">${coverHtml(b, 'mini')}<span class="grow"><b>${esc(b.titre)}</b><br>
      <span class="a">${esc(b.auteur || 'Auteur inconnu')}${b.pagesTotal ? ' · ' + esc(b.pagesTotal) + ' p.' : ''}</span><br>
      <span class="chip">${STATUT_UN[b.statut] || ''}</span> ${catsDe(b).filter(c => c.id !== id).map(c => `<span class="chip">${c.e} ${esc(c.nom)}</span>`).join(' ')}</span></button>`).join('')}</div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close type="button">Fermer</button></div>`;
  showM();
  $('#cv_sort').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; catView.sort = b.dataset.v; openCategorie(id); };
}
// Classements d'un livre déjà enregistré (une seule tentative réussie par livre ; en cas de panne réseau, on réessaiera)
async function fillClass(b) {
  const r = await Recherche.classement(b);
  const i = books.findIndex(z => z.id === b.id); if (i < 0) return false;
  const nb = {...books[i], classTente: true};
  if (r.classements.length) nb.classements = Recherche.unirClassements([nb.classements, r.classements]);
  books[i] = nb;
  return r.classements.length > 0;
}
let catFillBusy = false;
async function fillCategories() {
  if (catFillBusy) return;
  if (navigator.onLine === false) return toast('Pas de connexion internet');
  catFillBusy = true;
  const todo = sansClassement();
  let ok = 0, k = 0, pannes = 0;
  for (const b of todo) {
    const el = $('#catfillres'), bt = $('#catfill');
    if (el) el.textContent = `Recherche ${++k} / ${todo.length} : ${b.titre}…`; else k++;
    if (bt) bt.disabled = true;
    try { if (await fillClass(b)) ok++; pannes = 0; } catch (e) { if (++pannes >= 3) break; }
    if (k % 5 === 0) await Store.persist();
    await new Promise(r => setTimeout(r, 700));
  }
  await Store.persist(); catFillBusy = false;
  if (ui.tab === 'stats') renderStats();
  toast(pannes >= 3 ? 'Les catalogues ne répondent pas : réessaie plus tard' : `Catégories trouvées pour ${plural(ok, 'livre')} sur ${todo.length}`);
}

/* ---------- 🗓️ Calendrier de lecture (une case par jour) ---------- */
function calendarPanel(y) {
  const act = activity(), minBy = {}, finBy = {};
  allSessions().forEach(s => { minBy[s.date] = (minBy[s.date] || 0) + (+s.min || 0); });
  readings().forEach(r => { (finBy[r.fin] = finBy[r.fin] || []).push(r.b.titre); });
  const start = new Date(y, 0, 1), offset = (start.getDay() + 6) % 7;   // lundi en haut
  const days = Math.round((new Date(y, 11, 31) - start) / 864e5) + 1, t = today();
  const cells = []; let jours = 0;
  for (let i = 0; i < offset; i++) cells.push('<i style="visibility:hidden"></i>');
  for (let i = 0; i < days; i++) {
    const k = iso(new Date(y, 0, 1 + i)), p = Math.round(act[k] || 0), m = minBy[k] || 0;
    const lvl = finBy[k] ? 5 : (p >= 100 || m >= 90) ? 4 : (p >= 50 || m >= 45) ? 3 : (p >= 20 || m >= 20) ? 2 : (p > 0 || m > 0 || act[k]) ? 1 : 0;
    if (lvl) jours++;
    cells.push(`<i class="l${lvl}${k > t ? ' f' : ''}${k === t ? ' now' : ''}" data-day="${k}"></i>`);
  }
  const months = MOIS_COURT.map((m, i) => `<span style="grid-column:${Math.floor((offset + Math.round((new Date(y, i, 1) - start) / 864e5)) / 7) + 1}">${m}</span>`).join('');
  return `<div class="panel"><h3>🗓️ Mon année de lecture</h3>
    <div class="a" style="margin:-4px 0 8px">${plural(jours, 'jour')} de lecture en ${y}</div>
    <div class="cal" id="cal"><div class="calm">${months}</div><div class="calg">${cells.join('')}</div></div>
    <div class="calleg"><span class="a" id="calinfo" style="font-size:.8rem">Touche un jour pour voir le détail.</span><span class="sp"></span>
      moins <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> plus · <i class="l5"></i> livre fini</div></div>`;
}
function dayInfo(k) {
  const p = Math.round(activity()[k] || 0);
  const m = allSessions().filter(s => s.date === k).reduce((s, x) => s + (+x.min || 0), 0);
  const fin = readings().filter(r => r.fin === k).map(r => r.b.titre);
  const parts = [p ? plural(p, 'page') : '', m ? fdur(m) + ' chronométrées' : '', fin.length ? '🎉 fini : ' + fin.join(', ') : ''].filter(Boolean);
  $('#calinfo').textContent = fdate(k) + ' : ' + (parts.length ? parts.join(' · ') : 'rien de noté');
}

/* ---------- 🏆 Défis et badges ---------- */
function defis(y) {
  const Y = String(y);
  const ly = readings().filter(r => r.fin.startsWith(Y));
  const genres = new Set(ly.map(r => r.b.genre).filter(Boolean)).size;
  const pave = ly.filter(r => +r.b.pagesTotal > 500).length;
  const sprint = ly.filter(r => r.b.dateDebut && r.b.dateFin === r.fin && (new Date(r.fin) - new Date(r.b.dateDebut)) / 864e5 < 7).length;
  const ser = {}; ly.forEach(r => { if (r.b.serie) { const k = Recherche.norm(r.b.serie); ser[k] = (ser[k] || 0) + 1; } });
  const act = activity(), actY = {}; Object.keys(act).filter(k => k.startsWith(Y)).forEach(k => actY[k] = act[k]);
  const best = streaks(actY).best;
  const cit = allQuotes().filter(x => (x.q.date || '').startsWith(Y)).length;
  const minY = allSessions().filter(s => (s.date || '').startsWith(Y)).reduce((s, x) => s + (+x.min || 0), 0);
  const emp = ly.filter(r => r.b.possession === 'emprunte').length;
  const fmt = ly.filter(r => r.b.format === 'audio' || r.b.format === 'numerique').length;
  let run = 0, bestM = 0, prev = 0;
  [...new Set(ly.map(r => +r.fin.slice(5, 7)))].sort((a, b) => a - b).forEach(m => { run = m === prev + 1 ? run + 1 : 1; bestM = Math.max(bestM, run); prev = m; });
  const relu = books.filter(b => (b.historique || []).length && ly.some(r => r.b.id === b.id)).length;
  return [
    ['premier', '🌱', 'Premier pas', 'Finir un livre', ly.length, 1],
    ['dix', '📚', 'Bibliophile', 'Finir 10 livres', ly.length, 10],
    ['vingtcinq', '🏛️', 'Grand lecteur', 'Finir 25 livres', ly.length, 25],
    ['cinquante', '👑', 'Dévoreur', 'Finir 50 livres', ly.length, 50],
    ['genres', '🌈', 'Explorateur', 'Lire 5 genres différents', genres, 5],
    ['pave', '🧱', 'Pavé', 'Finir un livre de plus de 500 pages', pave, 1],
    ['sprint', '⚡', 'Sprint', 'Finir un livre en moins d\'une semaine', sprint, 1],
    ['serie', '🔗', 'Marathon', 'Lire 3 tomes d\'une même série', Math.max(0, ...Object.values(ser)), 3],
    ['semaine', '🔥', 'Régulier', 'Lire 7 jours d\'affilée', best, 7],
    ['mois', '🌕', 'Assidu', 'Lire 30 jours d\'affilée', best, 30],
    ['constant', '📅', 'Constant', 'Finir un livre 3 mois de suite', bestM, 3],
    ['citations', '✍️', 'Collectionneur', 'Noter 10 citations', cit, 10],
    ['chrono', '⏱️', 'Concentré', 'Lire 10 h avec le chrono', Math.floor(minY / 60), 10],
    ['mediatheque', '🏫', 'Habitué', 'Lire 3 livres empruntés', emp, 3],
    ['format', '🎧', 'Touche-à-tout', 'Finir un livre audio ou numérique', fmt, 1],
    ['relecture', '🔁', 'Fidèle', 'Relire un livre', relu, 1],
    ...(goal ? [['objectif', '🎯', 'Objectif atteint', 'Lire ' + goal + ' livres dans l\'année', ly.length, goal]] : [])
  ].map(([id, e, nom, desc, n, but]) => ({id, e, nom, desc, n: Math.min(n, but), but, ok: n >= but}));
}
function defisPanel(y) {
  const d = defis(y), ok = d.filter(x => x.ok).length;
  return `<div class="panel"><h3>🏆 Mes défis ${y}</h3><div class="a" style="margin:-4px 0 10px">${ok} / ${d.length} réussis</div>
    <div class="badges">${d.map(x => `<div class="badge ${x.ok ? 'ok' : ''}"><div class="be">${x.e}</div><b>${esc(x.nom)}</b><span>${esc(x.desc)}</span>
      ${x.ok ? '<span class="won">Réussi ✓</span>' : `<div class="bar"><i style="width:${Math.round(x.n / x.but * 100)}%"></i></div><span>${x.n} / ${x.but}</span>`}</div>`).join('')}</div></div>`;
}
// Félicite quand un nouveau défi est réussi (une fois par défi et par année)
function checkBadges(silent) {
  const y = new Date().getFullYear(), d = defis(y), won = d.filter(x => x.ok).map(x => x.id);
  prefs.badges = prefs.badges || {};
  const before = prefs.badges[y];
  prefs.badges[y] = won; savePrefs();
  if (silent || !before) return;
  d.filter(x => x.ok && !before.includes(x.id)).forEach((x, i) => toastLater(`🏆 Défi réussi : ${x.e} ${x.nom} !`, 1400 + i * 2600));
}
// Attend que le message en cours (avec bouton) soit fini avant d'en afficher un autre
function toastLater(msg, delay) {
  setTimeout(function tryShow() { if ($('#toast').classList.contains('act')) return setTimeout(tryShow, 1500); toast(msg); }, delay || 1000);
}

function nextCandidates() {
  return books.filter(b => b.statut === 'a_lire').filter(b => {
    const p = +b.pagesTotal || 0;
    if (pick.len === 'court' && !(p && p < 250)) return false;
    if (pick.len === 'moyen' && !(p >= 250 && p <= 450)) return false;
    if (pick.len === 'long' && !(p > 450)) return false;
    if (pick.genre && b.genre !== pick.genre) return false;
    if (pick.cat && !catsDe(b).some(c => c.id === pick.cat)) return false;
    if (pick.dispo && !['a_moi', 'emprunte'].includes(b.possession)) return false;
    return true;
  });
}
async function drawNext() {
  let c = nextCandidates();
  if (c.length > 1) c = c.filter(b => b.id !== pick.last);
  const box = $('#nx_res');
  if (!c.length) { box.innerHTML = '<div class="hint">Aucun livre ne correspond à ces envies. Essaie d\'élargir un peu.</div>'; return; }
  $('#nx_go').disabled = true;
  for (let k = 0; k < 12; k++) { box.innerHTML = `<div class="nxspin">${esc(c[Math.floor(Math.random() * c.length)].titre)}</div>`; await new Promise(r => setTimeout(r, 55 + k * 14)); }
  // Un peu plus de chances pour les livres épinglés et ceux à rendre bientôt
  const w = b => 1 + (b.epingle ? 2 : 0) + (b.possession === 'emprunte' && b.pretRetour ? 3 : 0);
  let r = Math.random() * c.reduce((s, b) => s + w(b), 0), b = c[0];
  for (const x of c) { r -= w(x); if (r <= 0) { b = x; break; } }
  pick.last = b.id;
  const v = speed();
  const why = [b.epingle ? '📌 épinglé' : '', b.possession === 'emprunte' && b.pretRetour ? '📥 à rendre le ' + fdate(b.pretRetour) : '',
    b.pagesTotal ? (+b.pagesTotal || 0) + ' pages' + (v ? ' (≈ ' + fdur(b.pagesTotal / v * 60) + ')' : '') : ''].filter(Boolean).join(' · ');
  box.innerHTML = `<div class="nxcard">${coverHtml(b, 'big')}<div style="min-width:0"><div class="t">${esc(b.titre)}</div><div class="a">${esc(b.auteur || '')}</div>
    ${b.genre ? `<span class="chip">${esc(b.genre)}</span>` : ''}<div class="a" style="font-size:.85rem;margin-top:4px">${why}</div>
    <div class="acts"><button class="btn pri" id="nx_start" type="button">📖 Je commence</button><button class="btn" id="nx_again" type="button">Un autre</button></div></div></div>`;
  $('#nx_go').disabled = false;
  $('#nx_start').onclick = () => { closeM(); quick('start', b); };
  $('#nx_again').onclick = drawNext;
}

function addSuggestion(x) {
  if (findOwned(x)) return toast('Déjà dans ta liste');
  const b = bookFrom(x, 'a_lire');
  b.id = newId(); setCovers(b, x.couverture, x.covers || []);
  Object.assign(b, {resume: x.resume || '', sujets: x.sujets || [], genre: x.genre || b.genre, possession: 'non', resumeTente: true});
  save(b, '＋ Ajouté à « À lire » 📚');
  // Pas encore de couverture vérifiée (recherche par thème) : on garde la première qui existe vraiment
  if (!b.couverture && (x.covers || []).length) Recherche.couverture(x.covers).then(u => {
    const i = books.findIndex(z => z.id === b.id);
    if (u && i >= 0 && !books[i].couverture) { books[i] = {...books[i]}; setCovers(books[i], u, x.covers); Store.persist(); }
  });
  if (!b.classTente && !(b.classements || []).length) autoClass(b.id);
}
async function drawOnline(themeId, box, btn) {

    const w = b.statut === 'abandon' ? -1 : b.statut === 'lu' ? (b.note >= 4 ? 3 : b.note && b.note <= 2 ? -0.5 : 2) : 1;
    const ids = new Set(catsDe(b).map(c => THEME_DE_CAT[c.id]).filter(Boolean));
    if (!ids.size && THEME_DE_GENRE[b.genre]) ids.add(THEME_DE_GENRE[b.genre]);
    ids.forEach(id => poids[id] = (poids[id] || 0) + w);
    if (b.statut === 'lu' && b.note >= 4 && b.auteur) aimes.push(b);

// Clic sur une suggestion : ajouter, refuser (remplacée par une autre), lire le résumé en entier
async function onSuggestion(e) {
  const more = e.target.closest('[data-more]'); if (more) { more.classList.toggle('open'); return true; }
  const a = e.target.closest('[data-sug]'); if (!a) return false;
  const card = a.closest('.sug'), ctx = card.dataset.ctx, i = +card.dataset.i;
  const items = ctx === 'sel' ? prefs.selection.items : ctx === 'rech' ? rech.res : ctx === 'rechx' ? rech.inconnus : [lastOnline];
  const x = items[i]; if (!x) return true;
  const carte = ctx === 'rech' || ctx === 'rechx' ? rechCard : sugCard;
  if (a.dataset.sug === 'fiche') { ficheDepuis(x); return true; }
  if (a.dataset.sug === 'add') { addSuggestion(x); card.outerHTML = carte(x, ctx, i); return true; }
  if (a.dataset.sug === 'non') {
    prefs.nonMerci = [...(prefs.nonMerci || []), Recherche.norm(x.titre)].slice(-300); savePrefs();
    card.innerHTML = '<div class="nxspin">Je cherche un autre livre…</div>';
    const y = await Recherche.decouvrir(x.theme, {exclude: b => dejaVu(b) || items.some(z => Recherche.norm(z.titre) === Recherche.norm(b.titre))}).catch(() => null);
    if (y) { retenir(y); items[i] = y; } else items.splice(i, 1);
    savePrefs(); renderDecouvrir();
    return true;
  }
  return false;
}

/* ---------- 📤 Partager mon bilan en image ---------- */
function loadCors(list) {
  return new Promise(async res => {
    for (const u of list) {
      const ok = await new Promise(r => {
        const i = new Image(); const t = setTimeout(() => r(null), 6000);
        if (!/^data:/.test(u)) i.crossOrigin = 'anonymous';
        i.onload = () => { clearTimeout(t); r(Recherche.placeholder(i.naturalWidth, i.naturalHeight) ? null : i); };
        i.onerror = () => { clearTimeout(t); r(null); };
        i.src = u;
      });
      if (ok) return res(ok);
    }
    res(null);
  });
}

// Revenir à la bibliothèque d'avant la dernière restauration
async function annulerRestauration() {
  let c = null;
  try { c = await Store.get('avant-restauration'); } catch (e) {}
  if (!c || !Array.isArray(c.books)) return toast('Pas de copie de sécurité disponible');
  // Échange : la bibliothèque actuelle devient à son tour la copie (on peut donc toujours revenir en arrière)
  try { await Store.set('avant-restauration', {books, goal, date: new Date().toISOString()}); }
  catch (e) { return toast('Impossible pour l\'instant (mémoire pleine ?)'); }
  fillStop = true;
  books = c.books.map(norm); goal = entier(c.goal) || 0;
  await Store.persist();
  prefs.avantRestauration = new Date().toISOString(); savePrefs();
  render(); toast('Bibliothèque précédente remise ✓', {label: 'Annuler', fn: annulerRestauration});
}

/* ---------- Enregistrer / supprimer ---------- */
function save(b, msg, action) {
  if (!b.id) b.id = newId();
  if (!b.ajoute) b.ajoute = new Date().toISOString();
  const i = books.findIndex(x => x.id === b.id);
  if (i >= 0) books[i] = b; else books.push(b);
  render(); if (msg) toast(msg, action);
  checkBadges();
  return Store.persist();
}
function remove(b) {
  const i = books.findIndex(x => x.id === b.id); if (i < 0) return;
  books.splice(i, 1); render(); Store.persist();
  toast('Livre supprimé', {label: 'Annuler', fn: () => { books.splice(Math.min(i, books.length), 0, b); render(); Store.persist(); toast('Livre remis ✓'); }});
}
function blankBook(statut) {
  return {titre: '', auteur: '', genre: '', note: 0, couverture: '', statut, citations: [], journal: [], historique: [], sessions: [],
    format: 'papier', possession: statut === 'a_lire' ? 'non' : 'a_moi'};
}
function bookFrom(x, statut) {
  const b = {...blankBook(statut), titre: x.titre, auteur: x.auteur || '', serie: x.serie || '', tome: x.tome || '',
    pagesTotal: x.pagesTotal || '', isbn: x.isbn || '', editeur: x.editeur || '', annee: x.annee || '', genre: x.genre || '', possession: 'a_moi',
    sujets: x.sujets || [], classements: x.classements || []};
  if (b.classements.length) b.classTente = true;
  if (statut === 'en_cours') { b.dateDebut = today(); logPage(b, 0); }
  return b;
}
// Ce livre est-il déjà dans ma liste ? (même ISBN, ou même titre + auteur, et même tome si les deux en ont un)
function findOwned(x, exceptId) {
  const n = Recherche.norm, sn = Recherche.surname;
  const sameTome = b => !b.tome || !x.tome || String(b.tome) === String(x.tome);
  const sameTitle = b => n(b.titre) === n(x.titre) || (b.serie && x.serie && b.tome && x.tome && n(b.serie) === n(x.serie));
  return books.find(b => b.id !== exceptId && x.isbn && b.isbn === x.isbn) ||
    books.find(b => b.id !== exceptId && !b.aCompleter && sameTitle(b) && sameTome(b) && (!sn(b.auteur) || !sn(x.auteur) || sn(b.auteur) === sn(x.auteur)));
}

function quick(act, b) {
  if (act === 'start' || act === 'resume') {
    const nb = {...b, statut: 'en_cours', dateDebut: b.dateDebut || today(), dateFin: ''};
    logPage(nb, nb.pageActuelle || 0);
    save(nb, act === 'start' ? 'Bonne lecture ! 📖' : 'C\'est reparti ! 📖');
  }
  else if (act === 'pin') save({...b, epingle: !b.epingle}, b.epingle ? 'Désépinglé' : 'Épinglé en haut 📌');
  else if (act === 'fini') openForm({...b, statut: 'lu', dateFin: today(), pageActuelle: b.pagesTotal || b.pageActuelle}, {finish: true});
  else if (act === 'pages') openPage(b);
  else if (act === 'quote') openQuote(b);
  else if (act === 'timer') startTimer(b);
}
// Après avoir fini un tome : proposer le suivant
function afterFinish(b) {
  if (!b.serie || !b.tome) return;
  const next = +b.tome + 1;
  if (books.some(x => Recherche.norm(x.serie) === Recherche.norm(b.serie) && +x.tome === next)) return;
  setTimeout(() => toast(`Fini ! Ajouter le tome ${next} de ${b.serie} ?`, {label: '＋ Tome ' + next, fn: () => addNextTome(b.serie, next)}), 900);
}
function addNextTome(serie, n) {
  openForm(null, {statut: 'a_lire', query: serie + ' ' + n});
}

/* ---------- Fenêtres ---------- */
function showM() { $('#ov').classList.add('show'); $('#modal').scrollTop = 0; modalModifie = false; }
function closeM() { $('#ov').classList.remove('show'); form = null; }

function openPage(b) {
  $('#modal').innerHTML = `<h2>Où en es-tu ?</h2><p class="a" style="margin-top:-6px">${esc(b.titre)}</p>
    <div class="f"><label for="p_val">Page actuelle${b.pagesTotal ? ' (sur ' + esc(b.pagesTotal) + ')' : ''}</label>
    <input id="p_val" type="number" min="0" inputmode="numeric" value="${esc(b.pageActuelle)}"></div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="p_ok">Enregistrer</button></div>`;
  showM();
  const inp = $('#p_val'); inp.focus(); inp.select();
  const ok = () => {
    const n = parseInt(inp.value, 10);
    if (isNaN(n) || n < 0) return toast('Indique un numéro de page');
    closeM();
    const tot = +b.pagesTotal || 0;
    const nb = {...b, pageActuelle: tot ? Math.min(n, tot) : n};
    logPage(nb, nb.pageActuelle);
    if (tot && n >= tot) return openForm({...nb, statut: 'lu', dateFin: today()}, {finish: true});
    const d = n - (+b.pageActuelle || 0);
    save(nb, d > 0 ? `+${plural(d, 'page')} 👏` : 'Page enregistrée');
  };
  $('#p_ok').onclick = ok;
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
}

function openQuote(b) {
  $('#modal').innerHTML = `<h2>Nouvelle citation</h2><p class="a" style="margin-top:-6px">${esc(b.titre)}</p>
    <div class="f"><label for="c_txt">La phrase</label><textarea id="c_txt" rows="4" placeholder="Une phrase qui t'a marqué…"></textarea></div>
    <div class="f"><label for="c_page">Page</label><input id="c_page" type="number" min="0" inputmode="numeric" value="${esc(b.pageActuelle)}"></div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="c_ok">Enregistrer</button></div>`;
  showM(); $('#c_txt').focus();
  $('#c_ok').onclick = () => {
    const texte = $('#c_txt').value.trim(); if (!texte) return toast('Écris la citation');
    closeM();
    save({...b, citations: [...(b.citations || []), {texte, page: $('#c_page').value, date: today()}]}, 'Citation ajoutée ✍️');
  };
}

    form.catNon = (form.catNon || []).filter(c => c !== id);

  };

    const any = e.target.closest('[data-anyway]'); if (any) return fillFrom(lastRes[+any.dataset.anyway]);
    const btn = e.target.closest('[data-res]'); if (btn) pickResult(+btn.dataset.res);
  };
  $('#f_linkok').onclick = () => {
    const u = $('#f_link').value.trim();
    if (!/^https:\/\//i.test(u)) return toast('Le lien doit commencer par https://');
    setCovers(form, u, []); form._covers = null; $('#linkbox').hidden = true; paintPrev();
  };
  $('#f_qadd').onclick = () => {
    const texte = $('#f_qt').value.trim(); if (!texte) return toast('Écris la citation');
    form.citations.push({texte, page: $('#f_qp').value, date: today()});
    $('#f_qt').value = ''; $('#f_qp').value = ''; paintQuotes();

  $('#f_save').onclick = async () => {
    collect();
    if (!form.titre) { toast('Il faut au moins un titre'); $('#f_titre').focus(); return; }
    const f = form;
    if (!f.couverture && (f._covers || []).length) {
      $('#f_save').textContent = 'Couverture…';
      setCovers(f, await Promise.race([Recherche.couverture(f._covers), new Promise(r => setTimeout(() => r(''), 3500))]), f._covers);
    }
    delete f._covers;
    const orig = books.find(x => x.id === f.id) || {};
    if (f.statut === 'lu' && f.pagesTotal && !f.pageActuelle) f.pageActuelle = f.pagesTotal;
    if (f.statut === 'en_cours' && (orig.statut !== 'en_cours' || +orig.pageActuelle !== +f.pageActuelle)) logPage(f, f.pageActuelle || 0);
    if (f.statut === 'lu' && orig.statut !== 'lu' && f.pagesTotal) logPage(f, f.pagesTotal);
    const moved = orig.statut && orig.statut !== f.statut;
    closeM();
    save(f, !orig.statut || moved ? `Rangé dans « ${STATUTS[f.statut]} »` : 'Enregistré ✓');
    if (f.couverture) brokenCovers.delete(f.id);
    if (!f.couverture) autoCover(f.id);
    if (!f.resume && !f.resumeTente) autoResume(f.id);
    else if (!f.classTente && !(f.classements || []).length) autoClass(f.id);
    if (f.statut === 'lu' && orig.statut !== 'lu') afterFinish(f);
  };
  const del = $('#f_del');
  if (del) del.onclick = () => {
    if (!del.classList.contains('sure')) { del.classList.add('sure'); del.textContent = 'Sûr ? Supprimer'; return; }
    const id = form.id; closeM(); remove(books.find(x => x.id === id) || {id});
  };
  const rr = $('#f_reread');
  if (rr) rr.onclick = () => {
    const o = books.find(x => x.id === form.id); if (!o) return;
    const nb = {...o, historique: [...(o.historique || []), {debut: o.dateDebut, fin: o.dateFin, note: o.note}],
      statut: 'en_cours', dateDebut: today(), dateFin: '', pageActuelle: 0, note: 0};
    logPage(nb, 0); closeM(); save(nb, 'Bonne relecture ! 🔁');
  };
  if (opts.query) doSearch();
  else if (isNew) $('#s_q').focus();
}

function collect() {
  const num = v => { const n = parseInt(v, 10); return isNaN(n) || n < 0 ? '' : n; };
  Object.assign(form, {
    titre: $('#f_titre').value.trim(), auteur: $('#f_auteur').value.trim(), statut: $('#f_statut').value,
    serie: $('#f_serie').value.trim(), tome: num($('#f_tome').value),
    genre: $('#f_genre').value.trim(), pageActuelle: num($('#f_page').value), pagesTotal: num($('#f_total').value),
    dateDebut: $('#f_debut').value, dateFin: $('#f_fin').value, avis: $('#f_avis').value.trim(), resume: $('#f_resume').value.trim(),
    format: $('#f_format').value, possession: $('#f_pos').value, pretNom: $('#f_pnom').value.trim(), pretRetour: $('#f_pret').value,
    isbn: Recherche.toIsbn13($('#f_isbn').value) || $('#f_isbn').value.replace(/[^0-9X]/gi, ''), editeur: $('#f_edit').value.trim(), annee: $('#f_annee').value.trim()
  });
  const pending = $('#f_qt').value.trim();
  if (pending) form.citations.push({texte: pending, page: $('#f_qp').value, date: today()});
  if (form.statut !== 'lu' && form.statut !== 'abandon') form.dateFin = '';
  if (form.statut !== 'a_lire') form.epingle = false;
  if (!['prete', 'emprunte'].includes(form.possession)) { form.pretNom = ''; form.pretRetour = ''; }
  if (!form.serie) form.tome = '';
  if (form.titre) form.aCompleter = false;
}
function syncShow() {
  const s = $('#f_statut').value;
  document.querySelectorAll('#modal [data-show]').forEach(el => el.hidden = !el.dataset.show.split(' ').includes(s));
  $('#l_fin').textContent = s === 'abandon' ? 'Arrêté le' : 'Fini le';

function syncLoan() {
  const p = $('#f_pos').value;
  $('#loanRow').hidden = !['prete', 'emprunte'].includes(p);
  $('#l_pnom').textContent = p === 'prete' ? 'Prêté à' : 'Emprunté à (médiathèque, ami…)';
  if (p === 'emprunte' && !$('#f_pret').value) $('#f_pret').value = addDays(21);

function paintStars() { document.querySelectorAll('#f_note button').forEach(b => b.classList.toggle('on', +b.dataset.n <= (form.note || 0))); }
function paintQuotes() {
  $('#f_quotes').innerHTML = form.citations.map((q, i) =>

}
function paintPrev() {
  const has = coverList(form).length > 0;
  $('#prev').innerHTML = coverHtml({titre: ($('#f_titre') && $('#f_titre').value) || form.titre || '?', couverture: form.couverture, _covers: form._covers}, 'big') +
    `<div class="btns"><button class="btn" type="button" id="f_find">🔍 ${has ? 'Autre' : 'Trouver une'} couverture</button>
     <button class="btn" type="button" id="f_photo">📷 Photo</button>
     <button class="btn" type="button" id="f_linkbtn">🔗 Lien d'image</button>
     ${has ? '<button class="btn" type="button" id="f_nocov">Retirer</button>' : ''}</div>`;
  $('#f_find').onclick = findCovers;
