    syncShow();
  };
  $('#f_pos').onchange = syncLoan;
  $('#f_getres').onclick = () => fetchResume({titre: $('#f_titre').value, auteur: $('#f_auteur').value, isbn: $('#f_isbn').value,
    serie: $('#f_serie').value, tome: $('#f_tome').value}, $('#f_getres'));
  $('#f_titre').oninput = () => { if (!coverList(form).length) paintPrev(); };
  $('#f_note').onclick = e => { const n = +(e.target.dataset.n || 0); if (!n) return; form.note = form.note === n ? 0 : n; paintStars(); };
  $('#s_go').onclick = () => doSearch();
  $('#s_q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } };
  $('#s_scan').onclick = openScanner;
  $('#s_res').onclick = e => {
    const op = e.target.closest('[data-openown]'); if (op) { const o = books.find(x => x.id === op.dataset.openown); closeM(); if (o) openForm(o); return; }
    const any = e.target.closest('[data-anyway]'); if (any) { doublonAccepte = true; return fillFrom(lastRes[+any.dataset.anyway]); }
    const btn = e.target.closest('[data-res]'); if (btn) pickResult(+btn.dataset.res);
  };
  $('#f_linkok').onclick = () => {
    const u = $('#f_link').value.trim();
    if (!/^https:\/\//i.test(u)) return toast('Le lien doit commencer par https://');
    setCovers(form, u, []); form._covers = null; $('#linkbox').hidden = true; paintPrev();
  };
  $('#f_qadd').onclick = () => {
    const texte = $('#f_qt').value.trim(); if (!texte) return toast('Écris la citation');
    form.citations.push({texte, page: $('#f_qp').value, date: today()});
    $('#f_qt').value = ''; $('#f_qp').value = ''; paintQuotes();
  };
  $('#f_quotes').onclick = e => { const x = e.target.closest('[data-qdel]'); if (x) { form.citations.splice(+x.dataset.qdel, 1); paintQuotes(); } };
  $('#f_save').onclick = async () => {
    collect();
    if (!form.titre) return erreurChamp('f_titre', 'Il faut au moins un titre');
    // Nouveau livre déjà présent (même ISBN, ou même titre et auteur) : on demande avant d'en faire un doublon
    const double = isNew && !doublonAccepte && findOwned(form);
    if (double && !(await demander(`Tu as déjà « ${double.titre} » dans « ${STATUT_UN[double.statut]} ». L'ajouter quand même ?`, 'Ajouter quand même', 'Annuler'))) return;
    const f = reprendreArrierePlan(form);
    if (!f.couverture && (f._covers || []).length) {
      $('#f_save').textContent = 'Couverture…';
      setCovers(f, await Promise.race([Recherche.couverture(f._covers), new Promise(r => setTimeout(() => r(''), 3500))]), f._covers);
    }
    delete f._covers;
    const orig = books.find(x => x.id === f.id) || {};
    if (f.statut === 'lu' && f.pagesTotal && !f.pageActuelle) f.pageActuelle = f.pagesTotal;
    if (f.statut === 'en_cours' && (orig.statut !== 'en_cours' || +orig.pageActuelle !== +f.pageActuelle)) logPage(f, f.pageActuelle || 0);
    if (f.statut === 'lu' && orig.statut !== 'lu' && f.pagesTotal) logPage(f, f.pagesTotal);
    const moved = orig.statut && orig.statut !== f.statut;
    closeM();
    save(f, !orig.statut || moved ? `Rangé dans « ${STATUTS[f.statut]} »` : 'Enregistré ✓');
    if (f.couverture) brokenCovers.delete(f.id);
    if (!f.couverture) autoCover(f.id);
    if (!f.resume && !f.resumeTente) autoResume(f.id);
    else if (!f.classTente && !(f.classements || []).length) autoClass(f.id);
    if (f.statut === 'lu' && orig.statut !== 'lu') afterFinish(f);
  };
  const del = $('#f_del');
  if (del) del.onclick = () => {
    if (!del.classList.contains('sure')) { del.classList.add('sure'); del.textContent = 'Sûr ? Supprimer'; return; }
    const id = form.id; closeM(); remove(books.find(x => x.id === id) || {id});
  };
  const rr = $('#f_reread');
  if (rr) rr.onclick = () => {
    const o = books.find(x => x.id === form.id); if (!o) return;
    const nb = {...o, historique: [...(o.historique || []), {debut: o.dateDebut, fin: o.dateFin, note: o.note}],
      statut: 'en_cours', dateDebut: today(), dateFin: '', pageActuelle: 0, note: 0};
    logPage(nb, 0); closeM(); save(nb, 'Bonne relecture ! 🔁');

// Origine du nombre de pages affiché dans la fiche ouverte : rempli depuis un catalogue, d'origine, ou tapé à la main
let formBase = null, pagesAuto = null, formRef = null, doublonAccepte = false;
// Pendant que la fiche était ouverte, le livre enregistré a pu être complété en arrière-plan (résumé, catégories, couverture…)
// ou changé dans une autre fenêtre : on reprend ces changements pour tout ce que la fiche n'a pas modifié
function reprendreArrierePlan(f) {
  const now = books.find(x => x.id === f.id);
  if (!formRef || !now || now === formRef) return f;
  const s = v => JSON.stringify(v === undefined ? null : v);
  for (const k of new Set([...Object.keys(now), ...Object.keys(formRef)])) {
    if (k.startsWith('_')) continue;
    if (s(now[k]) !== s(formRef[k]) && s(f[k]) === s(formRef[k])) f[k] = now[k];
  }
  return f;
}
function sourcePages(v) {
  const n = parseInt(v, 10); if (!(n > 0)) return '';
  if (pagesAuto && +pagesAuto.v === n) return pagesAuto.s;
  if (formBase && +formBase.pagesTotal === n) return formBase.pagesSource || '';
  return 'manuel';
}

// En arrière-plan, un livre à la fois : ajoute résumé, thèmes et genre aux livres qui n'en ont pas
const resumeQueue = [];
let resumeBusy = false;
function autoResume(id) {
  if (!resumeQueue.includes(id)) resumeQueue.push(id);
  if (resumeBusy) return;
  resumeBusy = true;
  (async () => {
    while (resumeQueue.length) {
      const b = books.find(x => x.id === resumeQueue.shift());
      if (!b || b.resume || b.aCompleter) continue;
      const r = await Recherche.resume(b).catch(() => ({}));
      const i = books.findIndex(x => x.id === b.id); if (i < 0) continue;
      const nb = {...books[i], resumeTente: true};
      if (r.resume) nb.resume = r.resume;
      if (r.sujets && r.sujets.length && !(nb.sujets || []).length) nb.sujets = r.sujets;
      if ((r.classements || []).length && !(nb.classements || []).length) { nb.classements = r.classements; nb.classTente = true; }
      if (!nb.genre && r.genre) nb.genre = r.genre;
      books[i] = nb; Store.persist(); if (r.resume && ui.tab === nb.statut) renderCards();
      if (!(nb.classements || []).length && !nb.classTente) autoClass(nb.id);
      await new Promise(res => setTimeout(res, 800));
    }
    resumeBusy = false;
  })();
}

// En arrière-plan, un livre à la fois : classement des catalogues (catégories) des livres qui n'en ont pas
const classQueue = [];
let classBusy = false;
function autoClass(id) {
  if (!classQueue.includes(id)) classQueue.push(id);
  if (classBusy || navigator.onLine === false) return;
  classBusy = true;
  (async () => {
    while (classQueue.length) {
      const b = books.find(x => x.id === classQueue.shift());
      if (!b || b.aCompleter || b.classTente || (b.classements || []).length) continue;
      try { await fillClass(b); Store.persist(); } catch (e) {}
      await new Promise(res => setTimeout(res, 800));
    }
    classBusy = false;
  })();
}

const SRC_ICON = {ok: '<span class="ok">✓</span>', rien: '–', attente: '…', quota: '<span class="ko">⛔</span>', erreur: '<span class="ko">✗</span>'};
function statusHtml(st) { return Object.entries(st).map(([k, v]) => `<span>${esc(k)} ${SRC_ICON[v] || ''}</span>`).join(''); }

async function doSearch(auto) {
  const q = $('#s_q').value.trim(); if (!q) return;
  // (la fiche ouverte au moment de la recherche : si elle a été fermée ou remplacée entre-temps, on ne touche à rien)
  const box = $('#s_res'), tok = (doSearch.tok = (doSearch.tok || 0) + 1), f = form;
  const isbn = Recherche.toIsbn13(q);
  if (!isbn && Recherche.looksLikeIsbn(q) && !/[a-z]/i.test(q.replace(/isbn/i, ''))) {

  }
  box.innerHTML = squelettes(2);
  const onSt = st => { if (tok === doSearch.tok && form === f && $('#s_st')) $('#s_st').innerHTML = statusHtml(st); };
  let res = [];
  try { res = isbn ? await Recherche.parIsbn(isbn, onSt) : await Recherche.parTexte(q, onSt); } catch (e) {}
  if (tok !== doSearch.tok || !form || form !== f || !$('#s_res')) return;
  lastRes = res;
  if (res.length) {
    box.innerHTML = res.map(resultHtml).join('');
    if (isbn && auto && res.length === 1) pickResult(0);
    return;
  }
  const st = Recherche.dernierStatut || {};
  const googleTip = st.Google === 'quota' && !prefs.googleKey ? '<br>💡 Google Books est saturé en ce moment : ajoute ta clé gratuite dans ⚙️ Réglages pour fouiller aussi son catalogue.' : '';
  const reseau = Object.values(st).every(v => v === 'erreur') ? '<br>📶 Aucune source n\'a répondu : vérifie ta connexion internet.' : '';
  if (isbn) {
    if (!form.isbn) { form.isbn = isbn; $('#f_isbn').value = isbn; }
    box.innerHTML = `<div class="hint">Code <b>${esc(isbn)}</b> bien lu ✓, mais aucun catalogue ne connaît ce livre (souvent : très récent, auto-édité ou imprimé à l'étranger).<br>
      👉 Tape plutôt son <b>titre</b> dans la recherche ci-dessus, ou remplis la fiche à la main : le code est déjà noté.${googleTip}${reseau}</div>`;

    box.innerHTML = `<div class="hint">Rien trouvé pour « ${esc(q)} ».<br>👉 Essaie juste le titre (sans l'auteur), ou juste le nom de l'auteur, ou vérifie l'orthographe.${googleTip}${reseau}</div>`;

function pickResult(i) {

  if (own) {
    $('#s_res').innerHTML = `<div class="hint">📚 Tu as déjà <b>${esc(own.titre)}</b> dans « ${STATUT_UN[own.statut]} ».
      <div class="acts"><button class="btn pri small" type="button" data-openown="${esc(own.id)}">Ouvrir sa fiche</button><button class="btn small" type="button" data-anyway="${i}">L'ajouter quand même</button></div></div>`;

function fillFrom(x) {
  const f = form;

  // (une information absente du catalogue n'efface jamais ce qui est déjà dans la fiche)
  $('#f_titre').value = x.titre; if (x.auteur) $('#f_auteur').value = x.auteur;
  if (x.pagesTotal) { $('#f_total').value = x.pagesTotal; pagesAuto = {v: x.pagesTotal, s: x.pagesSource || (x.isbn ? 'edition' : 'estimation')}; paintPagesSrc(); }
  if (x.serie) { $('#f_serie').value = x.serie; $('#f_tome').value = x.tome || ''; }
  if (x.isbn) $('#f_isbn').value = x.isbn;
  if (x.editeur) $('#f_edit').value = x.editeur;
  if (x.annee) $('#f_annee').value = x.annee;

  if (!$('#f_genre').value && x.genre) $('#f_genre').value = x.genre;
  // Classements du catalogue (pour ranger le livre par catégorie)
  if ((x.classements || []).length) { f.classements = Recherche.unirClassements([f.classements, x.classements]); f.classTente = true; }
  if ((x.sujets || []).length && !(f.sujets || []).length) f.sujets = x.sujets;
  paintCats();
  if (!f.couverture || f.aCompleter) { f.couverture = ''; f._covers = x.covers || []; paintPrev(); }
  $('#s_res').innerHTML = ''; $('#s_st').innerHTML = '';
  $('#modal details').open = false;
  toast('Infos remplies ✓');
  // En arrière-plan : vraie couverture + infos manquantes (pages, ISBN…)
  Recherche.couverture(x.covers).then(async u => {
    if (form !== f || f.couverture) return;
    if (u) { setCovers(f, u, x.covers); f._covers = null; return paintPrev(); }
    // Aucune des couvertures habituelles : recherche élargie (titre, auteur, autres éditions…)
    const l = await Recherche.chercherCouvertures({titre: x.titre, auteur: x.auteur, isbn: x.isbn, serie: x.serie, tome: x.tome}, 5).catch(() => []);
    if (form === f && !f.couverture && l.length) { setCovers(f, l[0], l); f._covers = null; paintPrev(); }
  });
  if (!x.pagesTotal || !x.isbn) Recherche.completer(x).then(y => {
    if (form !== f) return;
    if (!$('#f_total').value && y.pagesTotal) {
      // (pages de l'édition dont on reprend aussi l'ISBN, sinon d'une autre édition : estimation)
      const memeEd = !$('#f_isbn').value && y.isbn && y.pagesSource === 'edition';
      $('#f_total').value = y.pagesTotal; pagesAuto = {v: y.pagesTotal, s: memeEd ? 'edition' : 'estimation'}; paintPagesSrc();
    }
    if (!$('#f_isbn').value && y.isbn) $('#f_isbn').value = y.isbn;
    if (!$('#f_edit').value && y.editeur) $('#f_edit').value = y.editeur;
    if (!$('#f_annee').value && y.annee) $('#f_annee').value = y.annee;
    if (!coverList(f).length && y.covers && y.covers.length) { f._covers = y.covers; paintPrev(); }
  });
}

/* ---------- Photos : couverture et code-barres ---------- */
function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function fileToCover(file) {
  const img = await loadImage(file), W = 240, H = 360;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const k = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
  c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  let q = 0.8, d;
  do { d = c.toDataURL('image/jpeg', q); q -= 0.1; } while (d.length > 45000 && q > 0.2);
  URL.revokeObjectURL(img.src);
  return d;
}
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  // Lecteur de secours ZXing 0.21.3 (licence Apache 2.0, voir zxing-LICENSE.txt), rangé avec l'appli :
  // aucun site tiers n'est contacté, et personne d'autre ne peut modifier ce code
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function decodeBarcode(file) {
  const img = await loadImage(file);
  const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  if (await lecteurIntegre()) {
    try { const r = await new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']}).detect(c); if (r.length) return r[0].rawValue; } catch (e) {}
  }
  await loadZXing();
  const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(c.toDataURL('image/jpeg', 0.9));
  return r.getText();
}
$('#pick_cover').onchange = async e => {
  const f = e.target.files[0]; if (!f || !form) return;
  try { setCovers(form, await fileToCover(f), []); form._covers = null; paintPrev(); toast('Couverture ajoutée ✓'); }
  catch (err) { toast('Image illisible'); }

/* ---------- Caméra : lecture du code-barres en direct ---------- */
// Le lecteur intégré à Chrome existe parfois sans pouvoir lire (téléphones sans services Google) :
// on vérifie qu'il sait lire les codes de livres, sinon on prend le lecteur de secours (ZXing)
let lecteurOk = null;
async function lecteurIntegre() {
  if (lecteurOk === null) {
    try { lecteurOk = 'BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('ean_13'); }
    catch (e) { lecteurOk = false; }
  }
  return lecteurOk;
}
// Un code n'est accepté que s'il est lu 2 fois de suite et que son chiffre de contrôle est bon.
async function startCamera(video, onCode) {
  if (await lecteurIntegre()) {
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
    video.srcObject = stream; await video.play();
    const det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a']});
    let alive = true, last = '', n = 0;
    const loop = async () => {
      if (!alive) return;
      try {
        const r = await det.detect(video);
        const c = ((r.find(x => /^97[89]/.test(x.rawValue)) || r[0]) || {}).rawValue;
        if (c) { n = c === last ? n + 1 : 1; last = c; if (n >= 2) { n = 0; onCode(c); } }
      } catch (e) {}
      if (alive) setTimeout(loop, 120);
    };
    loop();
    return () => { alive = false; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; };
  }
  await loadZXing();
  const reader = new ZXing.BrowserMultiFormatReader();
  let stopped = false;
  reader.decodeFromConstraints({video: {facingMode: 'environment'}}, video, res => { if (res && !stopped) onCode(res.getText()); });
  return () => { stopped = true; reader.reset(); };
}
function cameraError(err) {
  toast(err && err.name === 'NotAllowedError' ? 'Caméra refusée : autorise-la dans les réglages de Chrome' : 'Caméra indisponible : prends une photo');
}

/* ---------- Compléter automatiquement les fiches existantes ---------- */
const needsFill = b => (b.aCompleter && !!Recherche.toIsbn13(b.isbn || '')) || !b.aCompleter && b.titre && (!b.couverture || brokenCovers.has(b.id) || !b.pagesTotal || (!b.resume && !b.resumeTente) ||
  (!b.classTente && !(b.classements || []).length));
// Résumé, thèmes et genre (une seule tentative par livre)
async function fillResume(b) {
  if (b.resume) return false;
  const r = await Recherche.resume(b).catch(() => ({}));
  const i = books.findIndex(z => z.id === b.id); if (i < 0) return false;
  const nb = {...books[i], resumeTente: true};
  if (r.resume) nb.resume = r.resume;
  if (r.sujets && r.sujets.length && !(nb.sujets || []).length) nb.sujets = r.sujets;
  if ((r.classements || []).length && !(nb.classements || []).length) { nb.classements = r.classements; nb.classTente = true; }
  if (!nb.genre && r.genre) nb.genre = r.genre;
  books[i] = nb;
  return !!r.resume;
}
// Livre scanné « à compléter » : on réessaie par son ISBN (utile après un scan sans internet)
async function completerScan(b) {
  const isbn = Recherche.toIsbn13(b.isbn || ''); if (!isbn) return false;
  const x = (await Recherche.parIsbn(isbn).catch(() => []))[0];
  if (!x) {
    // Les catalogues ont répondu « inconnu » (et non « pas de réseau ») : inutile de le redemander à chaque ouverture
    const vals = Object.values(Recherche.dernierStatut || {});
    const panne = navigator.onLine === false || !vals.length || vals.every(v => v === 'erreur' || v === 'quota');
    const i = books.findIndex(z => z.id === b.id);
    if (!panne && i >= 0 && books[i].horsLigne) { books[i] = {...books[i], horsLigne: false}; Store.persist(); }
    return false;
  }
  const u = await Recherche.couverture(x.covers || []).catch(() => '');
  const i = books.findIndex(z => z.id === b.id);
  if (i < 0 || !books[i].aCompleter) return false;   // complété à la main entre-temps : on n'y touche pas
  const o = books[i], nb = {...o, titre: x.titre, auteur: x.auteur || '', serie: x.serie || '', tome: x.tome || '', aCompleter: false, horsLigne: false};
  for (const f of ['pagesTotal', 'editeur', 'annee', 'genre', 'resume']) if (!nb[f] && x[f]) nb[f] = x[f];
  if (nb.pagesTotal && !o.pagesTotal) nb.pagesSource = 'edition';   // (trouvé par son ISBN : pages de cette édition)
  if (!(nb.sujets || []).length && (x.sujets || []).length) nb.sujets = x.sujets;
  if ((x.classements || []).length) { nb.classements = Recherche.unirClassements([nb.classements, x.classements]); nb.classTente = true; }
  if (!nb.couverture && u) setCovers(nb, u, x.covers);
  books[i] = nb;
  return true;
}
let reprisesEnCours = false;
async function reprendreScans() {
  if (reprisesEnCours || navigator.onLine === false || Store.bloque) return;
  const todo = books.filter(b => b.aCompleter && b.horsLigne && Recherche.toIsbn13(b.isbn || ''));
  if (!todo.length) return;
  reprisesEnCours = true;
  let ok = 0;
  for (const b of todo) { if (await completerScan(b).catch(() => false)) ok++; await new Promise(r => setTimeout(r, 700)); }
  reprisesEnCours = false;
  if (ok) { await Store.persist(); render(); toast(`📶 Internet est revenu : ${plural(ok, 'livre scanné')} complété${ok > 1 ? 's' : ''} ✓`); }
}
window.addEventListener('online', () => setTimeout(reprendreScans, 1500));
async function fillOne(b) {
  if (b.aCompleter) return completerScan(b);
  const actuel = () => books.find(z => z.id === b.id) || b;
  let changed = false;
  // Fiche (couverture, pages…) seulement s'il en manque : sinon, pas besoin de tout rechercher
  if (!(b.couverture && !brokenCovers.has(b.id) && b.pagesTotal)) changed = await fillFiche(b);
  changed = (await fillResume(actuel())) || changed;
  // Classement des catalogues (pour ranger le livre par catégorie)
  const c = actuel();

  return changed;

// Applique ce qu'on a trouvé sur la fiche LA PLUS RÉCENTE du livre, seulement dans les cases encore vides :
// une modification faite pendant la recherche (ou une restauration) n'est jamais écrasée
function appliquer(id, patch, couv) {
  const i = books.findIndex(z => z.id === id); if (i < 0) return false;
  const nb = {...books[i]}; let change = false;
  for (const [f, v] of Object.entries(patch)) if (f !== 'pagesSource' && v && !nb[f]) { nb[f] = v; change = true; }
  // (l'origine du nombre de pages n'est notée que si ce nombre vient d'être rempli ici)
  if (patch.pagesSource && patch.pagesTotal && nb.pagesTotal === patch.pagesTotal && !books[i].pagesTotal) nb.pagesSource = patch.pagesSource;
  if (couv && couv.u && (!nb.couverture || brokenCovers.has(id))) { setCovers(nb, couv.u, couv.list); brokenCovers.delete(id); change = true; }
  if (change) books[i] = nb;
  return change;
}
async function fillFiche(b) {

  if (!res.length) res = await Recherche.parTexte(b.titre + (b.auteur ? ' ' + b.auteur : '') + (b.tome ? ' ' + b.tome : '')).catch(() => []);
  // Le résultat doit vraiment être le même livre (même titre, même auteur, même tome), en français de préférence
  const same = res.filter(r => (n(r.titre) === n(b.titre) || (b.serie && r.serie && n(r.serie) === n(b.serie) && String(r.tome) === String(b.tome)))
    && (!sn(b.auteur) || sn(r.auteur) === sn(b.auteur)) && (!b.tome || !r.tome || String(r.tome) === String(b.tome)));
  const x = same.find(r => r.langue === 'fre') || same[0];
  const coverMissing = !b.couverture || brokenCovers.has(b.id);
  if (!x) {
    // Fiche introuvable : on peut au moins chercher une couverture
    if (!coverMissing) return false;
    const l = await Recherche.chercherCouvertures(b, 5).catch(() => []);
    return l.length ? appliquer(b.id, {}, {u: l[0], list: l}) : false;
  }
  const y = (!x.pagesTotal || !x.isbn) ? await Recherche.completer(x) : x;
  const patch = {};
  // Trouvé par le titre : on ne connaît pas l'édition exacte → pas d'ISBN ni d'éditeur (ce serait peut-être faux)
  for (const f of byIsbn ? ['auteur', 'pagesTotal', 'isbn', 'editeur', 'annee', 'genre'] : ['auteur', 'pagesTotal', 'genre']) if (y[f]) patch[f] = y[f];
  // Trouvé par l'ISBN : pages de cette édition ; trouvé par le titre : celles d'une autre édition, peut-être (estimation)
  if (patch.pagesTotal) patch.pagesSource = byIsbn ? y.pagesSource || 'edition' : 'estimation';
  // Série : seulement si le livre n'en a pas, que la fiche vient d'un catalogue (BnF/Sudoc) et que le titre colle
  const serieOk = !b.serie && x.serie && x.tome && (x.sources || []).some(s => s === 'BnF' || s === 'Sudoc') && n(x.titre) === n(b.titre);
  let couv = null;
  if (coverMissing) {
    let u = await Recherche.couverture(y.covers), list = y.covers;
    if (!u) { list = await Recherche.chercherCouvertures(b, 5).catch(() => []); u = list[0] || ''; }
    couv = {u, list};
  }
  const i = books.findIndex(z => z.id === b.id);
  if (serieOk && i >= 0 && !books[i].serie) { books[i] = {...books[i], serie: x.serie, tome: x.tome}; }
  appliquer(b.id, patch, couv);
  return true;
}
let fillBusy = false, fillStop = false;
async function fillAll(onProgress) {
  // Une seule fois à la fois (deux boutons touchés = un seul travail)
  if (fillBusy) return {ok: 0, ko: 0, deja: true};
  fillBusy = true; fillStop = false;
  // Un livre à la fois, avec une petite pause : les catalogues publics n'aiment pas être bombardés
  const todo = books.filter(needsFill);
  let ok = 0, ko = 0;
  for (const b of todo) {
    if (fillStop) break;   // (une restauration a remplacé les livres : on s'arrête)
    if (!books.some(z => z.id === b.id)) continue;
    onProgress(`Recherche ${ok + ko + 1} / ${todo.length} : ${b.titre}…`);
    (await fillOne(b).catch(() => false)) ? ok++ : ko++;
    if ((ok + ko) % 5 === 0) { await Store.persist(); render(); }
    await new Promise(r => setTimeout(r, 600));
  }
  fillBusy = false;
  await Store.persist(); render();
  return {ok, ko};
}
$('#settingsBtn').onclick = openSettings;

/* ---------- Clics et saisies ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  // (« Annuler » : comme la touche retour, on demande avant de perdre une fiche modifiée)
  if (e.target.closest('[data-close]')) return fermerFenetre();
  if (e.target.closest('[data-ajouter]')) return openAjout();
  if (e.target.closest('[data-effacer]')) { Object.assign(ui, {q: '', genre: '', cat: '', own: ''}); return render(); }
  if (e.target.id === 'ov') return fermerFenetre();   // toucher le fond grisé : on demande si la fiche a été modifiée
  if (e.target.id === 'timerOv') { $('#timerOv').classList.remove('show'); return paintTimerPill(); }
  if (e.target.closest('#view')) { prefs.view = prefs.view === 'grille' ? 'liste' : 'grille'; savePrefs(); return render(); }
  if (e.target.closest('#dice')) return openNext();
  const ct = e.target.closest('[data-cat]'); if (ct) { catView.sous = ''; return openCategorie(ct.dataset.cat); }
  if (e.target.closest('#catfill')) return fillCategories();
  if (e.target.closest('[data-undorestore]')) return annulerRestauration();
  if (e.target.closest('[data-resave]')) return Store.persist().then(() => { if (!Store.erreur) toast('Enregistré ✓'); });
  if (e.target.closest('[data-more], [data-sug]')) return onSuggestion(e);
  const day = e.target.closest('[data-day]'); if (day) return dayInfo(day.dataset.day);
  const sh = e.target.closest('[data-share]'); if (sh) return shareBilan(+sh.dataset.share);
  const ex = e.target.closest('[data-export]');
  if (ex) return doExport(ex.dataset.export);
  if (e.target.closest('[data-goal]')) {
    goal = parseInt($('#goal').value, 10) || 0; renderStats(); Store.persist();
    return toast(goal ? 'Objectif enregistré 🎯' : 'Objectif retiré');
  }
  const nx = e.target.closest('[data-next]');
  if (nx) { const [s, n] = nx.dataset.next.split('|'); return addNextTome(s, +n); }
  const sr = e.target.closest('[data-serie]');
  if (sr) { ui.tab = 'a_lire'; ui.q = sr.dataset.serie; ui.sort = 'serie'; const c = counts(); if (!books.some(b => b.statut === 'a_lire' && Recherche.norm(b.serie) === Recherche.norm(sr.dataset.serie))) ui.tab = 'lu'; render(); return; }
  const op = e.target.closest('[data-open]');
  if (op) { const b = books.find(x => x.id === op.dataset.open); if (b) openForm(b); return; }
  const qt = e.target.closest('[data-book]');
  if (qt) { const b = books.find(x => x.id === qt.dataset.book); if (b) openForm(b); return; }
  const c = e.target.closest('.card, .gcard');
  if (c && !e.target.closest('.modal')) {
    const b = books.find(x => x.id === c.dataset.id); if (!b) return;
    const act = e.target.closest('[data-act]');
    return act ? quick(act.dataset.act, b) : openForm(b);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; renderCards(); }
  if (e.target.id === 'cq') { ui.cq = e.target.value; renderQuotes(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'genre') { ui.genre = e.target.value; renderCards(); }
  if (e.target.id === 'cat') { ui.cat = e.target.value; renderCards(); }
  if (e.target.id === 'own') { ui.own = e.target.value; renderCards(); }
  if (e.target.id === 'sort') { ui.sort = e.target.value; renderCards(); }
  // (le nombre de filtres actifs suit chaque changement)
  if (['genre', 'cat', 'own', 'sort'].includes(e.target.id) && $('#filtres summary')) $('#filtres summary').innerHTML = filtresTitre();
  if (e.target.id === 'year') { ui.year = +e.target.value; renderStats(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerDessus(); });
// Touche Tab : le focus fait le tour de la fenêtre ouverte sans en sortir
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const o = fenetreOuverte(); if (!o) return;
  const box = $(o + ' .modal') || $(o);
  const f = [...box.querySelectorAll('button,[href],input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent);
  if (!f.length) return;
  const a = f[0], z = f[f.length - 1];
  if (!box.contains(document.activeElement) || (!e.shiftKey && document.activeElement === z)) { e.preventDefault(); a.focus(); }
  // (Maj+Tab depuis le titre, qui n'est pas dans la liste, repart aussi du dernier élément)
  else if (e.shiftKey && (document.activeElement === a || !f.includes(document.activeElement))) { e.preventDefault(); z.focus(); }
});

/* ---------- Touche « retour » d'Android : ferme la fenêtre ouverte (et non toute l'appli) ---------- */
// Quand une fenêtre s'ouvre, on ajoute une étape dans l'historique : « retour » la consomme et ferme la fenêtre.
const FENETRES = ['#askOv', '#scanOv', '#bulkOv', '#timerOv', '#ov'];
let modalModifie = false, retourPose = false, retourIgnore = 0;
const fenetreOuverte = () => FENETRES.find(sel => $(sel).classList.contains('show'));
function syncRetour() {
  const o = !!fenetreOuverte();
  if (o && !retourPose) { history.pushState({fenetre: true}, ''); retourPose = true; }
  else if (!o && retourPose) { retourPose = false; retourIgnore++; history.back(); }
}
// Question « Oui / Non » posée dans l'appli (les fenêtres du navigateur détonnent et ne suivent pas le thème) ;
// répond false si on touche « Non », le fond, ou la touche retour
let reponseQuestion = null;
function demander(question, oui, non) {
  if (reponseQuestion) reponseQuestion(false);
  const avant = document.activeElement;
  $('#askTxt').textContent = question; $('#askOui').textContent = oui || 'Oui'; $('#askNon').textContent = non || 'Non';
  $('#askOv').classList.add('show'); $('#askOui').focus();
  return new Promise(res => { reponseQuestion = ok => { reponseQuestion = null; $('#askOv').classList.remove('show'); if (avant && document.contains(avant)) avant.focus({preventScroll: true}); res(ok); }; });
}
$('#askOui').onclick = () => reponseQuestion && reponseQuestion(true);
$('#askNon').onclick = () => reponseQuestion && reponseQuestion(false);
$('#askOv').onclick = e => { if (e.target.id === 'askOv' && reponseQuestion) reponseQuestion(false); };
// Fiche en cours de saisie : on demande avant de perdre ce qui a été écrit
async function fermerFenetre() {
  if (modalModifie && form && !(await demander('Fermer sans enregistrer ? Ce que tu as écrit sera perdu.', 'Fermer', 'Continuer'))) return false;
  closeM(); return true;
}
function fermerDessus() {
  const o = fenetreOuverte(); if (!o) return false;
  if (o === '#askOv') { if (reponseQuestion) reponseQuestion(false); }
  else if (o === '#scanOv') closeScanner();
  else if (o === '#bulkOv') closeBulk();
  else if (o === '#timerOv') { $('#timerOv').classList.remove('show'); paintTimerPill(); }
  else fermerFenetre();
  return true;
}
window.addEventListener('popstate', () => {
  if (retourIgnore) { retourIgnore--; return; }
  retourPose = false;
  fermerDessus();
  syncRetour();   // une fenêtre reste ouverte (ou la fermeture a été refusée) : on remet l'étape
});
const surveille = new MutationObserver(syncRetour);
FENETRES.forEach(sel => surveille.observe($(sel), {attributes: true, attributeFilter: ['class']}));
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#modal')) modalModifie = true; }, true);
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#modal')) modalModifie = true; }, true);
// Bouton ＋ : un seul bouton pour ajouter (un livre, par son code-barres, ou plusieurs d'affilée)
function openAjout() {
  $('#modal').innerHTML = `<h2>Ajouter</h2>
    <div class="ajout">
      <button type="button" data-ajout="livre"><b><span class="ico i-modifier" aria-hidden="true">✍️</span> Un livre</b><span>Chercher par titre, auteur ou ISBN, ou remplir la fiche à la main</span></button>
      <button type="button" data-ajout="scan"><b><span class="ico i-photo" aria-hidden="true">📷</span> Scanner un code-barres</b><span>Celui au dos du livre</span></button>
      <button type="button" data-ajout="rapide"><b><span class="ico i-colis" aria-hidden="true">📦</span> Scan rapide</b><span>Plusieurs livres d'affilée, ajoutés tout seuls</span></button>
    </div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close type="button">Fermer</button></div>`;
  showM();
  $('#modal .ajout').onclick = e => {
    const c = e.target.closest('[data-ajout]'); if (!c) return;
    if (c.dataset.ajout === 'rapide') { closeM(); return openBulk(); }
    openForm(null);
    if (c.dataset.ajout === 'scan') openScanner();
  };
}
$('#fab').onclick = openAjout;

/* ---------- Glisser le doigt à gauche / à droite pour changer d'onglet ---------- */
const TAB_ORDER = ['en_cours', 'a_lire', 'decouvrir', 'lu', 'abandon', 'citations', 'stats'];
function goTab(dir) {
  const i = TAB_ORDER.indexOf(ui.tab), j = i + dir;
  if (i < 0 || j < 0 || j >= TAB_ORDER.length) return false;
  ui.tab = TAB_ORDER[j]; render(); window.scrollTo(0, 0);
  const m = $('#main'); m.classList.remove('slide-l', 'slide-r'); void m.offsetWidth; m.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
  return true;
}
(() => {
  let sx = 0, sy = 0, st = 0, ok = false;
  // Zones qui défilent déjà à l'horizontale (calendrier, rangées de livres…) : le geste leur appartient
  const zoneLibre = el => el.closest('.cal, .sugs, .tabs, .chips, input, textarea, select, .modal, .notice');
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && !zoneLibre(e.target) && !document.querySelector('.ov.show');
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!ok) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    // Un vrai geste horizontal : assez long, plus horizontal que vertical, assez rapide
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 700) goTab(dx < 0 ? 1 : -1);
  }, {passive: true});
})();

/* ---------- Démarrage ---------- */
(async function init() {
  try {
    const d = await Store.load();
    books = (d.books || []).map(norm);
    goal = +d.goal || 0;
    Store.retenir({...d, books, goal});
    const c = counts();
    if (!c.en_cours && books.length) ui.tab = c.a_lire ? 'a_lire' : 'lu';
    render();
    checkBadges(true);
    // Mise en ligne incomplète (un fichier envoyé sans l'autre) : on le dit au lieu de laisser l'appli se comporter bizarrement
    if (Recherche.VERSION !== VERSION) {
      console.warn('Versions différentes : index.html ' + VERSION + ', recherche.js ' + Recherche.VERSION);
      toastLater('⚠️ Mise à jour incomplète : ferme l\'appli et rouvre-la avec internet.', 1500);
    }
    if (!prefs.astuceGlisser && ('ontouchstart' in window)) { prefs.astuceGlisser = true; savePrefs(); toastLater('👆 Astuce : glisse à gauche ou à droite pour changer d\'onglet', 2500); }
    // Une fois par mois : préparer la sélection de 5 livres (en arrière-plan, s'il y a internet)
    if (navigator.onLine !== false && !ESSAI) { setTimeout(() => genSelection(), 4000); setTimeout(reprendreScans, 8000); }
    if (prefs.timer) paintTimerPill();
  } catch (e) {
    // (rien ne pourrait être enregistré : on cache aussi ce qui ajoute des livres)
    $('#fab').hidden = true; paintNotice();
    $('#main').innerHTML = `<div class="empty">⚠️ <b>Impossible de lire tes livres pour l'instant.</b><br>Ils ne sont <b>pas effacés</b> :
      ferme complètement l'appli puis rouvre-la. Si ça continue, redémarre le téléphone.<br><small>(${esc(e.message || e)})</small><br><br>
      <button class="btn pri" type="button" onclick="location.reload()"><span class="ico i-relire" aria-hidden="true">🔄</span> Réessayer</button></div>`;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !ESSAI) navigator.serviceWorker.register('sw.js').catch(() => {});
  // Page de tests : index.html?tests (mémoire séparée)
  if (ESSAI) { const t = document.createElement('script'); t.src = 'tests-appli.js?' + Date.now(); document.body.appendChild(t); }
})();
</script>
