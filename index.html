<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sécurité : l'appli ne peut parler qu'aux catalogues de livres listés ici (pas de code ni d'envoi vers d'autres sites) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://catalogue.bnf.fr https://www.sudoc.fr https://openlibrary.org https://covers.openlibrary.org https://www.googleapis.com https://itunes.apple.com https://services.dnb.de https://query.wikidata.org https://fr.wikipedia.org; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes lectures</title>
<script>
// Style et thème posés avant le premier affichage (sinon l'appli apparaîtrait un instant en Android clair)
(() => { try {
  const p = JSON.parse(localStorage.getItem((/[?&]tests\b/.test(location.search) ? 'test-' : '') + 'mes-lectures-prefs')) || {}, r = document.documentElement;
  r.dataset.style = ['android', 'actuel', 'carnet'].includes(p.style) ? p.style : 'android';
  r.dataset.theme = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
} catch (e) {} })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#141414">
<style>
/* =====================================================================
   Système de design (phase 1) : un style (data-style) × un thème (data-theme) = une palette.
   Les palettes s'appliquent à la page ET à tout élément portant ces deux attributs (aperçus des Réglages).
   ===================================================================== */
:root{--t-xs:.8125rem;--t-s:.875rem;--t-m:1rem;--t-l:1.125rem;--t-xl:1.375rem;--t-xxl:1.75rem;
  --e-1:4px;--e-2:8px;--e-3:12px;--e-4:16px;--e-5:24px;--e-6:32px;--toucher:48px;--toucher-puce:40px;
  --police-texte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--police-titres:var(--police-texte);
  --n1:#c0392b;--n2:#b4530b;--n3:#8a6100;--n4:#2e7d32;--n5:#0b7f45;--sur-note:#ffffff;--voile:rgba(12,12,12,.55)}
/* Formes de chaque style */
:root,[data-style=android]{--r-s:8px;--r-m:16px;--r-l:28px;--r-pilule:999px;--ombre-1:none;--ombre-2:0 4px 16px rgba(0,0,0,.18);--bordure-carte:0px;--carte:var(--surface-2);--couv-s:30%;--couv-l:34%}
[data-style=actuel]{--r-s:6px;--r-m:12px;--r-l:18px;--r-pilule:999px;--ombre-1:none;--ombre-2:0 4px 16px rgba(0,0,0,.2);--bordure-carte:1px;--carte:var(--surface);--couv-s:28%;--couv-l:34%;--police-titres:var(--police-texte)}
[data-style=carnet]{--r-s:4px;--r-m:10px;--r-l:14px;--r-pilule:10px;--ombre-1:0 1px 3px rgba(60,40,20,.10),0 4px 14px rgba(60,40,20,.08);--ombre-2:0 6px 20px rgba(60,40,20,.18);--bordure-carte:0px;--carte:var(--surface);--couv-s:32%;--couv-l:32%;--police-titres:Georgia,"Times New Roman",serif}
/* Palettes (contrastes vérifiés ≥ 4,5:1, voir le design §3) */
:root,[data-style=android][data-theme=light]{--fond:#f5faf4;--surface:#ffffff;--surface-2:#e6f2e8;--texte:#191c19;--texte-doux:#414941;--trait:#c1c9be;--accent:#1b6c3d;--sur-accent:#ffffff;--accent-doux:#b6f1c4;--sur-accent-doux:#00210e;--barre:#f5faf4;--texte-barre:#191c19;--texte-barre-doux:#414941;--barre-2:#e6f2e8;--danger:#ba1a1a;--alerte:#7a5900;color-scheme:light}
:root:not([data-style])[data-theme=dark],[data-style=android][data-theme=dark]{--fond:#101410;--surface:#181d18;--surface-2:#212a22;--texte:#e0e4dc;--texte-doux:#c0c9bc;--trait:#414941;--accent:#9bd5a8;--sur-accent:#00391a;--accent-doux:#1f5130;--sur-accent-doux:#b6f1c4;--barre:#101410;--texte-barre:#e0e4dc;--texte-barre-doux:#c0c9bc;--barre-2:#212a22;--danger:#ffb4ab;--alerte:#f3c14c;color-scheme:dark}
[data-style=actuel][data-theme=light]{--fond:#f2f2f0;--surface:#ffffff;--surface-2:#f6f6f4;--texte:#141414;--texte-doux:#5f5f5f;--trait:#e4e4e0;--accent:#0b7f45;--sur-accent:#ffffff;--accent-doux:#e0f2e8;--sur-accent-doux:#0a5c33;--barre:#141414;--texte-barre:#ffffff;--texte-barre-doux:#a8a8a8;--barre-2:#262626;--danger:#c0392b;--alerte:#8a5a00;color-scheme:light}
[data-style=actuel][data-theme=dark]{--fond:#0d0d0d;--surface:#191919;--surface-2:#222222;--texte:#f1f1f1;--texte-doux:#a3a3a3;--trait:#2b2b2b;--accent:#2ecc71;--sur-accent:#04210f;--accent-doux:#143022;--sur-accent-doux:#8fe3b0;--barre:#000000;--texte-barre:#ffffff;--texte-barre-doux:#a3a3a3;--barre-2:#1f1f1f;--danger:#ff8a7a;--alerte:#f3c14c;color-scheme:dark}
[data-style=carnet][data-theme=light]{--fond:#f7f3ec;--surface:#fffdf9;--surface-2:#efe7da;--texte:#2b2622;--texte-doux:#5e544b;--trait:#e6ddd0;--accent:#a0461f;--sur-accent:#ffffff;--accent-doux:#f3e2d8;--sur-accent-doux:#7a3214;--barre:#efe7da;--texte-barre:#2b2622;--texte-barre-doux:#5e544b;--barre-2:#e2d6c3;--danger:#b3261e;--alerte:#7a5400;color-scheme:light}
[data-style=carnet][data-theme=dark]{--fond:#1b1815;--surface:#26221e;--surface-2:#2f2a25;--texte:#efe7dd;--texte-doux:#b3a698;--trait:#3d362e;--accent:#e08a5e;--sur-accent:#1b1815;--accent-doux:#3e2a20;--sur-accent-doux:#f3c8b0;--barre:#1b1815;--texte-barre:#efe7dd;--texte-barre-doux:#b3a698;--barre-2:#2f2a25;--danger:#ff8a7a;--alerte:#f0c048;color-scheme:dark}
/* Aperçus de style (Réglages) */
.styles button{display:flex;flex-direction:column;align-items:center;gap:var(--e-1);padding:var(--e-2) var(--e-1)}
.apercu{display:flex;width:52px;height:30px;border-radius:var(--r-s);background:var(--fond);border:1px solid var(--trait);overflow:hidden;padding:4px;gap:4px}
.apercu i{flex:1;background:var(--accent);border-radius:var(--r-s)}
.apercu b{flex:2;background:var(--carte);border-radius:var(--r-s)}
/* ---------- Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--fond)}
body{margin:0;background:var(--fond);color:var(--texte);font:var(--t-m)/1.5 var(--police-texte);-webkit-tap-highlight-color:transparent}
h1,h2,h3,.t,.tile b,.clock,.quote p{font-family:var(--police-titres)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--texte-doux);opacity:1}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--e-4)}
main.wrap{padding-bottom:112px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Mise en page (remplacent les styles en ligne) */
.pile{display:grid;gap:var(--e-2)}.rangee{display:flex;align-items:center;gap:var(--e-2);flex-wrap:wrap}
.etire,.grow,.sp{flex:1}.grow,.min0{min-width:0}.centre{text-align:center;justify-content:center}.invisible{visibility:hidden}
.doux{color:var(--texte-doux)}.fort{color:var(--texte)}.normal{font-weight:400}
.petit{font-size:var(--t-xs)}.moyen{font-size:var(--t-s)}.grand{font-size:var(--t-xxl)}
.mt-1{margin-top:var(--e-1)}.mt-2{margin-top:var(--e-2)}.mt-3{margin-top:var(--e-3)}
.mb-1{margin-bottom:var(--e-1)}.mb-2{margin-bottom:var(--e-2)}.mb-3{margin-bottom:var(--e-3)}.my-2{margin-top:var(--e-2);margin-bottom:var(--e-2)}
.sous-titre{margin:calc(-1 * var(--e-1)) 0 var(--e-2);color:var(--texte-doux);font-size:var(--t-s)}
.remonte{margin-top:calc(-1 * var(--e-2))}
.espace{height:var(--e-3)}
.champ-page{max-width:120px}
.liste-aide{font-size:var(--t-s);padding-left:var(--e-5);margin:0}
.question{margin:var(--e-1) 0 var(--e-4);font-size:var(--t-m)}
/* ---------- En-tête, onglets, bandeau ---------- */
header{position:sticky;top:0;z-index:10;background:var(--barre);color:var(--texte-barre);padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 var(--trait)}
.top{display:flex;align-items:center;gap:var(--e-2);padding:var(--e-3) 0 var(--e-1)}
h1{font-size:var(--t-xl);font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
.flame{background:var(--barre-2);color:var(--texte-barre);border-radius:var(--r-pilule);padding:var(--e-1) var(--e-3);font-weight:700;font-size:var(--t-s)}
.icon{flex:none;width:var(--toucher);height:var(--toucher);border-radius:var(--r-pilule);border:0;background:var(--barre-2);color:var(--texte-barre);font-size:var(--t-l);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tools .icon{background:var(--surface);color:var(--texte);border:1px solid var(--trait)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:var(--toucher);border:0;border-bottom:3px solid transparent;background:none;padding:0 var(--e-3);font:inherit;font-size:var(--t-s);font-weight:600;color:var(--texte-barre-doux);white-space:nowrap;cursor:pointer}
.tab.on{color:var(--texte-barre);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:1.6em;padding:0 var(--e-1);margin-left:var(--e-1);border-radius:var(--r-pilule);background:var(--barre-2);color:var(--texte-barre);font-size:var(--t-xs);font-weight:700}
.tab.on .n,.tab .n.neuf{background:var(--accent);color:var(--sur-accent)}
.notice{display:flex;flex-wrap:wrap;gap:var(--e-2) var(--e-3);align-items:center;justify-content:center;padding:var(--e-2) var(--e-4);background:var(--surface-2);color:var(--texte);font-size:var(--t-s);border-left:4px solid var(--accent)}
.notice.alerte{border-left-color:var(--alerte)}.notice.danger{border-left-color:var(--danger)}
/* ---------- Champs ---------- */
.tools{display:flex;gap:var(--e-2);padding:var(--e-3) 0;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:var(--t-m);color:var(--texte);background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-s);padding:var(--e-2) var(--e-3);min-height:var(--toucher);width:100%}
textarea{line-height:1.5}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.tools input,.tools select{border-radius:var(--r-pilule);padding:var(--e-2) var(--e-4);width:auto}
.tools input{flex:1 1 200px;min-width:0}.tools select{flex:1 1 140px;min-width:0}
.f{display:flex;flex-direction:column;gap:var(--e-1);margin-bottom:var(--e-3);min-width:0}
.f>label,.lbl{font-size:var(--t-xs);font-weight:700;color:var(--texte-doux);letter-spacing:.04em;text-transform:uppercase}
.f .erreur{font-size:var(--t-s);color:var(--danger);margin:0;font-weight:600}
input[aria-invalid=true]{border:2px solid var(--danger)}
.row{display:flex;gap:var(--e-3)}.row>.f{flex:1}.row>.f.small{flex:0 0 96px}
.search{display:flex;gap:var(--e-2);align-items:center}.search input{flex:1}
.check{display:flex;gap:var(--e-2);align-items:center;font-size:var(--t-s);min-height:var(--toucher);cursor:pointer}
#f_catadd{width:auto;max-width:100%}
/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--e-2);min-height:var(--toucher);padding:0 var(--e-4);border-radius:var(--r-pilule);border:1px solid var(--trait);background:var(--surface);color:var(--texte);font:inherit;font-size:var(--t-s);font-weight:600;text-decoration:none;cursor:pointer}
.btn.small{position:relative;min-height:var(--toucher-puce);padding:0 var(--e-3)}
.btn.small::after,.chipb::after,.catchip button::after{content:"";position:absolute;inset:-4px 0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}
.btn.on{background:var(--accent-doux);border-color:var(--accent-doux);color:var(--sur-accent-doux)}
.btn.del{color:var(--danger);border-color:var(--danger)}
.btn.del.sure{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.6;cursor:default}
.acts{display:flex;gap:var(--e-2);flex-wrap:wrap;padding-top:var(--e-2);margin-top:auto}
.acts.centre{justify-content:center}
.fab{position:fixed;right:var(--e-5);bottom:var(--e-5);width:60px;height:60px;border-radius:var(--r-l);border:0;background:var(--accent);color:var(--sur-accent);font-size:var(--t-xxl);line-height:1;box-shadow:var(--ombre-2);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
.pill{position:fixed;left:var(--e-4);bottom:var(--e-5);min-height:var(--toucher);border-radius:var(--r-pilule);border:0;background:var(--accent);color:var(--sur-accent);font:inherit;font-weight:700;padding:0 var(--e-4);box-shadow:var(--ombre-2);cursor:pointer;z-index:20}
.seg{display:flex;border:1px solid var(--trait);border-radius:var(--r-pilule);overflow:hidden;margin-bottom:var(--e-3)}
.seg button{flex:1;min-height:var(--toucher);border:0;background:var(--surface);color:var(--texte);font:inherit;font-size:var(--t-s);font-weight:600;padding:0 var(--e-2);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--sur-accent)}
.starpick button{min-width:var(--toucher);min-height:var(--toucher);font-size:var(--t-xxl);background:none;border:0;color:var(--texte-doux);cursor:pointer;padding:0}
.starpick button.on{color:var(--alerte)}
/* ---------- Puces ---------- */
.chips{display:flex;flex-wrap:wrap;gap:var(--e-2);margin-bottom:var(--e-3)}
.chipb{position:relative;min-height:var(--toucher-puce);display:inline-flex;align-items:center;gap:var(--e-1);padding:0 var(--e-3);border:1px solid var(--trait);border-radius:var(--r-pilule);background:var(--surface);color:var(--texte);font:inherit;font-size:var(--t-s);cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}
.chip{display:inline-flex;align-items:center;gap:var(--e-1);border:1px solid var(--trait);border-radius:var(--r-s);padding:1px var(--e-2);font-size:var(--t-xs);font-weight:600;color:var(--texte-doux)}
.chip.warn{border-color:var(--alerte);color:var(--alerte)}
.chip.late{border-color:var(--danger);color:var(--danger);font-weight:700}
.chip.pg{color:var(--texte);border-color:var(--texte)}
.catchip{display:inline-flex;align-items:center;gap:2px}
.catchip button{position:relative;min-width:var(--toucher-puce);min-height:var(--toucher-puce);border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:26px;padding:0 var(--e-2);border-radius:var(--r-s);font-weight:800;font-size:var(--t-s);color:var(--sur-note);background:var(--texte-doux)}
.score small{font-size:var(--t-xs);margin-left:1px}
.n5{background:var(--n5)}.n4{background:var(--n4)}.n3{background:var(--n3)}.n2{background:var(--n2)}.n1{background:var(--n1)}
.stars{color:var(--alerte);letter-spacing:1px}
#rq_cats,#rq_sous,#cv_sous,#dc_theme,#nx_theme,#nx_cat{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#rq_cats::-webkit-scrollbar,#rq_sous::-webkit-scrollbar,#cv_sous::-webkit-scrollbar,#dc_theme::-webkit-scrollbar,#nx_theme::-webkit-scrollbar,#nx_cat::-webkit-scrollbar{display:none}
#rq_cats .chipb,#rq_sous .chipb,#cv_sous .chipb,#dc_theme .chipb,#nx_theme .chipb,#nx_cat .chipb{flex:0 0 auto}
/* ---------- Cartes de livre, couvertures ---------- */
.list{display:grid;gap:var(--e-3)}
.list.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--e-4) var(--e-3)}
.card{display:flex;gap:var(--e-4);background:var(--carte);border:var(--bordure-carte) solid var(--trait);border-radius:var(--r-m);box-shadow:var(--ombre-1);padding:var(--e-3);cursor:pointer}
.gcard{display:flex;flex-direction:column;gap:var(--e-1);position:relative;cursor:pointer}
.gcard .ph{width:100%;height:auto;aspect-ratio:2/3;border-radius:var(--r-s);font-size:var(--t-xxl);box-shadow:var(--ombre-1)}
.gcard .t{font-size:var(--t-s);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .pin{position:absolute;top:var(--e-1);right:var(--e-1)}
.gcard .gscore{position:absolute;left:var(--e-1);top:var(--e-1);z-index:2}
.ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sur-note);font-family:var(--police-titres);font-weight:800;flex:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover{width:72px;height:108px;border-radius:var(--r-s);font-size:var(--t-xl)}
.big{width:80px;height:120px;border-radius:var(--r-s);font-size:var(--t-xxl)}
.rc{width:40px;height:60px;border-radius:var(--r-s);font-size:var(--t-s)}
.mini{width:32px;height:48px;border-radius:var(--r-s);font-size:var(--t-xs)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--e-1)}
.t{font-weight:750;font-size:var(--t-m);line-height:1.3}
.a{color:var(--texte-doux);font-size:var(--t-s)}
.avis{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.resum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--t-s)}
.meta{display:flex;gap:var(--e-1) var(--e-2);align-items:center;flex-wrap:wrap;font-size:var(--t-s);color:var(--texte-doux)}
.bar{height:8px;background:var(--trait);border-radius:var(--r-pilule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pilule)}
.own{color:var(--accent);font-weight:600;font-size:var(--t-s)}
.empty{text-align:center;color:var(--texte-doux);padding:var(--e-6) var(--e-4);grid-column:1/-1}
/* ---------- Panneaux, tuiles, statistiques ---------- */
.panel{background:var(--carte);border:var(--bordure-carte) solid var(--trait);border-radius:var(--r-m);box-shadow:var(--ombre-1);padding:var(--e-4);margin-bottom:var(--e-3)}
.panel.encadre{background:var(--surface);border:1px solid var(--trait);box-shadow:none}
.panel h3{margin:0 0 var(--e-3);font-size:var(--t-s);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--texte)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--e-3);margin-bottom:var(--e-3)}
@media(min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--carte);border:var(--bordure-carte) solid var(--trait);border-radius:var(--r-m);box-shadow:var(--ombre-1);padding:var(--e-3)}
.tile b{display:block;font-size:var(--t-xxl);font-weight:800}
.tile span{font-size:var(--t-xs);color:var(--texte-doux)}
.chart{display:flex;gap:var(--e-1);height:140px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:var(--t-xs);color:var(--texte-doux);min-width:0}
.chart .col{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart i{display:block;width:100%;background:var(--texte);border-radius:var(--r-s) var(--r-s) 0 0}
.chart.green i{background:var(--accent)}
.chart em{font-style:normal;color:var(--texte);font-weight:600;font-size:var(--t-xs)}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr 28px;gap:var(--e-2);align-items:center;font-size:var(--t-s);margin-bottom:var(--e-2)}
.hb .bar>i{background:var(--texte)}
.catrow{width:100%;border:0;background:none;color:var(--texte);font:inherit;font-size:var(--t-s);text-align:left;padding:var(--e-1) 0;min-height:var(--toucher);cursor:pointer}
.facts{display:grid;gap:var(--e-2)}.fact{display:flex;gap:var(--e-3);align-items:center;font-size:var(--t-s)}.fact .k{color:var(--texte-doux);min-width:120px}
.top5{display:grid;gap:var(--e-2);margin-bottom:var(--e-3)}.top5 div{display:flex;gap:var(--e-3);align-items:center;font-size:var(--t-s)}
.top5 .rk{font-family:var(--police-titres);font-weight:800;color:var(--accent);width:20px}
.lines{display:grid;gap:var(--e-2)}.line{display:flex;gap:var(--e-3);align-items:center;font-size:var(--t-s);min-height:var(--toucher);cursor:pointer}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--e-2)}
.badge{border:1px solid var(--trait);border-radius:var(--r-m);padding:var(--e-3);display:flex;flex-direction:column;gap:var(--e-1);font-size:var(--t-xs)}
.badge.ok{border-color:var(--accent);background:var(--accent-doux);color:var(--sur-accent-doux)}
.badge .be{font-size:1.7rem;filter:grayscale(1);opacity:.55}.badge.ok .be{filter:none;opacity:1}
.badge span{color:var(--texte-doux)}.badge.ok span,.badge.ok .won{color:var(--sur-accent-doux)}
.badge .won{color:var(--accent);font-weight:700}
.cal{overflow-x:auto;padding-bottom:var(--e-2)}
.calm,.calg{display:grid;grid-auto-columns:12px;gap:2px}
.calm{grid-template-rows:18px;grid-auto-flow:column;font-size:var(--t-xs);color:var(--texte-doux);white-space:nowrap}
.calg{grid-template-rows:repeat(7,12px);grid-auto-flow:column}
.calg i,.calleg i{display:block;width:12px;height:12px;border-radius:3px;background:var(--trait);cursor:pointer}
.calleg{display:flex;align-items:center;gap:var(--e-1);font-size:var(--t-xs);color:var(--texte-doux);margin-top:var(--e-2);flex-wrap:wrap}
.calleg i{display:inline-block;cursor:default}
.calg .l1,.calleg .l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.calg .l2,.calleg .l2{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.calg .l3,.calleg .l3{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.calg .l4,.calleg .l4{background:var(--accent)}
.calg .l5,.calleg .l5{background:var(--alerte)}
.calg .f{opacity:.3}.calg .now{outline:2px solid var(--texte);outline-offset:-1px}
.quote{background:var(--carte);border:var(--bordure-carte) solid var(--trait);border-left:4px solid var(--accent);border-radius:var(--r-m);box-shadow:var(--ombre-1);padding:var(--e-3) var(--e-4);cursor:pointer}
.quote p{margin:0 0 var(--e-2);font-size:var(--t-l);white-space:pre-wrap}
.qlist{display:grid;gap:var(--e-2);margin-bottom:var(--e-2)}
.q{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:var(--e-2) var(--e-3);font-size:var(--t-s);display:flex;gap:var(--e-2);align-items:flex-start}
.q p{margin:0;flex:1;font-style:italic;white-space:pre-wrap}
.q button{min-width:var(--toucher);min-height:var(--toucher);border:0;background:none;color:var(--texte-doux);cursor:pointer;font-size:var(--t-m)}
/* ---------- Fenêtres ---------- */
.ov{position:fixed;inset:0;background:var(--voile);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.show{display:flex}
.modal{background:var(--surface);color:var(--texte);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:var(--e-5) var(--e-4) var(--e-4)}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:var(--r-l)}}
.modal h2{margin:0 0 var(--e-3);font-size:var(--t-xl);font-weight:800}
.mfoot{display:flex;gap:var(--e-2);align-items:center;flex-wrap:wrap;margin-top:var(--e-2)}
#modal>.mfoot:last-child{position:sticky;bottom:calc(-1 * var(--e-4));background:var(--surface);padding:var(--e-3) 0 var(--e-4);margin-bottom:calc(-1 * var(--e-4));border-top:1px solid var(--trait)}
#scanOv,#bulkOv,#timerOv{z-index:35}
#askOv{z-index:40;align-items:center}
#askOv .modal{border-radius:var(--r-l);max-width:420px;margin:0 var(--e-4);border:1px solid var(--trait);box-shadow:var(--ombre-2)}
details{margin-bottom:var(--e-3)}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:var(--t-s);padding:var(--e-3) 0;min-height:var(--toucher)}
.pourquoi summary,.inconnus summary{color:var(--texte-doux)}
.filtres{margin:calc(-1 * var(--e-1)) 0 var(--e-2)}
.ajout{display:grid;gap:var(--e-2);margin-bottom:var(--e-2)}
.ajout button{display:flex;flex-direction:column;align-items:flex-start;gap:var(--e-1);text-align:left;font:inherit;font-size:var(--t-m);padding:var(--e-3) var(--e-4);min-height:56px;border:1px solid var(--trait);border-radius:var(--r-m);background:var(--carte);color:var(--texte);cursor:pointer}
.ajout button span{font-size:var(--t-s);color:var(--texte-doux)}
.prev{display:flex;gap:var(--e-3);align-items:flex-end;margin-bottom:var(--e-3)}
.prev .btns{display:flex;flex-direction:column;gap:var(--e-2);align-items:flex-start}
.srcs{font-size:var(--t-xs);color:var(--texte-doux);margin:var(--e-2) 0 0;display:flex;gap:var(--e-1) var(--e-3);flex-wrap:wrap}
.srcs .ok{color:var(--accent)}.srcs .ko{color:var(--danger)}
.res{display:grid;gap:var(--e-2);margin:var(--e-2) 0}
.res button.r{display:flex;gap:var(--e-3);align-items:center;text-align:left;font:inherit;font-size:var(--t-s);border:1px solid var(--trait);background:var(--surface);color:var(--texte);border-radius:var(--r-m);padding:var(--e-2);cursor:pointer;width:100%;min-height:var(--toucher)}
.hint{background:var(--accent-doux);color:var(--sur-accent-doux);border-radius:var(--r-m);padding:var(--e-3);font-size:var(--t-s);margin:var(--e-2) 0}
.hist{font-size:var(--t-s);color:var(--texte-doux);margin:calc(-1 * var(--e-1)) 0 var(--e-3)}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:var(--e-2);margin-bottom:var(--e-3)}
.cpick button{border:2px solid var(--trait);padding:0;border-radius:var(--r-s);overflow:hidden;cursor:pointer;background:var(--trait);aspect-ratio:2/3}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}
.catline{display:flex;gap:var(--e-3);align-items:center;width:100%;border:0;border-bottom:1px solid var(--trait);background:none;color:var(--texte);font:inherit;font-size:var(--t-s);text-align:left;padding:var(--e-3) 0;min-height:var(--toucher);cursor:pointer}
.catline .chip{margin-top:var(--e-1)}
.pourquoi{font-size:var(--t-s);margin-top:var(--e-2)}.pourquoi ul{margin:var(--e-2) 0;padding-left:var(--e-5)}
.ailleurs{grid-column:1/-1;display:flex;gap:var(--e-2);align-items:center;flex-wrap:wrap;font-size:var(--t-s);color:var(--texte-doux);margin-bottom:var(--e-2)}
.inconnus{margin-top:var(--e-2)}
/* ---------- Découvrir ---------- */
.sugs{display:flex;gap:var(--e-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px var(--e-3);margin:0 -2px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs .sug{flex:0 0 86%;scroll-snap-align:start}
.sug{border:1px solid var(--trait);border-radius:var(--r-m);padding:var(--e-3);background:var(--surface)}
.sug.rq{margin-bottom:var(--e-3)}
.sugtop{display:flex;gap:var(--e-3)}
.sugres{font-size:var(--t-s);margin:var(--e-3) 0 2px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;cursor:pointer}
.sugres.open{display:block}
.dots{display:flex;gap:var(--e-2);justify-content:center;margin-top:2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--trait)}.dots i.on{background:var(--accent)}
.nxspin{text-align:center;font-family:var(--police-titres);font-size:var(--t-l);padding:var(--e-5) var(--e-3);color:var(--texte-doux)}
.nxcard{display:flex;gap:var(--e-4);align-items:flex-start;background:var(--accent-doux);color:var(--sur-accent-doux);border-radius:var(--r-m);padding:var(--e-3);margin:var(--e-2) 0 var(--e-1)}
.nxcard .t{font-size:var(--t-l)}.nxcard .a,.nxcard .chip{color:var(--sur-accent-doux)}
/* ---------- Appareil photo, chrono, messages ---------- */
.cam{position:relative;border-radius:var(--r-m);overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .aim::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff5a36;animation:sweep 1.6s ease-in-out infinite}
.cam.flash .aim{border-color:#5be37d}
@keyframes sweep{0%,100%{transform:translateY(-35px)}50%{transform:translateY(35px)}}
.blist{display:grid;gap:var(--e-2);margin-top:var(--e-3);max-height:32vh;overflow:auto}
.bl{display:flex;gap:var(--e-2);align-items:center;font-size:var(--t-s);background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--r-s);padding:var(--e-2)}
.clock{font-size:3.4rem;text-align:center;margin:var(--e-3) 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--texte);color:var(--fond);padding:var(--e-2) var(--e-4);border-radius:var(--r-m);font-size:var(--t-s);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;text-align:center;line-height:1.4;max-width:min(94vw,520px)}
.toast.show{opacity:.96}.toast.act{pointer-events:auto}
.toast button{min-height:var(--toucher);background:var(--fond);color:var(--texte);border:0;border-radius:var(--r-pilule);padding:0 var(--e-4);margin:var(--e-1) 0 0 var(--e-3);font:inherit;font-weight:700;cursor:pointer}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:12px/1.4 Georgia,serif}
  #print h1{font-size:20px;margin:0 0 4px}#print h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #999}
  #print table{width:100%;border-collapse:collapse}#print td,#print th{text-align:left;padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top}
  #print blockquote{margin:0 0 8px;font-style:italic}
}
/* ---------- Mouvements ---------- */
@keyframes inL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
main.slide-l{animation:inL .22s ease-out}main.slide-r{animation:inR .22s ease-out}
@media (prefers-reduced-motion: reduce){main.slide-l,main.slide-r,.cam .aim::after{animation:none}.toast{transition:none}}
/* ---------- Icônes : dessin au trait (Android, Actuel), émoji (Carnet) ---------- */
.ico{display:inline-block;flex:none;font-size:0;overflow:hidden;width:1.25rem;height:1.25rem;vertical-align:-.25rem;background:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
[data-style=carnet] .ico{font-size:inherit;overflow:visible;width:auto;height:auto;vertical-align:baseline;background:none;-webkit-mask:none;mask:none}
.fab .ico{width:28px;height:28px}
/* ---------- États vides, erreurs, chargements ---------- */
.etat{text-align:center;padding:var(--e-6) var(--e-4);grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:var(--e-2)}
.etat-icone{width:64px;height:64px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:var(--t-xxl)}
.etat-icone .ico{width:32px;height:32px}
.etat-titre{margin:0;font-size:var(--t-l);font-weight:700;font-family:var(--police-titres);color:var(--texte)}
.etat-texte{margin:0;font-size:var(--t-s);color:var(--texte-doux);max-width:420px}
.etat.erreur .etat-icone{color:var(--danger)}
.etat + .etat-texte{margin:0 auto;grid-column:1/-1}
.squelette{cursor:default}
.sq{background:var(--surface-2);border-radius:var(--r-s);animation:pulse 1.4s ease-in-out infinite}
.squelette .l1{height:16px;width:70%}.squelette .l2{height:13px;width:45%}.squelette .l3{height:13px;width:85%;margin-top:var(--e-2)}
@keyframes pulse{50%{opacity:.45}}
.tourne{width:28px;height:28px;border:3px solid var(--trait);border-top-color:var(--accent);border-radius:50%;animation:tourne 1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sq,.tourne{animation:none}}
</style>
</head>
<body>
<div id="notice" class="notice" hidden></div>
<header><div class="wrap">
  <div class="top">
    <h1>📚 Mes lectures</h1>
    <span class="flame" id="flame" hidden title="Jours de lecture d'affilée"></span>
    <button class="icon" id="settingsBtn" title="Réglages" aria-label="Réglages"><span class="ico i-reglages" aria-hidden="true">⚙️</span></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Onglets"></nav>
</div></header>
<main class="wrap" id="main"><p class="sr">Chargement de tes livres…</p><div class="list">
  <div class="card squelette" aria-hidden="true"><div class="cover sq"></div><div class="info"><div class="sq l1"></div><div class="sq l2"></div><div class="sq l3"></div></div></div>
  <div class="card squelette" aria-hidden="true"><div class="cover sq"></div><div class="info"><div class="sq l1"></div><div class="sq l2"></div><div class="sq l3"></div></div></div>
  <div class="card squelette" aria-hidden="true"><div class="cover sq"></div><div class="info"><div class="sq l1"></div><div class="sq l2"></div><div class="sq l3"></div></div></div>
</div></main>
<button class="fab" id="fab" title="Ajouter (un livre, un code-barres, plusieurs livres)" aria-label="Ajouter"><span class="ico i-ajouter" aria-hidden="true">＋</span></button>
<button class="pill" id="timerPill" hidden></button>

<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitre"></div></div>

<div class="ov" id="scanOv"><div class="modal">
  <h2>Scanner le code-barres</h2>
  <div class="cam" id="cam1box"><video id="cam" playsinline muted autoplay></video><div class="aim"></div></div>
  <p class="a" id="scanMsg"></p>
  <div class="mfoot"><button class="btn" id="scanPhoto" type="button"><span class="ico i-photo" aria-hidden="true">📷</span> Prendre une photo à la place</button><span class="sp"></span>
    <button class="btn" id="scanClose" type="button">Annuler</button></div>
</div></div>

<div class="ov" id="bulkOv"><div class="modal">
  <h2>📦 Scan rapide</h2>
  <p class="a remonte">Scanne tes livres les uns après les autres : ils s'ajoutent tout seuls.</p>
  <div class="lbl mb-1">Les ranger dans :</div>
  <div class="seg" id="bulkDest"><button data-dest="a_lire" class="on">À lire</button><button data-dest="lu">Lus</button><button data-dest="en_cours">En cours</button></div>
  <div class="cam" id="cam2box"><video id="cam2" playsinline muted autoplay></video><div class="aim"></div></div>
  <p class="a" id="bulkMsg">Vise le code-barres au dos du livre.</p>
  <div class="blist" id="bulkList"></div>
  <div class="mfoot"><span class="a" id="bulkCount"></span><span class="sp"></span><button class="btn pri" id="bulkDone" type="button">Terminé</button></div>
</div></div>

<div class="ov" id="timerOv"><div class="modal" id="timerModal"></div></div>

</div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pick_cover" accept="image/*" hidden>
<input type="file" id="pick_scan" accept="image/*" capture="environment" hidden>
<!-- (aucun filtre de type : sur certains téléphones, une sauvegarde reçue par WhatsApp ou Drive apparaissait grisée ;
     l'appli vérifie elle-même que le fichier choisi est bien une sauvegarde) -->
<input type="file" id="pick_backup" hidden>
<div id="print"></div>

<script src="recherche.js"></script>
<script>
/* =====================================================================
   Mes lectures : l'appli
   ===================================================================== */
// Numéro de version : le même dans index.html, recherche.js et sw.js (sinon, la mise en ligne est incomplète)
const VERSION = '2026.10.21-2';
const STATUTS = {en_cours: 'En cours', a_lire: 'À lire', lu: 'Lus', abandon: 'Abandonnés'};
const STATUT_UN = {en_cours: 'En cours', a_lire: 'À lire', lu: 'Lu', abandon: 'Abandonné'};
const GENRES = ['Roman', 'Polar / Thriller', 'SF / Fantasy', 'Essai', 'Pro / VAE', 'Développement perso', 'BD / Manga', 'Biographie', 'Jeunesse', 'Autre'];
const FORMATS = {papier: '📖 Papier', numerique: '📱 Numérique', audio: '🎧 Audio'};
const POSSESSION = {a_moi: 'Je l\'ai', emprunte: 'Emprunté (médiathèque, ami…)', prete: 'Prêté à quelqu\'un', non: 'Je ne l\'ai pas'};
const PAGES_SOURCES = {edition: 'nombre de pages de cette édition (d\'après son ISBN)', estimation: 'estimé : nombre de pages d\'une autre édition du livre', manuel: 'nombre de pages tapé à la main'};
const MOIS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
// État d'un écran (vide, erreur, chargement) : une icône, un titre, une phrase, une ou deux actions
function etat({icone, emoji, titre, texte, actions, ton}) {
  return `<div class="etat${ton ? ' ' + ton : ''}" role="${ton === 'erreur' ? 'alert' : 'status'}">
    <div class="etat-icone">${ico(icone, emoji)}</div><p class="etat-titre">${titre}</p>${texte ? `<p class="etat-texte">${texte}</p>` : ''}
    ${actions ? `<div class="acts centre">${actions}</div>` : ''}</div>`;
}
const boutonAjouter = (txt) => `<button class="btn pri" type="button" data-ajouter>${ico('ajouter', '＋')} ${txt || 'Ajouter un livre'}</button>`;
const ETATS = {
  en_cours: () => etat({icone: 'livre', emoji: '📖', titre: 'Aucune lecture en cours', texte: 'Commence un livre de ta liste, ou ajoutes-en un.',
    actions: `<button class="btn" type="button" data-tab="a_lire">Choisir dans « À lire »</button>${boutonAjouter()}`}),
  a_lire: () => etat({icone: 'livre', emoji: '📚', titre: 'Ta liste est vide', texte: 'Ajoute les livres que tu veux lire, ou laisse-toi inspirer.',
    actions: `${boutonAjouter()}<button class="btn" type="button" data-tab="decouvrir">${ico('etincelle', '✨')} Découvrir des livres</button>`}),
  lu: () => etat({icone: 'fini', emoji: '✓', titre: 'Aucun livre terminé pour l\'instant', texte: 'Quand tu finis un livre, il arrive ici avec ta note.',
    actions: '<button class="btn" type="button" data-tab="en_cours">Voir mes lectures en cours</button>'}),
  abandon: () => etat({icone: 'fini', emoji: '👍', titre: 'Aucun livre abandonné', texte: 'Tant mieux !'}),
  citations: () => etat({icone: 'citation', emoji: '✍️', titre: 'Pas encore de citation', texte: 'Sur un livre en cours, touche « ⋯ » puis « Ajouter une citation ».',
    actions: '<button class="btn" type="button" data-tab="en_cours">Voir mes lectures en cours</button>'})
};
// Bibliothèque complètement vide (premier lancement, réinstallation, nouveau téléphone) : récupérer une sauvegarde en un geste
const accueil = () => etat({icone: 'livre', emoji: '👋', titre: 'Ta bibliothèque est vide',
  texte: 'Tu avais déjà l\'appli ? Récupère ta sauvegarde (le fichier « mes-lectures-sauvegarde-… », dans tes Téléchargements, ton Drive ou tes mails).',

/* ---------- Stockage sur l'appareil (IndexedDB : grande capacité) ---------- */
const Store = {
  fallback: !('indexedDB' in window),
  queue: Promise.resolve(),
  erreur: false,    // le dernier enregistrement a échoué : bandeau d'alerte jusqu'à ce que ça remarche
  bloque: false,    // impossible de lire les livres au démarrage : on n'écrit plus rien (pour ne rien écraser)
  db() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open(CLE, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => {
        const db = r.result;
        // Connexion fermée par le système (manque de place, mise à jour…) : on la rouvrira à la prochaine opération
        db.onclose = () => { this._db = null; };
        db.onversionchange = () => { db.close(); this._db = null; };
        res(db);
      };
      r.onerror = () => { this._db = null; rej(r.error); };
    });
    return this._db;
  },
  async get(k) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const t = db.transaction('kv'), q = t.objectStore('kv').get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      t.onabort = () => rej(t.error || new Error('lecture interrompue'));
    });
  },
  async set(k, v) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
      // (mémoire pleine, appli fermée… : sans ça, l'enregistrement pouvait rester bloqué sans rien dire)
      t.onabort = () => rej(t.error || new Error('enregistrement interrompu'));
    });
  },
  // Copie de secours : écrite seulement quand la mémoire principale refuse un enregistrement
  secours() { try { return JSON.parse(localStorage.getItem(CLE + '-data')); } catch (e) { return null; } },
  // Plusieurs fenêtres peuvent ouvrir la même bibliothèque (l'appli + un onglet Chrome du site, deux onglets…).
  // Chaque fenêtre retient la version qu'elle a lue (vu) et les livres tels qu'elle les a lus ou écrits (base) :
  // si une autre fenêtre a enregistré entre-temps, on fusionne livre par livre au lieu d'écraser ses changements.
  moi: newId(), vu: '', base: new Map(), baseGoal: 0,
  retenir(d) { this.vu = d.savedAt || ''; this.base = new Map((d.books || []).map(b => [b.id, b])); this.baseGoal = d.goal || 0; },
  // Mes changements depuis « base » (livres modifiés, ajoutés, supprimés), appliqués sur la liste « autre »
  fusion(mes, autre, base) {
    const m = new Map(autre.map(b => [b.id, b])), ids = new Set(mes.map(b => b.id));
    for (const b of mes) if (base.get(b.id) !== b) m.set(b.id, b);

  // renvoie ce qui a été écrit, avec « fusion » si les changements d'une autre fenêtre ont été repris
  ecrire(mes, monGoal) {
    return this.db().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite'), st = t.objectStore('kv');
      let out = null;
      const ecrit = (l, g, fusion) => {
        const savedAt = new Date().toISOString();
        out = {books: l, goal: g, savedAt, fusion};
        st.put({books: l, goal: g, savedAt}, 'data'); st.put({savedAt, par: this.moi}, 'version');
      };
      // (« à jour » : personne n'a écrit depuis ma dernière lecture ou écriture)
      const aJour = v => !v || !this.vu || (v.savedAt || '') <= this.vu || v.par === this.moi;
      const rv = st.get('version');
      rv.onsuccess = () => {
        const v = rv.result;
        if (v && aJour(v)) return ecrit(mes, monGoal, false);

        const rd = st.get('data');

          const autres = (d.books || []).map(norm);

      };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('enregistrement interrompu'));
    }));
  },
  async load() {
    const secours = this.secours();
    if (!this.fallback) {
      let d;
      try { d = await this.get('data'); }
      catch (e) {
        // Mémoire principale illisible : surtout ne pas afficher (puis enregistrer) une bibliothèque vide
        if (secours) { this.fallback = true; return secours; }
        this.bloque = true; throw new Error('lecture impossible');
      }
      if (d) {
        // Enregistrements faits pendant une panne : la copie de secours est plus récente, c'est elle la bonne
        // (à égalité aussi : la copie de secours n'existe que si un enregistrement a échoué APRÈS le dernier réussi)
        if (secours && (secours.savedAt || '') >= (d.savedAt || '')) return secours;
        return d;
      }
      // Première ouverture de cette version : on reprend les livres de l'ancienne mémoire
      const d2 = secours || {books: [], goal: 0};
      await this.set('data', d2);
      if (secours) { localStorage.setItem(CLE + '-data-ancienne', localStorage.getItem(CLE + '-data')); localStorage.removeItem(CLE + '-data'); }
      return d2;
    }
    return secours || {books: [], goal: 0};
  },
  persist() {
    // Mémoire illisible au démarrage : on n'écrit rien (pour ne rien écraser), et on le dit
    if (this.bloque) { paintNotice(); return Promise.reject(new Error('mémoire illisible')).catch(() => {}); }
    // Un enregistrement attend déjà son tour : il prendra aussi ce changement (il lit les livres au moment d'écrire)
    if (this.attente) return this.queue;
    this.attente = true;
    this.queue = this.queue.then(async () => {
      this.attente = false;
      const mes = books.slice(), monGoal = goal;
      let ok = false;
      if (!this.fallback) {
        try {
          const out = await this.ecrire(mes, monGoal); ok = true;
          if (out.fusion) {
            // Une autre fenêtre avait enregistré : ses changements + les miens (y compris ceux faits pendant l'écriture)
            books = this.fusion(books, out.books, new Map(mes.map(b => [b.id, b]))); goal = goal !== monGoal ? goal : out.goal;
            this.retenir(out);
            if (!fenetreOuverte()) render(); else this.aRafraichir = true;
          } else this.retenir(out);
          // La mémoire principale remarche : la copie de secours ne sert plus
          if (localStorage.getItem(CLE + '-data')) localStorage.removeItem(CLE + '-data');
          if (this.canal) this.canal.postMessage({savedAt: out.savedAt, par: this.moi});
        } catch (e) {}
      }
      if (!ok) localStorage.setItem(CLE + '-data', JSON.stringify({books: mes, goal: monGoal, savedAt: new Date().toISOString()}));   // peut échouer aussi (mémoire pleine)
      if (this.erreur) { this.erreur = false; paintNotice(); }
    }).catch(() => {
      this.erreur = true; paintNotice();
      toast('⚠️ Pas enregistré : mémoire du téléphone pleine ?');
    });
    return this.queue;
  },
  // Une autre fenêtre a enregistré : on relit la bibliothèque (en gardant ce que je n'ai pas encore enregistré)
  async relire() {
    if (this.bloque || this.fallback || this.attente) return;
    let v, d;
    try { v = await this.get('version'); if (!v || (v.savedAt || '') <= this.vu || v.par === this.moi) return; d = await this.get('data'); }
    catch (e) { return; }
    if (!d || (d.savedAt || '') <= this.vu) return;
    const autres = (d.books || []).map(norm);
    books = this.fusion(books, autres, this.base); goal = goal !== this.baseGoal ? goal : entier(d.goal) || 0;
    this.retenir({...d, books: autres});
    // (une fiche en cours de saisie n'est pas fermée : l'affichage sera rafraîchi à sa fermeture)
    if (!fenetreOuverte()) render(); else this.aRafraichir = true;
  }
};
if ('BroadcastChannel' in window) { Store.canal = new BroadcastChannel(CLE); Store.canal.onmessage = () => Store.relire(); }
// En revenant sur l'appli (ou l'onglet), on vérifie qu'une autre fenêtre n'a rien changé entre-temps
document.addEventListener('visibilitychange', () => { if (!document.hidden) Store.relire(); });

/* ---------- Journal de lecture (pages par jour, série, vitesse) ---------- */
function logPage(b, page, date) {
  date = date || today();
  b.journal = (b.journal || []).filter(e => e.date !== date).concat({date, page: +page || 0})
    .sort((x, y) => x.date.localeCompare(y.date)).slice(-400);
}
// Calculs sur toute la bibliothèque, partagés pendant UN affichage (sinon refaits 5 à 8 fois pour l'onglet Stats) ;
// hors affichage (clic sur un jour, défis…), ils sont toujours recalculés : jamais de résultat périmé
let cacheRendu = null;
const unFois = (k, f) => !cacheRendu ? f() : k in cacheRendu ? cacheRendu[k] : (cacheRendu[k] = f());
function avecCache(f) { return function () { const avant = cacheRendu; cacheRendu = avant || {}; try { return f.apply(this, arguments); } finally { cacheRendu = avant; } }; }
function activity() { return unFois('activity', calcActivity); }
function calcActivity() {
  const m = {};
  books.forEach(b => {
    const j = b.journal || [];
    for (let i = 1; i < j.length; i++) { const d = j[i].page - j[i - 1].page; if (d > 0) m[j[i].date] = (m[j[i].date] || 0) + d; }
    (b.sessions || []).forEach(s => { if (!m[s.date]) m[s.date] = m[s.date] || 0.001; });
  });
  return m;
}
function streaks(m) {
  const d = new Date(); if (!m[iso(d)]) d.setDate(d.getDate() - 1);
  let cur = 0; while (m[iso(d)]) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  Object.keys(m).sort().forEach(k => {
    const x = new Date(k + 'T00:00');
    run = prev && Math.round((x - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = x;
  });
  return {cur, best};
}
function readings() { return unFois('readings', calcReadings); }
function calcReadings() {
  const out = [];
  books.forEach(b => {
    (b.historique || []).forEach(h => { if (h.fin) out.push({b, fin: h.fin, note: +h.note || 0}); });
    if (b.statut === 'lu' && b.dateFin) out.push({b, fin: b.dateFin, note: +b.note || 0});
  });
  return out;
}
function allSessions() { return unFois('sessions', () => books.flatMap(b => (b.sessions || []).map(s => ({...s, b})))); }
// Vitesse de lecture (pages par heure) à partir des séances chronométrées
let vitesseAffichage = null;   // (gardée le temps d'un affichage de liste)
function speed() {
  let p = 0, m = 0;
  allSessions().forEach(s => { const d = (+s.a || 0) - (+s.de || 0); if (d > 0 && s.min > 0) { p += d; m += s.min; } });
  return m >= 15 ? p / m * 60 : 0;
}

/* ---------- Affichage ---------- */
const render = avecCache(renderTout);

  const owns = [['', 'Tous les livres'], ['a_moi', 'Ceux que j\'ai'], ['emprunte', 'Empruntés'], ['prete', 'Prêtés'], ['numerique', 'Numériques'], ['audio', 'Audio'], ['completer', 'À compléter']];

// « Filtres et tri », suivi du nombre de filtres actifs (un tri autre que « Plus récents » compte aussi)
function filtresTitre() {
  const n = [ui.genre, ui.cat, ui.own].filter(Boolean).length + (ui.sort !== 'recent' ? 1 : 0);
  return ico('filtres', '⚙️') + ' Filtres et tri' + (n ? ' (' + n + ')' : '');
}

function dateKey(b) { return ((b.statut === 'lu' || b.statut === 'abandon') ? b.dateFin : b.statut === 'en_cours' ? b.dateDebut : '') || b.ajoute || ''; }

function renderCards() {
  const q = Recherche.norm(ui.q);
  let l = books.filter(b => b.statut === ui.tab);
  const trouve = b => Recherche.norm([b.titre, b.auteur, b.genre, b.avis, b.serie, b.isbn, b.pretNom, b.resume, ...(b.sujets || []), ...catsDe(b).map(c => c.nom)].join(' ')).includes(q);
  if (q) l = l.filter(trouve);
  // La recherche regarde aussi les autres onglets : on dit où se trouvent les autres livres qui correspondent
  const ailleurs = q ? Object.keys(STATUTS).filter(k => k !== ui.tab).map(k => [k, books.filter(b => b.statut === k && trouve(b)).length]).filter(x => x[1]) : [];
  if (ui.genre) l = l.filter(b => b.genre === ui.genre);
  if (ui.cat) l = l.filter(b => ui.cat === '_aucune' ? !catsDe(b).length : ui.cat.startsWith('sous:') ? sousDe(b).some(z => z.id === ui.cat.slice(5)) : catsDe(b).some(c => c.id === ui.cat));
  if (ui.own) l = l.filter(b => ui.own === 'completer' ? b.aCompleter : ['numerique', 'audio'].includes(ui.own) ? b.format === ui.own : b.possession === ui.own);
  const by = {
    recent: (a, b) => dateKey(b).localeCompare(dateKey(a)),
    titre: (a, b) => a.titre.localeCompare(b.titre, 'fr'),
    auteur: (a, b) => (a.auteur || '').localeCompare(b.auteur || '', 'fr'),
    serie: (a, b) => (a.serie || '~').localeCompare(b.serie || '~', 'fr') || (+a.tome || 0) - (+b.tome || 0) || a.titre.localeCompare(b.titre, 'fr'),
    note: (a, b) => (b.note || 0) - (a.note || 0),
    // (les livres dont on ne connaît pas le nombre de pages à la fin)
    pages: (a, b) => (+a.pagesTotal || 1e9) - (+b.pagesTotal || 1e9) || a.titre.localeCompare(b.titre, 'fr')
  };
  l.sort((a, b) => (ui.tab === 'a_lire' ? (b.epingle ? 1 : 0) - (a.epingle ? 1 : 0) : 0) || by[ui.sort](a, b));
  vitesseAffichage = ui.tab === 'en_cours' ? speed() : null;
  $('#list').innerHTML = (ailleurs.length ? `<div class="ailleurs">Aussi dans ${ailleurs.map(([k, n]) => `<button type="button" class="chipb" data-tab="${k}">${STATUTS[k]} (${n})</button>`).join(' ')}</div>` : '') +
    (l.length ? l.map(prefs.view === 'grille' ? gcard : card).join('') :
    (q || ui.genre || ui.own || ui.cat ? etat({icone: 'chercher', emoji: '🔎', titre: 'Aucun livre ne correspond', texte: 'dans cet onglet, avec cette recherche ou ces filtres.',
      actions: '<button class="btn" type="button" data-effacer>Effacer la recherche et les filtres</button>'}) : !books.length ? accueil() : ETATS[ui.tab]()));
}

function progress(b) {
  const tot = +b.pagesTotal || 0, cur = +b.pageActuelle || 0;
  return {tot, cur, pct: tot ? Math.min(100, Math.round(cur / tot * 100)) : 0};
}
function loanChip(b) {
  if (b.possession === 'prete') return `<span class="chip">📤 Prêté${b.pretNom ? ' à ' + esc(b.pretNom) : ''}</span>`;
  if (b.possession === 'emprunte') {
    const late = b.pretRetour && b.pretRetour < today(), soon = b.pretRetour && !late && b.pretRetour <= addDays(3);
    return `<span class="chip ${late ? 'late' : soon ? 'warn' : ''}">📥 ${b.pretRetour ? (late ? 'En retard ! ' : 'À rendre le ') + fdate(b.pretRetour) : 'Emprunté'}</span>`;
  }
  return '';
}
function card(b) {
  let extra = '', acts = '';
  const fois = (b.historique || []).length;
  if (b.statut === 'en_cours') {
    const p = progress(b), v = vitesseAffichage !== null ? vitesseAffichage : speed();
    const reste = p.tot && v ? ` · ≈ ${fdur((p.tot - p.cur) / v * 60)} restantes` : '';
    extra = p.tot ? `<div class="meta">p. ${p.cur} / ${p.tot} · ${p.pct} %${reste}</div><div class="bar"><i style="width:${p.pct}%"></i></div>`
      : (b.dateDebut ? `<div class="meta">Commencé le ${fdate(b.dateDebut)}</div>` : '');
    // (l'action la plus fréquente en grand ; le chrono, les citations et « J'ai fini » dans « ⋯ »)
    acts = `<button class="btn pri" data-act="pages"><span class="ico i-livre" aria-hidden="true">📖</span> Où j'en suis</button><button class="btn" data-act="plus" title="Autres actions" aria-label="Autres actions : chrono, citation, j'ai fini"><span class="ico i-plus" aria-hidden="true">⋯</span></button>`;
  } else if (b.statut === 'a_lire') {
    extra = (b.pagesTotal ? `<div class="meta"${b.pagesSource === 'estimation' ? ` title="${PAGES_SOURCES.estimation}"` : ''}>${b.pagesSource === 'estimation' ? '≈ ' : ''}${esc(b.pagesTotal)} pages</div>` : '') +
      (b.resume ? `<div class="a resum">${esc(b.resume)}</div>` : '');
    acts = `<button class="btn ${b.epingle ? 'on' : ''}" data-act="pin" title="Épingler en haut"><span class="ico i-epingle" aria-hidden="true">📌</span> ${b.epingle ? 'Épinglé' : 'Épingler'}</button><button class="btn pri" data-act="start">Commencer</button>`;
  } else if (b.statut === 'lu') {
    extra = `<div class="meta">${scoreHtml(b.note)}${b.dateFin ? `<span>Fini le ${fdate(b.dateFin)}</span>` : ''}${fois ? `<span class="chip">Lu ${fois + 1} fois</span>` : ''}</div>` +
      (b.avis ? `<div class="a avis">${esc(b.avis)}</div>` : '');
  } else {
    const p = progress(b);
    extra = `<div class="meta">${p.tot && p.cur ? `<span>Arrêté p. ${p.cur} / ${p.tot}</span>` : ''}${b.dateFin ? `<span>le ${fdate(b.dateFin)}</span>` : ''}</div>`;
    acts = `<button class="btn" data-act="resume">Reprendre</button>`;
  }
  const chips = [b.aCompleter ? '<span class="chip warn">⚠️ À compléter</span>' : '', serieLabel(b) ? `<span class="chip">${esc(serieLabel(b))}</span>` : '',
    b.genre ? `<span class="chip">${esc(b.genre)}</span>` : '', b.format !== 'papier' ? `<span class="chip">${FORMATS[b.format].split(' ')[0]}</span>` : '', loanChip(b)].join('');
  return `<article class="card" data-id="${esc(b.id)}">${coverHtml(b)}<div class="info">
      <div class="t">${b.epingle && b.statut === 'a_lire' ? '📌 ' : ''}${esc(b.titre)}</div>${b.auteur ? `<div class="a">${esc(b.auteur)}</div>` : ''}
      ${chips.trim() ? `<div class="meta">${chips}</div>` : ''}
      ${extra}${acts ? `<div class="acts">${acts}</div>` : ''}</div></article>`;
}
function gcard(b) {
  let extra = '';
  if (b.statut === 'en_cours') { const p = progress(b); if (p.tot) extra = `<div class="bar"><i style="width:${p.pct}%"></i></div>`; }
  return `<article class="gcard" data-id="${esc(b.id)}">${b.statut === 'lu' && b.note ? scoreHtml(b.note, 'gscore') : ''}${coverHtml(b, '')}${b.epingle && b.statut === 'a_lire' ? '<span class="pin">📌</span>' : ''}
    <div class="t">${esc(b.titre)}${b.tome ? ' <span class="a">T.' + esc(b.tome) + '</span>' : ''}</div>${extra}</article>`;
}

/* ---------- Bandeau d'alerte (retours de prêt, sauvegarde) ---------- */
function paintNotice() {
  const bar = $('#notice');
  if (Store.bloque) {
    bar.innerHTML = `⚠️ <b>Tes livres ne peuvent pas être lus pour l'instant</b> : rien n'est enregistré tant que ce n'est pas réparé (pour ne rien écraser).
      Ferme complètement l'appli et rouvre-la. <button class="btn pri small" type="button" onclick="location.reload()"><span class="ico i-relire" aria-hidden="true">🔄</span> Réessayer</button>`;
    bar.className = 'notice danger'; bar.hidden = false; return;
  }
  if (Store.erreur) {
    bar.innerHTML = `⚠️ <b>Tes dernières modifications ne sont pas enregistrées</b> (mémoire du téléphone pleine ?). Libère de la place, puis réessaie. Par précaution, fais une sauvegarde.
      <button class="btn small" type="button" data-resave>Réessayer</button><button class="btn pri small" data-export="backup">Sauvegarder</button>`;
    bar.className = 'notice danger'; bar.hidden = false; return;
  }
  const due = books.filter(b => b.possession === 'emprunte' && b.pretRetour && b.pretRetour <= addDays(3)).sort((a, b) => a.pretRetour.localeCompare(b.pretRetour))[0];
  // Rappel : jamais sauvegardé, ou dernière sauvegarde de plus d'une semaine ET des changements depuis
  // (les livres ne vivent que dans la mémoire de Chrome : effacer ses données les effacerait)
  const last = prefs.lastBackup, late = books.length >= 3 && (!last || (Date.now() - new Date(last) > 7 * 864e5 && Store.vu > last));
  if (due) {
    const lateRet = due.pretRetour < today();
    bar.innerHTML = `📥 « ${esc(due.titre)} » ${lateRet ? 'devait être rendu le' : 'est à rendre le'} <b>${fdate(due.pretRetour)}</b> <button class="btn small" data-open="${esc(due.id)}">Voir</button>`;
    bar.className = 'notice alerte'; bar.hidden = false;
  } else if (late) {
    bar.innerHTML = `💾 ${last ? 'Tu as modifié tes livres depuis ta dernière sauvegarde (il y a plus d\'une semaine).' : 'Pense à sauvegarder tes livres.'} <button class="btn pri small" data-export="backup">Sauvegarder</button>`;
    bar.className = 'notice'; bar.hidden = false;
  } else bar.hidden = true;
}

/* ---------- Onglet Citations ---------- */
function renderQuotesTab() {
  $('#main').innerHTML = `<div class="tools"><input id="cq" type="search" placeholder="Chercher dans mes citations…" value="${esc(ui.cq)}"></div><div class="list" id="qlist"></div>`;
  renderQuotes();
}
function renderQuotes() {
  const q = Recherche.norm(ui.cq);
  let l = allQuotes().slice();   // (copie : le tri ci-dessous ne doit pas toucher le calcul partagé)
  if (q) l = l.filter(x => Recherche.norm([x.q.texte, x.b.titre, x.b.auteur].join(' ')).includes(q));
  l.sort((a, b) => (b.q.date || '').localeCompare(a.q.date || ''));

    : `${q ? etat({icone: 'chercher', emoji: '🔎', titre: 'Aucune citation ne correspond'}) : ETATS.citations()}`;

// Classements d'un livre déjà enregistré (une seule tentative réussie par livre ; en cas de panne réseau, on réessaiera)
async function fillClass(b) {
  const r = await Recherche.classement(b);
  const i = books.findIndex(z => z.id === b.id); if (i < 0) return false;
  const nb = {...books[i], classTente: true};
  if (r.classements.length) nb.classements = Recherche.unirClassements([nb.classements, r.classements]);
  books[i] = nb;
  return r.classements.length > 0;
}
let catFillBusy = false;
async function fillCategories() {
  if (catFillBusy) return;
  if (navigator.onLine === false) return toast('Pas de connexion internet');
  catFillBusy = true;
  const todo = sansClassement();
  let ok = 0, k = 0, pannes = 0;
  for (const b of todo) {
    const el = $('#catfillres'), bt = $('#catfill');
    if (el) el.textContent = `Recherche ${++k} / ${todo.length} : ${b.titre}…`; else k++;
    if (bt) bt.disabled = true;
    try { if (await fillClass(b)) ok++; pannes = 0; } catch (e) { if (++pannes >= 3) break; }
    if (k % 5 === 0) await Store.persist();
    await new Promise(r => setTimeout(r, 700));
  }
  await Store.persist(); catFillBusy = false;
  if (ui.tab === 'stats') renderStats();
  toast(pannes >= 3 ? 'Les catalogues ne répondent pas : réessaie plus tard' : `Rayons trouvés pour ${plural(ok, 'livre')} sur ${todo.length}`);
}

/* ---------- 🗓️ Calendrier de lecture (une case par jour) ---------- */
function calendarPanel(y) {
  const act = activity(), minBy = {}, finBy = {};
  allSessions().forEach(s => { minBy[s.date] = (minBy[s.date] || 0) + (+s.min || 0); });
  readings().forEach(r => { (finBy[r.fin] = finBy[r.fin] || []).push(r.b.titre); });
  const start = new Date(y, 0, 1), offset = (start.getDay() + 6) % 7;   // lundi en haut
  const days = Math.round((new Date(y, 11, 31) - start) / 864e5) + 1, t = today();
  const cells = []; let jours = 0;
  for (let i = 0; i < offset; i++) cells.push('<i class="invisible"></i>');
  for (let i = 0; i < days; i++) {
    const k = iso(new Date(y, 0, 1 + i)), p = Math.round(act[k] || 0), m = minBy[k] || 0;
    const lvl = finBy[k] ? 5 : (p >= 100 || m >= 90) ? 4 : (p >= 50 || m >= 45) ? 3 : (p >= 20 || m >= 20) ? 2 : (p > 0 || m > 0 || act[k]) ? 1 : 0;
    if (lvl) jours++;
    cells.push(`<i class="l${lvl}${k > t ? ' f' : ''}${k === t ? ' now' : ''}" data-day="${k}"></i>`);
  }
  const months = MOIS_COURT.map((m, i) => `<span style="grid-column:${Math.floor((offset + Math.round((new Date(y, i, 1) - start) / 864e5)) / 7) + 1}">${m}</span>`).join('');
  return `<div class="panel"><h3>🗓️ Mon année de lecture</h3>
    <div class="a sous-titre">${plural(jours, 'jour')} de lecture en ${y}</div>
    <div class="cal" id="cal"><div class="calm">${months}</div><div class="calg">${cells.join('')}</div></div>
    <div class="calleg"><span class="a petit" id="calinfo">Touche un jour pour voir le détail.</span><span class="sp"></span>
      moins <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> plus · <i class="l5"></i> livre fini</div></div>`;
}
function dayInfo(k) {
  const p = Math.round(activity()[k] || 0);
  const m = allSessions().filter(s => s.date === k).reduce((s, x) => s + (+x.min || 0), 0);

  const parts = [p ? plural(p, 'page') : '', m ? fdur(m) + ' chronométrées' : '', fin.length ? '🎉 fini : ' + fin.join(', ') : ''].filter(Boolean);

/* ---------- 🏆 Défis et badges ---------- */
function defis(y) {
  const Y = String(y);
  const ly = readings().filter(r => r.fin.startsWith(Y));
  const genres = new Set(ly.map(r => r.b.genre).filter(Boolean)).size;
  const pave = ly.filter(r => +r.b.pagesTotal > 500).length;
  const sprint = ly.filter(r => r.b.dateDebut && r.b.dateFin === r.fin && (new Date(r.fin) - new Date(r.b.dateDebut)) / 864e5 < 7).length;
  const ser = {}; ly.forEach(r => { if (r.b.serie) { const k = Recherche.norm(r.b.serie); ser[k] = (ser[k] || 0) + 1; } });
  const act = activity(), actY = {}; Object.keys(act).filter(k => k.startsWith(Y)).forEach(k => actY[k] = act[k]);
  const best = streaks(actY).best;
  const cit = allQuotes().filter(x => (x.q.date || '').startsWith(Y)).length;
  const minY = allSessions().filter(s => (s.date || '').startsWith(Y)).reduce((s, x) => s + (+x.min || 0), 0);
  const emp = ly.filter(r => r.b.possession === 'emprunte').length;
  const fmt = ly.filter(r => r.b.format === 'audio' || r.b.format === 'numerique').length;
  let run = 0, bestM = 0, prev = 0;
  [...new Set(ly.map(r => +r.fin.slice(5, 7)))].sort((a, b) => a - b).forEach(m => { run = m === prev + 1 ? run + 1 : 1; bestM = Math.max(bestM, run); prev = m; });
  const relu = books.filter(b => (b.historique || []).length && ly.some(r => r.b.id === b.id)).length;
  return [
    ['premier', '🌱', 'Premier pas', 'Finir un livre', ly.length, 1],
    ['dix', '📚', 'Bibliophile', 'Finir 10 livres', ly.length, 10],
    ['vingtcinq', '🏛️', 'Grand lecteur', 'Finir 25 livres', ly.length, 25],
    ['cinquante', '👑', 'Dévoreur', 'Finir 50 livres', ly.length, 50],
    ['genres', '🌈', 'Explorateur', 'Lire 5 genres différents', genres, 5],
    ['pave', '🧱', 'Pavé', 'Finir un livre de plus de 500 pages', pave, 1],
    ['sprint', '⚡', 'Sprint', 'Finir un livre en moins d\'une semaine', sprint, 1],
    ['serie', '🔗', 'Marathon', 'Lire 3 tomes d\'une même série', Math.max(0, ...Object.values(ser)), 3],
    ['semaine', '🔥', 'Régulier', 'Lire 7 jours d\'affilée', best, 7],
    ['mois', '🌕', 'Assidu', 'Lire 30 jours d\'affilée', best, 30],
    ['constant', '📅', 'Constant', 'Finir un livre 3 mois de suite', bestM, 3],
    ['citations', '✍️', 'Collectionneur', 'Noter 10 citations', cit, 10],
    ['chrono', '⏱️', 'Concentré', 'Lire 10 h avec le chrono', Math.floor(minY / 60), 10],
    ['mediatheque', '🏫', 'Habitué', 'Lire 3 livres empruntés', emp, 3],
    ['format', '🎧', 'Touche-à-tout', 'Finir un livre audio ou numérique', fmt, 1],
    ['relecture', '🔁', 'Fidèle', 'Relire un livre', relu, 1],
    ...(goal ? [['objectif', '🎯', 'Objectif atteint', 'Lire ' + goal + ' livres dans l\'année', ly.length, goal]] : [])
  ].map(([id, e, nom, desc, n, but]) => ({id, e, nom, desc, n: Math.min(n, but), but, ok: n >= but}));
}
function defisPanel(y) {
  const d = defis(y), ok = d.filter(x => x.ok).length;
  return `<div class="panel"><h3>🏆 Mes défis ${y}</h3><div class="a sous-titre">${ok} / ${d.length} réussis</div>
    <div class="badges">${d.map(x => `<div class="badge ${x.ok ? 'ok' : ''}"><div class="be">${x.e}</div><b>${esc(x.nom)}</b><span>${esc(x.desc)}</span>
      ${x.ok ? '<span class="won">Réussi ✓</span>' : `<div class="bar"><i style="width:${Math.round(x.n / x.but * 100)}%"></i></div><span>${x.n} / ${x.but}</span>`}</div>`).join('')}</div></div>`;
}
// Félicite quand un nouveau défi est réussi (une fois par défi et par année)
function checkBadges(silent) {
  const y = new Date().getFullYear(), d = defis(y), won = d.filter(x => x.ok).map(x => x.id);
  prefs.badges = prefs.badges || {};
  const before = prefs.badges[y];
  prefs.badges[y] = won; savePrefs();
  if (silent || !before) return;
  d.filter(x => x.ok && !before.includes(x.id)).forEach((x, i) => toastLater(`🏆 Défi réussi : ${x.e} ${x.nom} !`, 1400 + i * 2600));
}
// Attend que le message en cours (avec bouton) soit fini avant d'en afficher un autre
function toastLater(msg, delay) {
  setTimeout(function tryShow() { if ($('#toast').classList.contains('act')) return setTimeout(tryShow, 1500); toast(msg); }, delay || 1000);
}

// Clic sur une suggestion : ajouter, refuser (remplacée par une autre), lire le résumé en entier
async function onSuggestion(e) {
  const more = e.target.closest('[data-more]'); if (more) { more.classList.toggle('open'); return true; }
  const a = e.target.closest('[data-sug]'); if (!a) return false;
  const card = a.closest('.sug'), ctx = card.dataset.ctx, i = +card.dataset.i;
  const items = ctx === 'sel' ? prefs.selection.items : ctx === 'rech' ? rech.res : ctx === 'rechx' ? rech.inconnus : lastTirage;
  const x = items[i]; if (!x) return true;
  const carte = ctx === 'rech' || ctx === 'rechx' ? rechCard : sugCard;
  if (a.dataset.sug === 'fiche') { ficheDepuis(x); return true; }
  if (a.dataset.sug === 'add') { addSuggestion(x); card.outerHTML = carte(x, ctx, i); return true; }
  if (a.dataset.sug === 'non' && ctx === 'tir') {
    // Tirage : le livre est retiré et ne sera plus proposé
    prefs.nonMerci = [...(prefs.nonMerci || []), Recherche.norm(x.titre)].slice(-300); savePrefs();
    items.splice(i, 1); const box = card.closest('#dc_res, #nx_res'); if (box) box.innerHTML = tirageHtml(items);
    return true;
  }
  if (a.dataset.sug === 'non') {
    prefs.nonMerci = [...(prefs.nonMerci || []), Recherche.norm(x.titre)].slice(-300); savePrefs();
    card.innerHTML = etatChargement('Je cherche un autre livre…');
    const y = await Recherche.decouvrir(x.theme, {exclude: b => dejaVu(b) || items.some(z => Recherche.norm(z.titre) === Recherche.norm(b.titre))}).catch(() => null);
    if (y) { retenir(y); items[i] = y; } else items.splice(i, 1);
    savePrefs(); renderDecouvrir();
    return true;
  }
  return false;
}

/* ---------- 📤 Partager mon bilan en image ---------- */
function loadCors(list) {
  return new Promise(async res => {
    for (const u of list) {
      const ok = await new Promise(r => {
        const i = new Image(); const t = setTimeout(() => r(null), 6000);
        if (!/^data:/.test(u)) i.crossOrigin = 'anonymous';
        i.onload = () => { clearTimeout(t); r(Recherche.placeholder(i.naturalWidth, i.naturalHeight) ? null : i); };
        i.onerror = () => { clearTimeout(t); r(null); };
        i.src = u;
      });
      if (ok) return res(ok);
    }
    res(null);
  });
}

// Revenir à la bibliothèque d'avant la dernière restauration
async function annulerRestauration() {
  let c = null;
  try { c = await Store.get('avant-restauration'); } catch (e) {}
  if (!c || !Array.isArray(c.books)) return toast('Pas de copie de sécurité disponible');
  // Échange : la bibliothèque actuelle devient à son tour la copie (on peut donc toujours revenir en arrière)
  try { await Store.set('avant-restauration', {books, goal, date: new Date().toISOString()}); }
  catch (e) { return toast('Impossible pour l\'instant (mémoire pleine ?)'); }
  fillStop = true;
  books = c.books.map(norm); goal = entier(c.goal) || 0;
  await Store.persist();
  prefs.avantRestauration = new Date().toISOString(); savePrefs();
  render(); toast('Bibliothèque précédente remise ✓', {label: 'Annuler', fn: annulerRestauration});
}

/* ---------- Enregistrer / supprimer ---------- */
function save(b, msg, action) {
  if (!b.id) b.id = newId();
  if (!b.ajoute) b.ajoute = new Date().toISOString();
  const i = books.findIndex(x => x.id === b.id);
  if (i >= 0) books[i] = b; else books.push(b);
  render(); if (msg) toast(msg, action);
  checkBadges();
  return Store.persist();
}
function remove(b) {
  const i = books.findIndex(x => x.id === b.id); if (i < 0) return;
  books.splice(i, 1); render(); Store.persist();
  toast('Livre supprimé', {label: 'Annuler', fn: () => { books.splice(Math.min(i, books.length), 0, b); render(); Store.persist(); toast('Livre remis ✓'); }});
}
function blankBook(statut) {
  return {titre: '', auteur: '', genre: '', note: 0, couverture: '', statut, citations: [], journal: [], historique: [], sessions: [],
    format: 'papier', possession: statut === 'a_lire' ? 'non' : 'a_moi'};
}
function bookFrom(x, statut) {
  const b = {...blankBook(statut), titre: x.titre, auteur: x.auteur || '', serie: x.serie || '', tome: x.tome || '',
    pagesTotal: x.pagesTotal || '', pagesSource: x.pagesTotal ? x.pagesSource || (x.isbn ? 'edition' : 'estimation') : '',
    isbn: x.isbn || '', editeur: x.editeur || '', annee: x.annee || '', genre: x.genre || '', possession: 'a_moi',
    sujets: x.sujets || [], classements: x.classements || []};
  if (b.classements.length) b.classTente = true;
  if (statut === 'en_cours') { b.dateDebut = today(); logPage(b, 0); }
  return b;
}
// Ce livre est-il déjà dans ma liste ? (même ISBN, ou même titre + auteur, et même tome si les deux en ont un)
function findOwned(x, exceptId) {
  const n = Recherche.norm, sn = Recherche.surname;
  const sameTome = b => !b.tome || !x.tome || String(b.tome) === String(x.tome);
  const sameTitle = b => n(b.titre) === n(x.titre) || (b.serie && x.serie && b.tome && x.tome && n(b.serie) === n(x.serie));
  return books.find(b => b.id !== exceptId && x.isbn && b.isbn === x.isbn) ||
    books.find(b => b.id !== exceptId && !b.aCompleter && sameTitle(b) && sameTome(b) && (!sn(b.auteur) || !sn(x.auteur) || sn(b.auteur) === sn(x.auteur)));
}

function quick(act, b) {
  if (act === 'start' || act === 'resume') {
    const nb = {...b, statut: 'en_cours', dateDebut: b.dateDebut || today(), dateFin: ''};
    logPage(nb, nb.pageActuelle || 0);
    save(nb, act === 'start' ? 'Bonne lecture ! 📖' : 'C\'est reparti ! 📖');
  }
  else if (act === 'pin') save({...b, epingle: !b.epingle}, b.epingle ? 'Désépinglé' : 'Épinglé en haut 📌');
  else if (act === 'fini') openForm({...b, statut: 'lu', dateFin: today(), pageActuelle: b.pagesTotal || b.pageActuelle}, {finish: true});
  else if (act === 'pages') openPage(b);
  else if (act === 'quote') openQuote(b);
  else if (act === 'timer') startTimer(b);
  else if (act === 'plus') openActions(b);
}
// « ⋯ » d'un livre en cours : les autres actions, en grand
function openActions(b) {
  $('#modal').innerHTML = `<h2>${esc(b.titre)}</h2>
    <div class="ajout">
      <button type="button" data-act="timer"><b><span class="ico i-chrono" aria-hidden="true">⏱️</span> Lire avec le chrono</b><span>Mesure ta séance et ta vitesse de lecture</span></button>
      <button type="button" data-act="quote"><b><span class="ico i-modifier" aria-hidden="true">✍️</span> Ajouter une citation</b><span>Une phrase qui t'a marqué</span></button>
      <button type="button" data-act="fini"><b><span class="ico i-fini" aria-hidden="true">✓</span> J'ai fini</b><span>Ranger le livre dans « Lus » et le noter</span></button>
      <button type="button" data-act="edit"><b><span class="ico i-texte" aria-hidden="true">📝</span> Modifier la fiche</b><span>Pages, dates, résumé, rayons…</span></button>
    </div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close type="button">Fermer</button></div>`;
  showM();
  $('#modal .ajout').onclick = e => {
    const x = e.target.closest('[data-act]'); if (!x) return;
    const nb = books.find(z => z.id === b.id) || b;
    if (x.dataset.act === 'edit') return openForm(nb);
    if (x.dataset.act === 'timer') closeM();
    quick(x.dataset.act, nb);
  };
}
// Après avoir fini un tome : proposer le suivant
function afterFinish(b) {
  if (!b.serie || !b.tome) return;
  const next = +b.tome + 1;
  if (books.some(x => Recherche.norm(x.serie) === Recherche.norm(b.serie) && +x.tome === next)) return;
  setTimeout(() => toast(`Fini ! Ajouter le tome ${next} de ${b.serie} ?`, {label: '＋ Tome ' + next, fn: () => addNextTome(b.serie, next)}), 900);
}
function addNextTome(serie, n) {
  openForm(null, {statut: 'a_lire', query: serie + ' ' + n});
}

/* ---------- Fenêtres ---------- */
// Erreur de saisie affichée sous le champ (et annoncée), effacée dès qu'on corrige
function erreurChamp(id, message) {
  const inp = $('#' + id); if (!inp) return;
  let p = $('#' + id + '_err');
  if (!p) { p = document.createElement('p'); p.className = 'erreur'; p.id = id + '_err'; p.setAttribute('role', 'alert'); inp.after(p); }
  p.textContent = message; inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', p.id); inp.focus();
  inp.addEventListener('input', () => { p.remove(); inp.removeAttribute('aria-invalid'); inp.removeAttribute('aria-describedby'); }, {once: true});
}
// (élément qui avait le focus avant la fenêtre : il le retrouve à la fermeture)
let focusAvant = null;
function showM() {
  if (!$('#ov').classList.contains('show')) focusAvant = document.activeElement;
  $('#ov').classList.add('show'); $('#modal').scrollTop = 0; modalModifie = false;
  const h = $('#modal h2'); if (h) { h.id = 'modalTitre'; h.tabIndex = -1; h.focus({preventScroll: true}); }
}
function closeM() {
  $('#ov').classList.remove('show'); form = null;
  // (une autre fenêtre a changé la bibliothèque pendant que celle-ci était ouverte)
  if (Store.aRafraichir) { Store.aRafraichir = false; render(); }
  if (focusAvant && document.contains(focusAvant)) focusAvant.focus({preventScroll: true});
  focusAvant = null;
}

function openPage(b) {
  // En un geste : quelques pages de plus, ou « Fini » (au-dessus du champ, pour rester visibles quand le clavier s'ouvre)
  const cur = +b.pageActuelle || 0;
  $('#modal').innerHTML = `<h2>Où en es-tu ?</h2><p class="a remonte">${esc(b.titre)}</p>
    <div class="acts mb-3" id="p_vite">${[10, 25, 50].map(n => `<button class="btn" type="button" data-plus="${n}">+${n} p.</button>`).join('')}${b.pagesTotal ? '<button class="btn" type="button" data-plus="fin">Fini ✓</button>' : ''}</div>
    <div class="f"><label for="p_val">Page actuelle${b.pagesTotal ? ' (sur ' + esc(b.pagesTotal) + ')' : ''}</label>
    <input id="p_val" type="number" min="0" inputmode="numeric" value="${esc(b.pageActuelle)}"></div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="p_ok">Enregistrer</button></div>`;
  showM();
  const inp = $('#p_val'); inp.focus(); inp.select();
  const ok = () => {
    const n = parseInt(inp.value, 10);
    if (isNaN(n) || n < 0) return toast('Indique un numéro de page');
    closeM();
    const tot = +b.pagesTotal || 0;
    const nb = {...b, pageActuelle: tot ? Math.min(n, tot) : n};
    logPage(nb, nb.pageActuelle);
    // (dernière page : enregistrée d'abord, comme pour le chrono ; fermer la fiche « Bravo » ne la perd plus)
    if (tot && n >= tot) { save(nb); return openForm({...nb, statut: 'lu', dateFin: today()}, {finish: true}); }
    const d = n - (+b.pageActuelle || 0);
    save(nb, d > 0 ? `+${plural(d, 'page')} 👏` : 'Page enregistrée');
  };
  $('#p_ok').onclick = ok;
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('#p_vite').onclick = e => {
    const x = e.target.closest('[data-plus]'); if (!x) return;
    inp.value = x.dataset.plus === 'fin' ? +b.pagesTotal : cur + +x.dataset.plus; ok();
  };
}

function openQuote(b) {
  $('#modal').innerHTML = `<h2>Nouvelle citation</h2><p class="a remonte">${esc(b.titre)}</p>
    <div class="f"><label for="c_txt">La phrase</label><textarea id="c_txt" rows="4" placeholder="Une phrase qui t'a marqué…"></textarea></div>
    <div class="f"><label for="c_page">Page</label><input id="c_page" type="number" min="0" inputmode="numeric" value="${esc(b.pageActuelle)}"></div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="c_ok">Enregistrer</button></div>`;
  showM(); $('#c_txt').focus();
  $('#c_ok').onclick = () => {
    const texte = $('#c_txt').value.trim(); if (!texte) return toast('Écris la citation');
    closeM();
    save({...b, citations: [...(b.citations || []), {texte, page: $('#c_page').value, date: today()}]}, 'Citation ajoutée ✍️');
  };
}

        <div class="f"><label for="f_pret">À rendre le</label><input id="f_pret" type="date" value="${esc(form.pretRetour)}"></div>
      </div>
      <div class="row">
        <div class="f"><label for="f_isbn">ISBN</label><input id="f_isbn" inputmode="numeric" value="${esc(form.isbn)}"></div>
        <div class="f"><label for="f_edit">Éditeur</label><input id="f_edit" value="${esc(form.editeur)}"></div>
        <div class="f small"><label for="f_annee">Année</label><input id="f_annee" inputmode="numeric" value="${esc(form.annee)}"></div>

      <button class="btn" data-close type="button">Annuler</button><button class="btn pri" id="f_save" type="button">Enregistrer</button></div>`;
  showM();
  syncShow(); paintStars(); paintPrev(); paintQuotes(); syncLoan(); paintCats(); paintPagesSrc();
  $('#f_total').oninput = paintPagesSrc;
  $('#f_cats').onclick = e => {
    const x = e.target.closest('[data-catnon]'); if (!x) return;
    const id = x.dataset.catnon;
    // (retirer un rayon retire aussi ses sous-rayons ajoutés à la main)
    form.catOui = (form.catOui || []).filter(c => c !== id && !c.startsWith(id + '/'));
    if (idsRangement(form).includes(id)) form.catNon = [...new Set([...(form.catNon || []), id])];
    paintCats();
  };

    if (e.target.id !== 'f_catadd' || !e.target.value) return;
    const id = e.target.value, rayon = id.split('/')[0];
    // (ajouter un sous-rayon fait aussi revenir son rayon, s'il avait été retiré)
    form.catNon = (form.catNon || []).filter(c => c !== id && c !== rayon);
    if (!idsRangement(form).includes(id)) form.catOui = [...new Set([...(form.catOui || []), id])];
    paintCats();
  };

    const s = $('#f_statut').value;
