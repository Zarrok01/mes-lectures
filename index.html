/* ---------- Compléter automatiquement les fiches existantes ---------- */
const needsFill = b => !b.aCompleter && b.titre && (!b.couverture || brokenCovers.has(b.id) || !b.pagesTotal || (!b.resume && !b.resumeTente));
// Résumé, thèmes et genre (une seule tentative par livre)
async function fillResume(b) {
  if (b.resume) return false;
  const r = await Recherche.resume(b).catch(() => ({}));
  const i = books.findIndex(z => z.id === b.id); if (i < 0) return false;
  const nb = {...books[i], resumeTente: true};
  if (r.resume) nb.resume = r.resume;
  if (r.sujets && r.sujets.length && !(nb.sujets || []).length) nb.sujets = r.sujets;
  if (!nb.genre && r.genre) nb.genre = r.genre;
  books[i] = nb;
  return !!r.resume;
}
async function fillOne(b) {
  // Il ne manque que le résumé : pas besoin de tout rechercher
  if (b.couverture && !brokenCovers.has(b.id) && b.pagesTotal) return fillResume(b);
  const changed = await fillFiche(b);
  const apres = books.find(z => z.id === b.id) || b;
  return (await fillResume(apres)) || changed;
}
async function fillFiche(b) {
  const n = Recherche.norm, sn = Recherche.surname;
  let res = [], byIsbn = false;
  if (b.isbn && Recherche.toIsbn13(b.isbn)) { res = await Recherche.parIsbn(Recherche.toIsbn13(b.isbn)).catch(() => []); byIsbn = res.length > 0; }
  if (!res.length) res = await Recherche.parTexte(b.titre + (b.auteur ? ' ' + b.auteur : '') + (b.tome ? ' ' + b.tome : '')).catch(() => []);
  // Le résultat doit vraiment être le même livre (même titre, même auteur, même tome), en français de préférence
  const same = res.filter(r => (n(r.titre) === n(b.titre) || (b.serie && r.serie && n(r.serie) === n(b.serie) && String(r.tome) === String(b.tome)))
    && (!sn(b.auteur) || sn(r.auteur) === sn(b.auteur)) && (!b.tome || !r.tome || String(r.tome) === String(b.tome)));
  const x = same.find(r => r.langue === 'fre') || same[0];
  const nb = {...books.find(z => z.id === b.id)};
  const coverMissing = !nb.couverture || brokenCovers.has(b.id);
  if (!x) {
    // Fiche introuvable : on peut au moins chercher une couverture
    if (!coverMissing) return false;
    const l = await Recherche.chercherCouvertures(nb, 5).catch(() => []);
    if (!l.length) return false;
    setCovers(nb, l[0], l); brokenCovers.delete(b.id);
    const i = books.findIndex(z => z.id === b.id); if (i >= 0) books[i] = nb;
    return true;
  }
  const y = (!x.pagesTotal || !x.isbn) ? await Recherche.completer(x) : x;
  // Trouvé par le titre : on ne connaît pas l'édition exacte → pas d'ISBN ni d'éditeur (ce serait peut-être faux)
  for (const f of byIsbn ? ['auteur', 'pagesTotal', 'isbn', 'editeur', 'annee', 'genre'] : ['auteur', 'pagesTotal', 'genre']) if (!nb[f] && y[f]) nb[f] = y[f];
  // Série : seulement si le livre n'en a pas, que la fiche vient d'un catalogue (BnF/Sudoc) et que le titre colle
  if (!nb.serie && x.serie && x.tome && (x.sources || []).some(s => s === 'BnF' || s === 'Sudoc') && n(x.titre) === n(b.titre)) { nb.serie = x.serie; nb.tome = x.tome; }
  if (coverMissing) {
    let u = await Recherche.couverture(y.covers), list = y.covers;
    if (!u) { list = await Recherche.chercherCouvertures(nb, 5).catch(() => []); u = list[0] || ''; }
    if (u) { setCovers(nb, u, list); brokenCovers.delete(b.id); }
  }
  const i = books.findIndex(z => z.id === b.id); if (i >= 0) books[i] = nb;
  return true;
}
async function fillAll(onProgress) {
  // Un livre à la fois, avec une petite pause : les catalogues publics n'aiment pas être bombardés
  const todo = books.filter(needsFill);
  let ok = 0, ko = 0;
  for (const b of todo) {
    onProgress(`Recherche ${ok + ko + 1} / ${todo.length} : ${b.titre}…`);
    (await fillOne(b).catch(() => false)) ? ok++ : ko++;
    if ((ok + ko) % 5 === 0) { await Store.persist(); render(); }
    await new Promise(r => setTimeout(r, 600));
  }
  await Store.persist(); render();
  return {ok, ko};
}
$('#settingsBtn').onclick = openSettings;

/* ---------- Clics et saisies ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'ov') return closeM();
  if (e.target.id === 'timerOv') { $('#timerOv').classList.remove('show'); return paintTimerPill(); }
  if (e.target.closest('#view')) { prefs.view = prefs.view === 'grille' ? 'liste' : 'grille'; savePrefs(); return render(); }
  if (e.target.closest('#dice')) return openNext();
  if (e.target.closest('[data-more], [data-sug]')) return onSuggestion(e);
  const day = e.target.closest('[data-day]'); if (day) return dayInfo(day.dataset.day);
  const sh = e.target.closest('[data-share]'); if (sh) return shareBilan(+sh.dataset.share);
  const ex = e.target.closest('[data-export]');
  if (ex) return doExport(ex.dataset.export);
  if (e.target.closest('[data-goal]')) {
    goal = parseInt($('#goal').value, 10) || 0; renderStats(); Store.persist();
    return toast(goal ? 'Objectif enregistré 🎯' : 'Objectif retiré');
  }
  const nx = e.target.closest('[data-next]');
  if (nx) { const [s, n] = nx.dataset.next.split('|'); return addNextTome(s, +n); }
  const sr = e.target.closest('[data-serie]');
  if (sr) { ui.tab = 'a_lire'; ui.q = sr.dataset.serie; ui.sort = 'serie'; const c = counts(); if (!books.some(b => b.statut === 'a_lire' && Recherche.norm(b.serie) === Recherche.norm(sr.dataset.serie))) ui.tab = 'lu'; render(); return; }
  const op = e.target.closest('[data-open]');
  if (op) { const b = books.find(x => x.id === op.dataset.open); if (b) openForm(b); return; }
  const qt = e.target.closest('[data-book]');
  if (qt) { const b = books.find(x => x.id === qt.dataset.book); if (b) openForm(b); return; }
  const c = e.target.closest('.card, .gcard');
  if (c && !e.target.closest('.modal')) {
    const b = books.find(x => x.id === c.dataset.id); if (!b) return;
    const act = e.target.closest('[data-act]');
    return act ? quick(act.dataset.act, b) : openForm(b);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; renderCards(); }
  if (e.target.id === 'cq') { ui.cq = e.target.value; renderQuotes(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'genre') { ui.genre = e.target.value; renderCards(); }
  if (e.target.id === 'own') { ui.own = e.target.value; renderCards(); }
  if (e.target.id === 'sort') { ui.sort = e.target.value; renderCards(); }
  if (e.target.id === 'year') { ui.year = +e.target.value; renderStats(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#scanOv').classList.contains('show')) closeScanner();
  else if ($('#bulkOv').classList.contains('show')) closeBulk();
  else if ($('#timerOv').classList.contains('show')) { $('#timerOv').classList.remove('show'); paintTimerPill(); }
  else if ($('#ov').classList.contains('show')) closeM();
});
$('#fab').onclick = () => openForm(null);

/* ---------- Glisser le doigt à gauche / à droite pour changer d'onglet ---------- */
const TAB_ORDER = ['en_cours', 'a_lire', 'decouvrir', 'lu', 'abandon', 'citations', 'stats'];
function goTab(dir) {
  const i = TAB_ORDER.indexOf(ui.tab), j = i + dir;
  if (i < 0 || j < 0 || j >= TAB_ORDER.length) return false;
  ui.tab = TAB_ORDER[j]; render(); window.scrollTo(0, 0);
  const m = $('#main'); m.classList.remove('slide-l', 'slide-r'); void m.offsetWidth; m.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
  return true;
}
(() => {
  let sx = 0, sy = 0, st = 0, ok = false;
  // Zones qui défilent déjà à l'horizontale (calendrier, rangées de livres…) : le geste leur appartient
  const zoneLibre = el => el.closest('.cal, .sugs, .tabs, .chips, input, textarea, select, .modal, .notice');
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && !zoneLibre(e.target) && !document.querySelector('.ov.show');
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!ok) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    // Un vrai geste horizontal : assez long, plus horizontal que vertical, assez rapide
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 700) goTab(dx < 0 ? 1 : -1);
  }, {passive: true});
})();

/* ---------- Démarrage ---------- */
(async function init() {
  try {
    const d = await Store.load();
    books = (d.books || []).map(norm);
    goal = +d.goal || 0;
    const c = counts();
    if (!c.en_cours && books.length) ui.tab = c.a_lire ? 'a_lire' : 'lu';
    render();
    checkBadges(true);
    if (!prefs.astuceGlisser && ('ontouchstart' in window)) { prefs.astuceGlisser = true; savePrefs(); toastLater('👆 Astuce : glisse à gauche ou à droite pour changer d\'onglet', 2500); }
    // Une fois par mois : préparer la sélection de 5 livres (en arrière-plan, s'il y a internet)
    if (navigator.onLine !== false) setTimeout(() => genSelection(), 4000);
    if (prefs.timer) paintTimerPill();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty">Impossible de charger tes livres.<br><small>${esc(e.message || e)}</small></div>`;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
