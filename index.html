// Classements d'un livre déjà enregistré (une seule tentative réussie par livre ; en cas de panne réseau, on réessaiera)
async function fillClass(b) {
  const r = await Recherche.classement(b);
  const i = books.findIndex(z => z.id === b.id); if (i < 0) return false;
  const nb = {...books[i], classTente: true};
  if (r.classements.length) nb.classements = Recherche.unirClassements([nb.classements, r.classements]);
  books[i] = nb;
  return r.classements.length > 0;
}
let catFillBusy = false;
async function fillCategories() {
  if (catFillBusy) return;
  if (navigator.onLine === false) return toast('Pas de connexion internet');
  catFillBusy = true;
  const todo = sansClassement();
  let ok = 0, k = 0, pannes = 0;
  for (const b of todo) {
    const el = $('#catfillres'), bt = $('#catfill');
    if (el) el.textContent = `Recherche ${++k} / ${todo.length} : ${b.titre}…`; else k++;
    if (bt) bt.disabled = true;
    try { if (await fillClass(b)) ok++; pannes = 0; } catch (e) { if (++pannes >= 3) break; }
    if (k % 5 === 0) await Store.persist();
    await new Promise(r => setTimeout(r, 700));
  }
  await Store.persist(); catFillBusy = false;
  if (ui.tab === 'stats') renderStats();
  toast(pannes >= 3 ? 'Les catalogues ne répondent pas : réessaie plus tard' : `Rayons trouvés pour ${plural(ok, 'livre')} sur ${todo.length}`);
}

/* ---------- 🗓️ Calendrier de lecture (une case par jour) ---------- */
function calendarPanel(y) {
  const act = activity(), minBy = {}, finBy = {};
  allSessions().forEach(s => { minBy[s.date] = (minBy[s.date] || 0) + (+s.min || 0); });
  readings().forEach(r => { (finBy[r.fin] = finBy[r.fin] || []).push(r.b.titre); });
  const start = new Date(y, 0, 1), offset = (start.getDay() + 6) % 7;   // lundi en haut
  const days = Math.round((new Date(y, 11, 31) - start) / 864e5) + 1, t = today();
  const cells = []; let jours = 0;
  for (let i = 0; i < offset; i++) cells.push('<i class="invisible"></i>');
  for (let i = 0; i < days; i++) {
    const k = iso(new Date(y, 0, 1 + i)), p = Math.round(act[k] || 0), m = minBy[k] || 0;
    const lvl = finBy[k] ? 5 : (p >= 100 || m >= 90) ? 4 : (p >= 50 || m >= 45) ? 3 : (p >= 20 || m >= 20) ? 2 : (p > 0 || m > 0 || act[k]) ? 1 : 0;
    if (lvl) jours++;
    cells.push(`<i class="l${lvl}${k > t ? ' f' : ''}${k === t ? ' now' : ''}" data-day="${k}"></i>`);
  }
  const months = MOIS_COURT.map((m, i) => `<span style="grid-column:${Math.floor((offset + Math.round((new Date(y, i, 1) - start) / 864e5)) / 7) + 1}">${m}</span>`).join('');
  return `<div class="panel"><h3>${ico('calendrier', '🗓️')} Mon année de lecture</h3>
    <div class="a sous-titre">${plural(jours, 'jour')} de lecture en ${y}</div>
    <div class="cal" id="cal"><div class="calm">${months}</div><div class="calg">${cells.join('')}</div></div>
    <div class="calleg"><span class="a petit" id="calinfo">Touche un jour pour voir le détail.</span><span class="sp"></span>
      moins <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> plus · <i class="l5"></i> livre fini</div></div>`;
}
function dayInfo(k) {
  const p = Math.round(activity()[k] || 0);
  const m = allSessions().filter(s => s.date === k).reduce((s, x) => s + (+x.min || 0), 0);
  const fin = readings().filter(r => r.fin === k).map(r => r.b.titre);
  const parts = [p ? plural(p, 'page') : '', m ? fdur(m) + ' chronométrées' : '', fin.length ? '🎉 fini : ' + fin.join(', ') : ''].filter(Boolean);
  $('#calinfo').textContent = fdate(k) + ' : ' + (parts.length ? parts.join(' · ') : 'rien de noté');
}

/* ---------- 🏆 Défis et badges ---------- */
function defis(y) {
  const Y = String(y);
  const ly = readings().filter(r => r.fin.startsWith(Y));
  const genres = new Set(ly.map(r => (r.b.classif || {}).genre).filter(Boolean)).size;
  const pave = ly.filter(r => +r.b.pagesTotal > 500).length;
  const sprint = ly.filter(r => r.b.dateDebut && r.b.dateFin === r.fin && (new Date(r.fin) - new Date(r.b.dateDebut)) / 864e5 < 7).length;
  const ser = {}; ly.forEach(r => { if (r.b.serie) { const k = Recherche.norm(r.b.serie); ser[k] = (ser[k] || 0) + 1; } });
  const act = activity(), actY = {}; Object.keys(act).filter(k => k.startsWith(Y)).forEach(k => actY[k] = act[k]);
  const best = streaks(actY).best;
  const cit = allQuotes().filter(x => (x.q.date || '').startsWith(Y)).length;
  const minY = allSessions().filter(s => (s.date || '').startsWith(Y)).reduce((s, x) => s + (+x.min || 0), 0);
  const emp = ly.filter(r => r.b.possession === 'emprunte').length;
  const fmt = ly.filter(r => r.b.format === 'audio' || r.b.format === 'numerique').length;
  let run = 0, bestM = 0, prev = 0;
  [...new Set(ly.map(r => +r.fin.slice(5, 7)))].sort((a, b) => a - b).forEach(m => { run = m === prev + 1 ? run + 1 : 1; bestM = Math.max(bestM, run); prev = m; });
  const relu = books.filter(b => (b.historique || []).length && ly.some(r => r.b.id === b.id)).length;
  return [
    ['premier', '🌱', 'Premier pas', 'Finir un livre', ly.length, 1],
    ['dix', '📚', 'Bibliophile', 'Finir 10 livres', ly.length, 10],
    ['vingtcinq', '🏛️', 'Grand lecteur', 'Finir 25 livres', ly.length, 25],
    ['cinquante', '👑', 'Dévoreur', 'Finir 50 livres', ly.length, 50],
    ['genres', '🌈', 'Explorateur', 'Lire 5 genres différents confirmés', genres, 5],
    ['pave', '🧱', 'Pavé', 'Finir un livre de plus de 500 pages', pave, 1],
    ['sprint', '⚡', 'Sprint', 'Finir un livre en moins d\'une semaine', sprint, 1],
    ['serie', '🔗', 'Marathon', 'Lire 3 tomes d\'une même série', Math.max(0, ...Object.values(ser)), 3],
    ['semaine', '🔥', 'Régulier', 'Lire 7 jours d\'affilée', best, 7],
    ['mois', '🌕', 'Assidu', 'Lire 30 jours d\'affilée', best, 30],
    ['constant', '📅', 'Constant', 'Finir un livre 3 mois de suite', bestM, 3],
    ['citations', '✍️', 'Collectionneur', 'Noter 10 citations', cit, 10],
    ['chrono', '⏱️', 'Concentré', 'Lire 10 h avec le chrono', Math.floor(minY / 60), 10],
    ['mediatheque', '🏫', 'Habitué', 'Lire 3 livres empruntés', emp, 3],
    ['format', '🎧', 'Touche-à-tout', 'Finir un livre audio ou numérique', fmt, 1],
    ['relecture', '🔁', 'Fidèle', 'Relire un livre', relu, 1],
    ...(goal ? [['objectif', '🎯', 'Objectif atteint', 'Lire ' + goal + ' livres dans l\'année', ly.length, goal]] : [])
  ].map(([id, e, nom, desc, n, but]) => ({id, e, nom, desc, n: Math.min(n, but), but, ok: n >= but}));
}

const ICONE_DEFI = {premier: 'pousse', dix: 'livres', vingtcinq: 'colonnes', cinquante: 'couronne', genres: 'arc', pave: 'brique', sprint: 'eclair', serie: 'lien',

// (lot 5) Résumé : le compte, puis les 3 défis les plus avancés ; tous les défis restent derrière « Voir tous les défis »
function defisPanel(y) {
  const d = defis(y), ok = d.filter(x => x.ok).length;
  const prochains = d.filter(x => !x.ok).sort((a, b) => b.n / b.but - a.n / a.but).slice(0, 3);

const THEME_DE_RAYON = {politique: 'cat:politique', histoire: 'cat:histoire', shs: 'cat:shs', eco: 'cat:eco', sciences: 'cat:sciences', art: 'cat:art',
  religion: 'cat:religion', voyages: 'cat:voyages', pratique: 'cat:pratique', litterature: 'roman', polar: 'polar', romance: 'romance', ya: 'ya',
  bd: 'bd', jeunesse: 'jeunesse'};
const THEME_DE_GENRE = {'Roman': 'roman', 'Polar / Thriller': 'polar', 'SF / Fantasy': 'fantasy', 'BD / Manga': 'bd', 'Essai': 'essai',
  'Développement perso': 'perso', 'Pro / VAE': 'social', 'Biographie': 'essai', 'Jeunesse': 'jeunesse'};
function mesGouts() {
  const poids = {}, poidsClassements = {}, aimes = [];
  books.forEach(b => {
    // un livre lu et bien noté compte beaucoup ; un livre abandonné ou mal noté compte contre
    const w = b.statut === 'abandon' ? -1 : b.statut === 'lu' ? (b.note >= 4 ? 3 : b.note && b.note <= 2 ? -0.5 : 2) : 1;
    // (Science-fiction, Fantastique & Fantasy : le thème de tirage suit le sous-rayon)
    const ids = new Set(catsDe(b).map(c => c.id === 'imaginaire' ? (sousDe(b).some(z => z.id === 'imaginaire/sf') ? 'sf' : 'fantasy') : THEME_DE_RAYON[c.id]).filter(Boolean));
    if (!ids.size && THEME_DE_GENRE[b.genre]) ids.add(THEME_DE_GENRE[b.genre]);
    ids.forEach(id => poids[id] = (poids[id] || 0) + w);
    const c = b.classif || {};
    for (const [dim, valeurs] of [['genre', c.genre ? [c.genre] : []], ['sousGenres', c.sousGenres], ['themes', c.themes], ['ambiances', c.ambiances]]) {
      for (const id of valeurs || []) {
        const cle = dim + ':' + id, p = poidsClassements[cle] || (poidsClassements[cle] = {dim, id, poids: 0, livres: []});
        p.poids += w;
        if (!p.livres.some(x => x.id === b.id)) p.livres.push(b);
      }
    }
    if (b.statut === 'lu' && b.note >= 4 && b.auteur) aimes.push(b);
  });
  const themes = Object.entries(poids).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);

async function lancerRech(suite) {
  if (!suite) {
    const par = rech.par;
    let cat = par === 'theme' ? rech.cat : '', texte = rech.texte.trim();
    if (par !== 'theme' && !texte) return toast(par === 'auteur' ? 'Écris le nom d\'un auteur' : 'Écris un titre');
    // « philo », « polar », « manga »… écrits à la main → le thème correspondant
    if (!rech.classif.length && par === 'theme' && !cat && texte) {
      const t = Recherche.rayonPourTexte(texte);
      if (t && Recherche.THEMES_RECHERCHE.includes(t.rayon)) {
        cat = rech.cat = t.rayon.id; rech.sous = t.sous && Recherche.SOUS_RAYONS.some(z => z.id === t.sous && z.rech) ? t.sous : '';
        texte = rech.texte = ''; renderDecouvrir();

    }
    // Critères de l'explorateur : chacun part comme une condition à part. Les ambiances, elles, ne sont jamais dans les
    // notices des catalogues : elles ne partent pas (et le nom du rayon n'est pas glissé dans les mots : un rayon de
    // fiction seul garde sa recherche spécialisée)
    const classifs = par === 'theme' ? rech.classif.filter(x => x.dim !== 'ambiances').map(x => Taxonomie.nom(x.dim, x.id)).filter(Boolean) : [];
    if (!cat && !texte && !classifs.length) return toast(par === 'theme' && rech.classif.length ? 'Les ambiances ne sont pas dans les catalogues : ajoute un genre, un thème ou un sujet' : 'Choisis un thème ou écris un sujet');
    const sousOk = par === 'theme' && rech.sous && Recherche.SOUS_RAYONS.some(z => z.id === rech.sous && z.rayon === cat && z.rech) ? rech.sous : '';
    Object.assign(rech, {lastPar: par, lastSous: sousOk, lastCat: cat, lastTexte: texte, lastCriteres: classifs, lastClassif: rech.classif.map(x => ({...x})), lastMax: rech.max, res: [], inconnus: [], trop: 0, examines: 0, fin: false, cur: {}});
    prefs.rechCat = sousOk || cat; prefs.rechMax = rech.max; savePrefs();
  }
  const tok = ++rech.tok;
  Object.assign(rech, {etat: 'busy', erreur: '', stop: false, enCours: 0});
  if (navigator.onLine === false) { Object.assign(rech, {etat: 'fini', erreur: 'hors'}); return paintRech(); }
  paintRech();
  // Les livres trouvés s'affichent au fur et à mesure
  let nr = 0, ni = 0;

    const neufs = o.res.length - nr + o.inconnus.length - ni;
    rech.res.push(...o.res.slice(nr)); nr = o.res.length;
    rech.inconnus.push(...o.inconnus.slice(ni)); ni = o.inconnus.length;
    rech.enCours = o.examines;

  const r = await Recherche.parTheme({...crit, max: rech.lastMax, stop: () => rech.stop || tok !== rech.tok}, rech.cur, o => {
    if (tok !== rech.tok) return;
    if (absorbe(o)) paintRech();
    else { const p = $('#rq_prog'); if (p) p.textContent = `Je cherche (${plural(rech.examines + o.examines, 'livre')} regardé${rech.examines + o.examines > 1 ? 's' : ''})…`; }
  });

function chercherClassement(value) {

// Clic sur une suggestion : ajouter, refuser (remplacée par une autre), lire le résumé en entier
async function onSuggestion(e) {
  const more = e.target.closest('[data-more]'); if (more) { more.classList.toggle('open'); return true; }
  const a = e.target.closest('[data-sug]'); if (!a) return false;
  const card = a.closest('.sug'), ctx = card.dataset.ctx, i = +card.dataset.i;
  const items = ctx === 'sel' ? prefs.selection.items : ctx === 'vu' ? prefs.vus || [] : ctx === 'rech' ? rech.res : ctx === 'rechx' ? rech.inconnus : lastTirage;
  const x = items[i]; if (!x) return true;
  const carte = ctx === 'rech' || ctx === 'rechx' ? rechCard : sugCard;
  if (a.dataset.sug === 'fiche') { ficheDepuis(x); return true; }
  if (a.dataset.sug === 'add') { addSuggestion(x); card.outerHTML = carte(x, ctx, i); return true; }
  if (a.dataset.sug === 'non' && ctx === 'tir') {
    // Tirage : le livre est retiré et ne sera plus proposé
    prefs.nonMerci = [...(prefs.nonMerci || []), Recherche.norm(x.titre)].slice(-300); savePrefs();
    items.splice(i, 1); const box = card.closest('#dc_res, #nx_res'); if (box) box.innerHTML = tirageHtml(items);
    return true;
  }
  if (a.dataset.sug === 'non') {
    prefs.nonMerci = [...(prefs.nonMerci || []), Recherche.norm(x.titre)].slice(-300); savePrefs();
    card.innerHTML = etatChargement('Je cherche un autre livre…');
    const y = await Recherche.decouvrir(x.theme, {exclude: b => dejaVu(b) || items.some(z => Recherche.norm(z.titre) === Recherche.norm(b.titre))}).catch(() => null);
    if (y) { retenir(y); items[i] = y; } else items.splice(i, 1);
    savePrefs(); renderDecouvrir();
    return true;
  }
  return false;
}

function loadCors(list) {
  return new Promise(async res => {
    for (const u of list) {
      const ok = await new Promise(r => {
        const i = new Image(); const t = setTimeout(() => r(null), 6000);
        if (!/^data:/.test(u)) i.crossOrigin = 'anonymous';
        i.onload = () => { clearTimeout(t); r(Recherche.placeholder(i.naturalWidth, i.naturalHeight) ? null : i); };
        i.onerror = () => { clearTimeout(t); r(null); };
        i.src = u;
      });
      if (ok) return res(ok);
    }
    res(null);
  });
}

  return `Dernière sauvegarde : <b>${days === 0 ? 'aujourd\'hui' : days === 1 ? 'hier' : 'il y a ' + days + ' jours'}</b>.` + copieRestauration() + copieMigration();

// Après une restauration : bouton pour revenir à la bibliothèque d'avant
const copieRestauration = () => prefs.avantRestauration ? `<br><button class="btn small mt-2" type="button" data-undorestore><span class="ico i-retour" aria-hidden="true">↩️</span> Revenir à ma bibliothèque d'avant (copie du ${fdate(iso(new Date(prefs.avantRestauration)))})</button>` : '';
// (après un retour : le bouton devient « Annuler le retour », pour qu'un second appui ne puisse rien écraser)
const copieMigration = () => !prefs.avantMigration ? '' : prefs.migrationRemise
  ? `<br><button class="btn small mt-2" type="button" data-undoretour>${ico('retour', '↩️')} Annuler le retour à ma bibliothèque d'avant la mise à jour</button>`
  : `<br><button class="btn small mt-2" type="button" data-undomigration>${ico('retour', '↩️')} Revenir à ma bibliothèque d'avant la mise à jour (copie du ${fdate(iso(new Date(prefs.avantMigration)))})</button>`;
// Résumé d'une bibliothèque, pour vérifier qu'une sauvegarde est complète : livres, citations, notes, relevés de pages
const resumeDe = l => ({livres: l.length, citations: l.reduce((n, b) => n + (b.citations || []).length, 0),
  notes: l.reduce((n, b) => n + (b.notes || []).length, 0), journal: l.reduce((n, b) => n + (b.journal || []).length, 0)});
const memeResume = (a, b) => !!a && !!b && ['livres', 'citations', 'notes', 'journal'].every(k => +a[k] === +b[k]);
// Relit le texte d'une sauvegarde comme le ferait la restauration et vérifie qu'il contient bien ce qu'il annonce
function verifierSauvegarde(texte) {
  try { const d = JSON.parse(texte); return !!d && d.app === 'mes-lectures' && Array.isArray(d.books) && memeResume(d.resume, resumeDe(d.books.map(norm))); }
  catch (e) { return false; }
}

/* ---------- Partager : envoyer ma sauvegarde, partager une liste à un ami, ajouter une liste reçue ----------

const texteSauvegarde = () => JSON.stringify({app: 'mes-lectures', version: 3, schema: SCHEMA, date: new Date().toISOString(), goal, resume: resumeDe(books), books});
const sauvegardeEtPartage = () => `<div class="acts"><button class="btn pri" data-export="backup">${ico('sauver', '💾')} Sauvegarder</button><button class="btn" data-export="envoyer">${ico('partager', '📤')} Envoyer ma sauvegarde</button><button class="btn" data-export="restore">${ico('restaurer', '📂')} Restaurer</button></div>

// Passe un fichier au menu de partage du téléphone ; sans menu de partage, il est téléchargé.
// Renvoie « partage », « annule » (menu fermé sans choisir) ou « telecharge »
async function partagerFichier(nom, texte, type, titre, message) {
  const fichier = new File([texte], nom, {type});
  if (navigator.canShare && navigator.share && navigator.canShare({files: [fichier]})) {
    try { await navigator.share({files: [fichier], title: titre, text: message}); return 'partage'; }
    catch (e) { if (e.name === 'AbortError') return 'annule'; }
  }
  download(nom, texte, type); return 'telecharge';
}

// Ce qu'une liste partagée garde de chaque livre (note et avis seulement si demandés)
const CHAMPS_LISTE = ['titre', 'auteur', 'serie', 'tome', 'isbn', 'editeur', 'annee', 'pagesTotal', 'pagesSource', 'couverture', 'resume'];
const MAX_LISTE = 2000;
function listePartagee({statuts, aimes, note, avis, de}) {
  const livres = sortedBooks().filter(b => !b.aCompleter && statuts.includes(b.statut) && (!aimes || b.note >= 4)).map(b => {
    const l = {};
    for (const k of CHAMPS_LISTE) if (b[k]) l[k] = b[k];
    if (l.couverture && !/^https:\/\//i.test(l.couverture)) delete l.couverture;
    if (note && b.note) l.note = b.note;
    if (avis && b.avis) l.avis = b.avis;
    return l;
  });

}

// Relit une liste reçue (ou la sauvegarde complète d'un ami : seulement ses livres, sans sa note ni son avis).
// Seuls les champs d'une liste sont gardés, en texte ; une couverture qui n'est pas en https est écartée.
function lireListe(texte) {
  let d; try { d = JSON.parse(texte); } catch (e) { return null; }
  if (!d || typeof d !== 'object' || d.app !== 'mes-lectures') return null;
  const liste = d.type === 'liste', brut = liste ? d.livres : d.books;
  if (!Array.isArray(brut)) return null;
  const livres = brut.filter(x => x && typeof x === 'object' && !Array.isArray(x) && txt(x.titre).trim()).slice(0, MAX_LISTE).map(x => {
    const l = {};
    for (const k of CHAMPS_LISTE) { const v = txt(x[k]).trim().slice(0, k === 'resume' ? 3000 : 300); if (v) l[k] = v; }
    if (l.couverture && !/^https:\/\//i.test(l.couverture)) delete l.couverture;
    if (liste) {
      const n = Math.round(+x.note); if (n >= 1 && n <= 5) l.note = n;
      const a = txt(x.avis).trim().slice(0, 3000); if (a) l.avis = a;
    }
    return l;
  });
  return {de: liste ? Array.from(txt(d.de).trim()).slice(0, 40).join('') : '', livres};
}

/* ---------- Passage au format v3 : copie intacte avant la première conversion ---------- */
// Données lues sans « schema: 3 » et non vides : on garde une copie telle quelle (une seule fois, jamais écrasée),
// puis on invitera à exporter une sauvegarde. Si la copie est impossible, la mise à jour continue (elle n'efface rien)
// et on invite tout de suite à sauvegarder.
async function preparerMigration(d) {
  if (!d || +d.schema >= SCHEMA || !Array.isArray(d.books) || !d.books.length) return 'rien';
  try {
    if (await Store.get('avant-migration-v3')) return 'déjà';
    await Store.set('avant-migration-v3', {books: d.books, goal: d.goal || 0, date: new Date().toISOString()});
    prefs.avantMigration = new Date().toISOString(); prefs.inviterSauvegarde = true; savePrefs();
    return 'copiée';
  } catch (e) {
    // (signalé par un bandeau qui reste jusqu'à la prochaine sauvegarde : voir paintNotice)
    prefs.inviterSauvegarde = true; prefs.copieMigrationEchec = new Date().toISOString(); savePrefs(); paintNotice();
    return 'échec';
  }
}
// Remettre la bibliothèque telle qu'elle était juste avant la mise à jour. La bibliothèque du moment est rangée à part
// (« avant-retour-migration ») et le bouton devient « Annuler le retour » : un second appui ne peut rien écraser,
// et la copie de la dernière restauration n'est pas touchée.
async function revenirAvantMigration() {
  if (prefs.migrationRemise) { toast('Ta bibliothèque d\'avant la mise à jour est déjà remise'); return 'déjà remise'; }
  let c = null;
  try { c = await Store.get('avant-migration-v3'); } catch (e) {}
  if (!c || !Array.isArray(c.books)) { toast('Pas de copie d\'avant la mise à jour'); return 'aucune copie'; }
  if (!(await demander(`Remettre ta bibliothèque telle qu'elle était avant la mise à jour (${fdate(iso(new Date(c.date)))}) ? Ce que tu as changé depuis sera mis de côté : tu pourras revenir en arrière.`, 'Remettre', 'Annuler'))) return 'annulé';
  try { await Store.set('avant-retour-migration', {books, goal, date: new Date().toISOString()}); }
  catch (e) { toast('Impossible pour l\'instant (mémoire pleine ?)'); return 'échec'; }
  fillStop = true;
  books = c.books.map(norm); goal = entier(c.goal) || 0;
  await Store.persist();
  prefs.migrationRemise = new Date().toISOString(); savePrefs();
  render(); toast('Bibliothèque d\'avant la mise à jour remise ✓', {label: 'Annuler', fn: annulerRetourMigration});
  return 'remise';
}
// Annuler ce retour : la bibliothèque mise de côté revient, et le bouton « Revenir… » redevient disponible
async function annulerRetourMigration() {
  let c = null;
  try { c = await Store.get('avant-retour-migration'); } catch (e) {}
  if (!prefs.migrationRemise || !c || !Array.isArray(c.books)) { toast('Rien à annuler'); return 'rien'; }
  fillStop = true;
  books = c.books.map(norm); goal = entier(c.goal) || 0;
  await Store.persist();
  try { await Store.set('avant-retour-migration', null); } catch (e) {}
  delete prefs.migrationRemise; savePrefs();
  render(); toast('Retour annulé : ta bibliothèque est revenue ✓');
  return 'annulé';
}

/* ---------- Enregistrer / supprimer ---------- */
function save(b, msg, action) {
  if (!b.id) b.id = newId();
  if (!b.ajoute) b.ajoute = new Date().toISOString();
  const i = books.findIndex(x => x.id === b.id);
  if (i >= 0) books[i] = b; else books.push(b);
  render(); if (msg) toast(msg, action);
  checkBadges();
  return Store.persist();
}
function remove(b) {
  const i = books.findIndex(x => x.id === b.id); if (i < 0) return;
  books.splice(i, 1); render(); Store.persist();
  toast('Livre supprimé', {label: 'Annuler', fn: () => { books.splice(Math.min(i, books.length), 0, b); render(); Store.persist(); toast('Livre remis ✓'); }});
}
// Supprimer un livre (depuis sa fiche ou le formulaire) : une vraie question, qui compte ce qui part avec lui
async function supprimerLivre(id) {
  const b = books.find(x => x.id === id); if (!b) return false;
  const n = (b.notes || []).length, c = (b.citations || []).length;
  const aussi = n + c === 0 ? '' : n + c === 1 ? (n ? ' Sa note sera supprimée aussi.' : ' Sa citation sera supprimée aussi.')
    : ` Ses ${[n ? plural(n, 'note') : '', c ? plural(c, 'citation') : ''].filter(Boolean).join(' et ')} seront supprimées aussi.`;
  if (!(await demander(`Supprimer « ${b.titre} » ?${aussi}`, 'Supprimer', 'Garder'))) return false;
  if ($('#ov').classList.contains('show')) { modalModifie = false; closeM(); }
  if (fiche.id === id) { fiche.id = ''; fiche.edition = null; $('#livreOv').classList.remove('show'); }
  remove(books.find(x => x.id === id) || b);
  return true;
}
function blankBook(statut) {
  return {titre: '', auteur: '', genre: '', note: 0, couverture: '', statut, citations: [], journal: [], historique: [], sessions: [],
    format: 'papier', possession: statut === 'a_lire' ? 'non' : 'a_moi'};
}
function bookFrom(x, statut) {
  const b = {...blankBook(statut), titre: x.titre, auteur: x.auteur || '', serie: x.serie || '', tome: x.tome || '',
    pagesTotal: x.pagesTotal || '', pagesSource: x.pagesTotal ? x.pagesSource || (x.isbn ? 'edition' : 'estimation') : '',
    isbn: x.isbn || '', editeur: x.editeur || '', annee: x.annee || '', genre: x.genre || '', possession: 'a_moi',
    sujets: x.sujets || [], classements: x.classements || []};
  if (b.classements.length) b.classTente = true;
  if (statut === 'en_cours') { b.dateDebut = today(); logPage(b, 0); }
  return b;
}
// Ce livre est-il déjà dans ma liste ? (même ISBN, ou même titre + auteur, et même tome si les deux en ont un)
function findOwned(x, exceptId) {
  const n = Recherche.norm, sn = Recherche.surname;
  const sameTome = b => !b.tome || !x.tome || String(b.tome) === String(x.tome);
  const sameTitle = b => n(b.titre) === n(x.titre) || (b.serie && x.serie && b.tome && x.tome && n(b.serie) === n(x.serie));
  return books.find(b => b.id !== exceptId && x.isbn && b.isbn === x.isbn) ||
    books.find(b => b.id !== exceptId && !b.aCompleter && sameTitle(b) && sameTome(b) && (!sn(b.auteur) || !sn(x.auteur) || sn(b.auteur) === sn(x.auteur)));
}

function quick(act, b) {
  if (act === 'start' || act === 'resume') {
    const nb = {...b, statut: 'en_cours', dateDebut: b.dateDebut || today(), dateFin: ''};
    logPage(nb, nb.pageActuelle || 0);
    save(nb, act === 'start' ? 'Bonne lecture ! 📖' : 'C\'est reparti ! 📖');
  }
  else if (act === 'pin') save({...b, epingle: !b.epingle}, b.epingle ? 'Désépinglé' : 'Épinglé en haut 📌');
  else if (act === 'fini') openForm({...b, statut: 'lu', dateFin: today(), pageActuelle: b.pagesTotal || b.pageActuelle}, {finish: true});
  else if (act === 'pages') openPage(b);
  else if (act === 'quote') openQuote(b);
  else if (act === 'timer') startTimer(b);
  else if (act === 'calme') ouvrirCalme(b);
  else if (act === 'plus') openActions(b);
}
// « ⋯ » d'un livre en cours : les autres actions, en grand
function openActions(b) {
  $('#modal').innerHTML = `<h2>${esc(b.titre)}</h2>
    <div class="ajout">

      <button type="button" data-act="quote"><b><span class="ico i-modifier" aria-hidden="true">✍️</span> Ajouter une citation</b><span>Une phrase qui t'a marqué</span></button>

      <button type="button" data-act="edit"><b><span class="ico i-texte" aria-hidden="true">📝</span> Modifier la fiche</b><span>Pages, dates, résumé, rayons…</span></button>

// Après avoir fini un tome : proposer le suivant
function afterFinish(b) {
  if (!b.serie || !b.tome) return;
  const next = +b.tome + 1;
  if (books.some(x => Recherche.norm(x.serie) === Recherche.norm(b.serie) && +x.tome === next)) return;
  setTimeout(() => toast(`Fini ! Ajouter le tome ${next} de ${b.serie} ?`, {label: '＋ Tome ' + next, fn: () => addNextTome(b.serie, next)}), 900);
}
function addNextTome(serie, n) {
  openForm(null, {statut: 'a_lire', query: serie + ' ' + n});
}

/* ---------- Fenêtres ---------- */
// Erreur de saisie affichée sous le champ (et annoncée), effacée dès qu'on corrige
function erreurChamp(id, message) {
  const inp = $('#' + id); if (!inp) return;
  let p = $('#' + id + '_err');
  if (!p) { p = document.createElement('p'); p.className = 'erreur'; p.id = id + '_err'; p.setAttribute('role', 'alert'); inp.after(p); }
  p.textContent = message; inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', p.id); inp.focus();
  inp.addEventListener('input', () => { p.remove(); inp.removeAttribute('aria-invalid'); inp.removeAttribute('aria-describedby'); }, {once: true});
}
// (élément qui avait le focus avant la fenêtre : il le retrouve à la fermeture)
let focusAvant = null;
function showM() {
  fermerFete();   // (lot 31 : une fenêtre ouverte depuis le calque — « ＋ Tome suivant » — ne doit pas rester dessous)
  if (!$('#ov').classList.contains('show')) focusAvant = document.activeElement;
  $('#ov').classList.add('show'); $('#modal').scrollTop = 0; modalModifie = false;
  const h = $('#modal h2'); if (h) { h.id = 'modalTitre'; h.tabIndex = -1; h.focus({preventScroll: true}); }
}
function closeM() {
  $('#ov').classList.remove('show'); form = null;
  // (une autre fenêtre a changé la bibliothèque pendant que celle-ci était ouverte)
  if (Store.aRafraichir) { Store.aRafraichir = false; render(); }
  if (focusAvant && document.contains(focusAvant)) focusAvant.focus({preventScroll: true});
  focusAvant = null;
}

// Une page enregistrée (« Où j'en suis » et la fiche, O3c) : même journal, mêmes règles (page maximale, livre fini)
function enregistrerPage(b, n) {
  ui.pousse = {id: b.id, t: Date.now()};   // (lot 33 : la plante de ce livre poussera une fois sur l'accueil)
  const tot = +b.pagesTotal || 0;
  const nb = {...b, pageActuelle: tot ? Math.min(n, tot) : n};
  logPage(nb, nb.pageActuelle);
  // (dernière page : enregistrée d'abord, comme pour le chrono ; fermer la fiche « Bravo » ne la perd plus)
  if (tot && n >= tot) { save(nb); return openForm({...nb, statut: 'lu', dateFin: today()}, {finish: true}); }
  const d = n - (+b.pageActuelle || 0);
  save(nb, d > 0 ? `+${plural(d, 'page')} 👏` : 'Page enregistrée');
}
function openPage(b) {
  // En un geste : quelques pages de plus, ou « Fini » (au-dessus du champ, pour rester visibles quand le clavier s'ouvre)
  const cur = +b.pageActuelle || 0;
  $('#modal').innerHTML = `<h2>Où en es-tu ?</h2><p class="a remonte">${esc(b.titre)}</p>
    <div class="acts mb-3" id="p_vite">${[10, 25, 50].map(n => `<button class="btn" type="button" data-plus="${n}">+${n}\u00a0p.</button>`).join('')}${b.pagesTotal ? '<button class="btn" type="button" data-plus="fin">Fini ✓</button>' : ''}</div>
    <div class="f"><label for="p_val">Page actuelle${b.pagesTotal ? ' (sur ' + esc(b.pagesTotal) + ')' : ''}</label>
    <input id="p_val" type="number" min="0" inputmode="numeric" value="${esc(b.pageActuelle)}"></div>
    <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="p_ok">Enregistrer</button></div>`;
  showM();
  const inp = $('#p_val'); inp.focus(); inp.select();
  const ok = () => {
    const n = parseInt(inp.value, 10);
    if (isNaN(n) || n < 0) return toast('Indique un numéro de page');
    closeM(); enregistrerPage(b, n);
  };
  $('#p_ok').onclick = ok;
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('#p_vite').onclick = e => {
    const x = e.target.closest('[data-plus]'); if (!x) return;
    inp.value = x.dataset.plus === 'fin' ? +b.pagesTotal : cur + +x.dataset.plus; ok();
  };
}

let formBase = null, pagesAuto = null, formRef = null, doublonAccepte = false;
// Pendant que la fiche était ouverte, le livre enregistré a pu être complété en arrière-plan (résumé, catégories, couverture…)
// ou changé dans une autre fenêtre : on reprend ces changements pour tout ce que la fiche n'a pas modifié
function reprendreArrierePlan(f) {
  const now = books.find(x => x.id === f.id);
  if (!formRef || !now || now === formRef) return f;
  const s = v => JSON.stringify(v === undefined ? null : v);
  for (const k of new Set([...Object.keys(now), ...Object.keys(formRef)])) {
    if (k.startsWith('_')) continue;
    if (s(now[k]) !== s(formRef[k]) && s(f[k]) === s(formRef[k])) f[k] = now[k];
  }
  return f;
}
function sourcePages(v) {
  const n = parseInt(v, 10); if (!(n > 0)) return '';
  if (pagesAuto && +pagesAuto.v === n) return pagesAuto.s;
  if (formBase && +formBase.pagesTotal === n) return formBase.pagesSource || '';
  return 'manuel';
}

let resumeBusy = false;
function autoResume(id) {
  if (!resumeQueue.includes(id)) resumeQueue.push(id);
  if (resumeBusy) return;
  resumeBusy = true;
  (async () => {
    while (resumeQueue.length) {
      // (le livre sort de la file AVANT d'être cherché : bibliothèque vide → pas de boucle sans fin ; aucun livre sauté)
      const id = resumeQueue.shift(), b = books.find(x => x.id === id);
      if (!b || b.resume || b.aCompleter) continue;
      const r = await Recherche.resume(b).catch(() => ({}));
      const i = books.findIndex(x => x.id === b.id); if (i < 0) continue;
      const nb = {...books[i], resumeTente: true};
      if (r.resume) nb.resume = r.resume;
      if (r.sujets && r.sujets.length && !(nb.sujets || []).length) nb.sujets = r.sujets;
      if ((r.classements || []).length && !(nb.classements || []).length) { nb.classements = r.classements; nb.classTente = true; }
      if (!nb.genre && r.genre) nb.genre = r.genre;
      books[i] = nb; Store.persist(); if (r.resume && ui.tab === nb.statut) renderCards();
      if (!(nb.classements || []).length && !nb.classTente) autoClass(nb.id);
      await new Promise(res => setTimeout(res, 800));
    }
    resumeBusy = false;
  })();
}

// En arrière-plan, un livre à la fois : classement des catalogues (catégories) des livres qui n'en ont pas
const classQueue = [];
let classBusy = false;
function autoClass(id) {
  if (!classQueue.includes(id)) classQueue.push(id);
  if (classBusy || navigator.onLine === false) return;
  classBusy = true;
  (async () => {
    while (classQueue.length) {
      const id = classQueue.shift(), b = books.find(x => x.id === id);   // (même règle que la file des résumés)
      if (!b || b.aCompleter || b.classTente || (b.classements || []).length) continue;
      try { await fillClass(b); Store.persist(); } catch (e) {}
      await new Promise(res => setTimeout(res, 800));
    }
    classBusy = false;
  })();
}

/* ---------- Recherche dans la fiche ---------- */
const SRC_ICON = {ok: '<span class="ok">✓</span>', rien: '–', attente: '…', quota: '<span class="ko">⛔</span>', erreur: '<span class="ko">✗</span>'};
function statusHtml(st) { return Object.entries(st).map(([k, v]) => `<span>${esc(k)} ${SRC_ICON[v] || ''}</span>`).join(''); }
function resultHtml(x, i) {
  const own = findOwned(x, form && form.id);
  const meta = [x.auteur || 'Auteur inconnu', [x.editeur, x.annee].filter(Boolean).join(' '), x.pagesTotal ? x.pagesTotal + '\u00a0p.' : ''].filter(Boolean).join(' · ');
  const sous = x.sousTitre && x.sousTitre.length < 70 ? ` <span class="a">— ${esc(x.sousTitre)}</span>` : '';
  return `<button type="button" class="r" data-res="${i}">${coverHtml(x, 'rc')}<span><b>${esc(x.titre)}</b>${sous}<br>
    ${serieLabel(x) ? `<span class="chip">${esc(serieLabel(x))}</span> ` : ''}<span class="a">${esc(meta)}</span>
    ${own ? `<br><span class="own">✓ Déjà dans ta liste (${STATUT_UN[own.statut]})</span>` : ''}</span></button>`;
}
async function doSearch(auto) {
  const q = $('#s_q').value.trim(); if (!q) return;
  // (la fiche ouverte au moment de la recherche : si elle a été fermée ou remplacée entre-temps, on ne touche à rien)
  const box = $('#s_res'), tok = (doSearch.tok = (doSearch.tok || 0) + 1), f = form;
  const isbn = Recherche.toIsbn13(q);
  if (!isbn && Recherche.looksLikeIsbn(q) && !/[a-z]/i.test(q.replace(/isbn/i, ''))) {
    box.innerHTML = '<div class="hint">⚠️ Ce numéro ISBN n\'est pas valide : un chiffre est sûrement faux. Vérifie les chiffres sous le code-barres.</div>';
    $('#s_st').innerHTML = ''; return;
  }
  box.innerHTML = squelettes(2);
  const onSt = st => { if (tok === doSearch.tok && form === f && $('#s_st')) $('#s_st').innerHTML = statusHtml(st); };
  let res = [];
  try { res = isbn ? await Recherche.parIsbn(isbn, onSt) : await Recherche.parTexte(q, onSt); } catch (e) {}
  if (tok !== doSearch.tok || !form || form !== f || !$('#s_res')) return;
  lastRes = res;
  if (res.length) {
    box.innerHTML = res.map(resultHtml).join('');
    if (isbn && auto && res.length === 1) pickResult(0);
    return;
  }
  const st = Recherche.dernierStatut || {};
  const googleTip = st.Google === 'quota' && !prefs.googleKey ? '<br>💡 Google Books est saturé en ce moment : ajoute ta clé gratuite dans ⚙️ Réglages pour fouiller aussi son catalogue.' : '';
  const reseau = Object.values(st).every(v => v === 'erreur') ? '<br>📶 Aucune source n\'a répondu : vérifie ta connexion internet.' : '';
  if (isbn) {
    if (!form.isbn) { form.isbn = isbn; $('#f_isbn').value = isbn; }
    box.innerHTML = `<div class="hint">Code <b>${esc(isbn)}</b> bien lu ✓, mais aucun catalogue ne connaît ce livre (souvent : très récent, auto-édité ou imprimé à l'étranger).<br>
      👉 Tape plutôt son <b>titre</b> dans la recherche ci-dessus, ou remplis la fiche à la main : le code est déjà noté.${googleTip}${reseau}</div>`;
    $('#s_q').value = ''; $('#s_q').placeholder = 'Titre ou auteur du livre…';
  } else {
    box.innerHTML = `<div class="hint">Rien trouvé pour « ${esc(q)} ».<br>👉 Essaie juste le titre (sans l'auteur), ou juste le nom de l'auteur, ou vérifie l'orthographe.${googleTip}${reseau}</div>`;
  }
}
function pickResult(i) {
  const x = lastRes[i]; if (!x) return;
  const own = findOwned(x, form.id);
  if (own) {
    $('#s_res').innerHTML = `<div class="hint">${emo('📚')}Tu as déjà <b>${esc(own.titre)}</b> dans « ${STATUT_UN[own.statut]} ».
      <div class="acts"><button class="btn pri small" type="button" data-openown="${esc(own.id)}">Ouvrir sa fiche</button><button class="btn small" type="button" data-anyway="${i}">L'ajouter quand même</button></div></div>`;
    return;
  }
  fillFrom(x);
}
function fillFrom(x) {
  const f = form;
  modalModifie = true;   // la fiche a été remplie : la fermer par erreur ferait perdre ces infos
  // (une information absente du catalogue n'efface jamais ce qui est déjà dans la fiche)
  $('#f_titre').value = x.titre; if (x.auteur) $('#f_auteur').value = x.auteur;
  if (x.pagesTotal) { $('#f_total').value = x.pagesTotal; pagesAuto = {v: x.pagesTotal, s: x.pagesSource || (x.isbn ? 'edition' : 'estimation')}; paintPagesSrc(); }
  if (x.serie) { $('#f_serie').value = x.serie; $('#f_tome').value = x.tome || ''; }
  if (x.isbn) $('#f_isbn').value = x.isbn;
  if (x.editeur) $('#f_edit').value = x.editeur;
  if (x.annee) $('#f_annee').value = x.annee;
  if (x.resume && !$('#f_resume').value.trim()) showResume(x.resume, x.sujets);
  else if (!$('#f_resume').value.trim()) fetchResume(x);
  if (!$('#f_genre').value && x.genre) $('#f_genre').value = x.genre;
  // Classements du catalogue (pour ranger le livre par catégorie)
  if ((x.classements || []).length) { f.classements = Recherche.unirClassements([f.classements, x.classements]); f.classTente = true; }
  if ((x.sujets || []).length && !(f.sujets || []).length) f.sujets = x.sujets;
  paintCats();
  if (!f.couverture || f.aCompleter) { f.couverture = ''; f._covers = x.covers || []; paintPrev(); }
  $('#s_res').innerHTML = ''; $('#s_st').innerHTML = '';
  $('#modal details').open = false;
  toast('Infos remplies ✓');
  // En arrière-plan : vraie couverture + infos manquantes (pages, ISBN…)
  Recherche.couverture(x.covers).then(async u => {
    if (form !== f || f.couverture) return;
    if (u) { setCovers(f, u, x.covers); f._covers = null; return paintPrev(); }
    // Aucune des couvertures habituelles : recherche élargie (titre, auteur, autres éditions…)
    const l = await Recherche.chercherCouvertures({titre: x.titre, auteur: x.auteur, isbn: x.isbn, serie: x.serie, tome: x.tome}, 5).catch(() => []);
    if (form === f && !f.couverture && l.length) { setCovers(f, l[0], l); f._covers = null; paintPrev(); }
  });
  if (!x.pagesTotal || !x.isbn) Recherche.completer(x).then(y => {
    if (form !== f) return;
    if (!$('#f_total').value && y.pagesTotal) {
      // (pages de l'édition dont on reprend aussi l'ISBN, sinon d'une autre édition : estimation)
      const memeEd = !$('#f_isbn').value && y.isbn && y.pagesSource === 'edition';
      $('#f_total').value = y.pagesTotal; pagesAuto = {v: y.pagesTotal, s: memeEd ? 'edition' : 'estimation'}; paintPagesSrc();
    }
    if (!$('#f_isbn').value && y.isbn) $('#f_isbn').value = y.isbn;
    if (!$('#f_edit').value && y.editeur) $('#f_edit').value = y.editeur;
    if (!$('#f_annee').value && y.annee) $('#f_annee').value = y.annee;
    if (!coverList(f).length && y.covers && y.covers.length) { f._covers = y.covers; paintPrev(); }
  });
}

/* ---------- Photos : couverture et code-barres ---------- */
function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function fileToCover(file) {
  const img = await loadImage(file), W = 240, H = 360;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const k = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
  c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  let q = 0.8, d;
  do { d = c.toDataURL('image/jpeg', q); q -= 0.1; } while (d.length > 45000 && q > 0.2);
  URL.revokeObjectURL(img.src);
  return d;
}
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  // Lecteur de secours ZXing 0.21.3 (licence Apache 2.0, voir zxing-LICENSE.txt), rangé avec l'appli :
  // aucun site tiers n'est contacté, et personne d'autre ne peut modifier ce code
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function decodeBarcode(file) {
  const img = await loadImage(file);
  const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  if (await lecteurIntegre()) {
    try { const r = await new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']}).detect(c); if (r.length) return r[0].rawValue; } catch (e) {}
  }
  await loadZXing();
  const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(c.toDataURL('image/jpeg', 0.9));
  return r.getText();
}
$('#pick_cover').onchange = async e => {
  const f = e.target.files[0]; if (!f || !form) return;
  try { setCovers(form, await fileToCover(f), []); form._covers = null; paintPrev(); toast('Couverture ajoutée ✓'); }
  catch (err) { toast('Image illisible'); }
};
$('#pick_scan').onchange = async e => {
  const f = e.target.files[0]; if (!f || !form) return;
  $('#s_res').innerHTML = '<div class="a">Lecture du code-barres…</div>';

    const code = await decodeBarcode(f);
    $('#s_q').value = code; doSearch(true);
  } catch (err) {
    $('#s_res').innerHTML = '<div class="hint">Code-barres pas reconnu. Reprends la photo bien à plat et nette, ou tape les chiffres sous le code-barres (ISBN).</div>';
  }
};

/* ---------- Caméra : lecture du code-barres en direct ---------- */
// Le lecteur intégré à Chrome existe parfois sans pouvoir lire (téléphones sans services Google) :
// on vérifie qu'il sait lire les codes de livres, sinon on prend le lecteur de secours (ZXing)
let lecteurOk = null;
async function lecteurIntegre() {
  if (lecteurOk === null) {
    try { lecteurOk = 'BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('ean_13'); }
    catch (e) { lecteurOk = false; }
  }
  return lecteurOk;
}
// Un code n'est accepté que s'il est lu 2 fois de suite et que son chiffre de contrôle est bon.
// « demarrage.arreter » éteint la caméra même si elle n'a pas fini de démarrer (relecture des lots 27-28)
async function startCamera(video, onCode, demarrage = {}) {
  if (await lecteurIntegre()) {
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
    let alive = true, last = '', n = 0;
    const arreter = () => { alive = false; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; };
    demarrage.arreter = arreter;
    video.srcObject = stream; await video.play();
    const det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a']});
    const loop = async () => {
      if (!alive) return;
      try {
        const r = await det.detect(video);
        const c = ((r.find(x => /^97[89]/.test(x.rawValue)) || r[0]) || {}).rawValue;
        if (c) { n = c === last ? n + 1 : 1; last = c; if (n >= 2) { n = 0; onCode(c); } }
      } catch (e) {}
      if (alive) setTimeout(loop, 120);
    };
    loop();
    return arreter;
  }
  await loadZXing();
  const reader = new ZXing.BrowserMultiFormatReader();
  let stopped = false;
  const arreter = () => { stopped = true; reader.reset(); };
  demarrage.arreter = arreter;
  // (lot 27 : on attend la caméra, pour qu'un refus ou une caméra absente soit dit, comme avec le lecteur intégré)
  try { await reader.decodeFromConstraints({video: {facingMode: 'environment'}}, video, res => { if (res && !stopped) onCode(res.getText()); }); }
  catch (e) { reader.reset(); throw e; }
  return arreter;
}
function cameraError(err) {
  toast(err && err.name === 'NotAllowedError' ? 'Caméra refusée : autorise-la dans les réglages de Chrome' : 'Caméra indisponible : prends une photo');
}
const isBookCode = c => /^97[89]\d{10}$/.test(c) && !!Recherche.toIsbn13(c);

let scanStop = null, scanDemarrage = null;
async function openScanner() {
  $('#scanOv').classList.add('show');
  $('#scanMsg').textContent = 'Vise le code-barres au dos du livre (celui qui commence par 978 ou 979).';
  const d = scanDemarrage = {};
  try {
    const stop = await startCamera($('#cam'), c => {
      if (!isBookCode(c)) { $('#scanMsg').textContent = 'Ce code-barres n\'est pas celui du livre. Vise celui qui commence par 978 ou 979.'; return; }
      closeScanner();
      if (navigator.vibrate) navigator.vibrate(80);
      $('#s_q').value = c; doSearch(true);
    }, d);
    // (scanner fermé, ou rouvert, pendant que la caméra démarrait : celle-ci est éteinte aussitôt)
    if (scanDemarrage !== d) return stop();
    scanDemarrage = null; scanStop = stop;
  } catch (err) {
    if (scanDemarrage !== d) return;   // (scanner déjà fermé : ni message, ni choix de photo)
    closeScanner(); cameraError(err);
    $('#pick_scan').value = ''; $('#pick_scan').click();
  }
}
function closeScanner() {
  const d = scanDemarrage; scanDemarrage = null;
  if (d && d.arreter) try { d.arreter(); } catch (e) {}
  if (scanStop) { const s = scanStop; scanStop = null; try { s(); } catch (e) {} }
  $('#scanOv').classList.remove('show');
}
$('#scanClose').onclick = closeScanner;
$('#scanPhoto').onclick = () => { closeScanner(); $('#pick_scan').value = ''; $('#pick_scan').click(); };

/* ---------- Scan rapide : plusieurs livres d'affilée ---------- */
let bulkStop = null, bulkDemarrage = null, bulkSeen = new Set(), bulkAdded = 0;
async function openBulk() {
  if (Store.bloque) return toast('Impossible d\'ajouter des livres : la mémoire du téléphone ne répond pas. Ferme l\'appli et rouvre-la.');
  bulkSeen = new Set(); bulkAdded = 0;
  $('#bulkList').innerHTML = ''; $('#bulkCount').textContent = '';
  document.querySelectorAll('#bulkDest button').forEach(b => b.classList.toggle('on', b.dataset.dest === prefs.bulkDest));
  $('#bulkMsg').textContent = 'Vise le code-barres au dos du livre.';
  $('#bulkOv').classList.add('show');
  const d = bulkDemarrage = {};
  try { const stop = await startCamera($('#cam2'), bulkCode, d); if (bulkDemarrage !== d) return stop(); bulkDemarrage = null; bulkStop = stop; }   // (comme le scanner)
  catch (err) { if (bulkDemarrage !== d) return; closeBulk(); cameraError(err); }
}
function closeBulk() {
  const d = bulkDemarrage; bulkDemarrage = null;
  if (d && d.arreter) try { d.arreter(); } catch (e) {}
  if (bulkStop) { const s = bulkStop; bulkStop = null; try { s(); } catch (e) {} }
  $('#bulkOv').classList.remove('show');
  if (bulkAdded) toast(`${plural(bulkAdded, 'livre')} ajouté${bulkAdded > 1 ? 's' : ''} ✓`);
}
function bulkRow(html) {
  const d = document.createElement('div'); d.className = 'bl'; d.innerHTML = html;
  $('#bulkList').prepend(d);
  return h => { d.innerHTML = h; };
}
async function bulkCode(c) {
  if (!isBookCode(c)) { $('#bulkMsg').textContent = 'Ce code n\'est pas celui d\'un livre : vise celui qui commence par 978 ou 979.'; return; }
  const isbn = Recherche.toIsbn13(c);
  if (bulkSeen.has(isbn)) return;
  bulkSeen.add(isbn);
  if (navigator.vibrate) navigator.vibrate(60);
  $('#cam2box').classList.add('flash'); setTimeout(() => $('#cam2box').classList.remove('flash'), 400);
  $('#bulkMsg').textContent = 'Vise le livre suivant…';
  const row = bulkRow(`<span class="grow">⏳ ${esc(isbn)}…</span>`);
  const dest = prefs.bulkDest;
  const own = books.find(b => b.isbn === isbn);
  if (own) return row(`<span class="grow">↩︎ Déjà dans ta liste : <b>${esc(own.titre)}</b></span>`);
  const res = await Recherche.parIsbn(isbn).catch(() => []);
  if (res.length) {
    const x = res[0];
    const own2 = findOwned(x);
    if (own2) return row(`<span class="grow">↩︎ Déjà dans ta liste : <b>${esc(own2.titre)}</b></span>`);
    const b = bookFrom(x, dest);
    b.id = newId();
    row(`${coverHtml({titre: b.titre, _covers: x.covers}, 'mini')}<span class="grow">✓ <b>${esc(b.titre)}</b>${b.tome ? ' T.' + esc(b.tome) : ''}<br><span class="a">${esc(b.auteur)}</span></span>`);
    setCovers(b, await Recherche.couverture(x.covers), x.covers);
    books.push(b); bulkAdded++; render(); Store.persist();
    if (!b.couverture) autoCover(b.id);
    if (x.resume) { b.resume = x.resume; b.sujets = x.sujets || []; b.resumeTente = true; Store.persist(); } else autoResume(b.id);
  } else {
    // Pas de réponse des catalogues (pas d'internet, réseau coupé) : ce n'est pas « introuvable », on réessaiera
    const st = Recherche.dernierStatut || {}, vals = Object.values(st);
    const panne = navigator.onLine === false || (vals.length > 0 && vals.every(v => v === 'erreur' || v === 'quota'));
    const b = {...blankBook(dest), id: newId(), titre: 'Livre ' + isbn, isbn, aCompleter: true, horsLigne: panne};
    books.push(b); bulkAdded++; render(); Store.persist();
    row(panne ? `<span class="grow">📶 ${esc(isbn)} : pas de connexion. Ajouté « à compléter », je le compléterai quand internet reviendra.</span>`
      : `<span class="grow">⚠️ ${esc(isbn)} introuvable : ajouté « à compléter »</span>`);
  }
  $('#bulkCount').textContent = plural(bulkAdded, 'livre') + ' ajouté' + (bulkAdded > 1 ? 's' : '');
}
$('#bulkDest').onclick = e => { const b = e.target.closest('[data-dest]'); if (!b) return; prefs.bulkDest = b.dataset.dest; savePrefs(); document.querySelectorAll('#bulkDest button').forEach(x => x.classList.toggle('on', x === b)); };

/* ---------- (lot 34) Session calme : le chrono « Lire » en rituel, style Jardin seulement ---------- */
// Avant le minuteur, tout vit en mémoire (rien n'est enregistré si on ferme) ; ensuite c'est prefs.timer, comme le chrono
const SOUFFLE = {cycle: 8000, n: 3};                      // (3 respirations de 8 s ; les tests raccourcissent)
const CALME = {phase: '', id: '', n: 0, minuteur: 0, compte: 0};
const DUREES_CALME = [10, 20, 30, 0];                     // (0 = « Libre » : sans fin, comme le chrono d'avant)
const dureeCalme = () => DUREES_CALME.includes(prefs.dureeCalme) ? prefs.dureeCalme : 20;
function ouvrirCalme(b) {

function appliquer(id, patch, couv) {
  const i = books.findIndex(z => z.id === id); if (i < 0) return false;
  const nb = {...books[i]}; let change = false;
  for (const [f, v] of Object.entries(patch)) if (f !== 'pagesSource' && v && !nb[f]) { nb[f] = v; change = true; }

  if (couv && couv.u && (!nb.couverture || brokenCovers.has(id))) { setCovers(nb, couv.u, couv.list); brokenCovers.delete(id); change = true; }

async function fillFiche(b) {
  const n = Recherche.norm, sn = Recherche.surname;

  if (b.isbn && Recherche.toIsbn13(b.isbn)) { res = await Recherche.parIsbn(Recherche.toIsbn13(b.isbn)).catch(() => []); byIsbn = res.length > 0; }

  // Le résultat doit vraiment être le même livre (même titre, même auteur, même tome), en français de préférence
  const same = res.filter(r => (n(r.titre) === n(b.titre) || (b.serie && r.serie && n(r.serie) === n(b.serie) && String(r.tome) === String(b.tome)))
    && (!sn(b.auteur) || sn(r.auteur) === sn(b.auteur)) && (!b.tome || !r.tome || String(r.tome) === String(b.tome)));
  const x = same.find(r => r.langue === 'fre') || same[0];

    if (!coverMissing) return false;
    const l = await Recherche.chercherCouvertures(b, 5).catch(() => []);
    return l.length ? appliquer(b.id, {}, {u: l[0], list: l}) : false;

  const y = (!x.pagesTotal || !x.isbn) ? await Recherche.completer(x) : x;

  for (const f of byIsbn ? ['auteur', 'pagesTotal', 'isbn', 'editeur', 'annee', 'genre'] : ['auteur', 'pagesTotal', 'genre']) if (y[f]) patch[f] = y[f];
  // Trouvé par l'ISBN : pages de cette édition ; trouvé par le titre : celles d'une autre édition, peut-être (estimation)
  if (patch.pagesTotal) patch.pagesSource = byIsbn ? y.pagesSource || 'edition' : 'estimation';

  const serieOk = !b.serie && x.serie && x.tome && (x.sources || []).some(s => s === 'BnF' || s === 'Sudoc') && n(x.titre) === n(b.titre);

    if (!u) { list = await Recherche.chercherCouvertures(b, 5).catch(() => []); u = list[0] || ''; }
    couv = {u, list};

  const i = books.findIndex(z => z.id === b.id);
  if (serieOk && i >= 0 && !books[i].serie) { books[i] = {...books[i], serie: x.serie, tome: x.tome}; }

/* ---------- Touche « retour » d'Android : ferme la fenêtre ouverte (et non toute l'appli) ---------- */
// Quand une fenêtre s'ouvre, on ajoute une étape dans l'historique : « retour » la consomme et ferme la fenêtre.
const FENETRES = ['#feteOv', '#askOv', '#scanOv', '#bulkOv', '#timerOv', '#ov', '#livreOv'];   // (la plus haute en premier)
let modalModifie = false, retourPose = false, retourIgnore = 0, retourDepuis = 0, retourAttente = 0;
const fenetreOuverte = () => FENETRES.find(sel => $(sel).classList.contains('show'));
function syncRetour() {
  // (stabilisation, 31/10/2026) Un « retour » posé par l'appli n'est pas encore fait : une étape ajoutée maintenant serait
  // emportée par lui (la fenêtre rouverte resterait sans étape, et le retour suivant sortirait de l'appli). On attend
  // qu'il soit fait (popstate rappelle syncRetour), au plus 1 s : au-delà, il n'arrivera plus.
  if (retourIgnore) {
    if (performance.now() - retourDepuis < 1000) { clearTimeout(retourAttente); retourAttente = setTimeout(syncRetour, 100); return; }
    retourIgnore = 0;
  }
  const o = !!fenetreOuverte();
  if (o && !retourPose) { history.pushState({fenetre: true}, ''); retourPose = true; }
  else if (!o && retourPose) { retourPose = false; retourIgnore++; retourDepuis = performance.now(); history.back(); }
}

  if (i < 0 || j < 0 || j >= TAB_ORDER.length) return false;
  const y = window.scrollY; scrollEspaces[actuel] = y;
  if (STATUTS[precedent]) scrollBibliotheque[precedent] = y;
  ui.tab = routeEspace(TAB_ORDER[j]); render();
  const destination = scrollEspaces[TAB_ORDER[j]] || 0;
  requestAnimationFrame(() => window.scrollTo(0, destination));
  const m = $('#main'); m.classList.remove('slide-l', 'slide-r'); void m.offsetWidth; m.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
  return true;
}
(() => {
  let sx = 0, sy = 0, st = 0, ok = false;
  // Zones qui défilent déjà à l'horizontale (calendrier, rangées de livres…) : le geste leur appartient
  const zoneLibre = el => el.closest('.cal, .sugs, .rangee-livres, .tuiles, .tabs, .subtabs, .chips, input, textarea, select, .modal, .notice');
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && !zoneLibre(e.target) && !document.querySelector('.ov.show, #livreOv.show');
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!ok) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    // Un vrai geste horizontal : assez long, plus horizontal que vertical, assez rapide
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 700) goTab(dx < 0 ? 1 : -1);
  }, {passive: true});
})();

/* ---------- Démarrage ---------- */
(async function init() {
  try {
    const d = await Store.load();
    await preparerMigration(d);
    books = (d.books || []).map(norm);
    goal = +d.goal || 0;
    Store.retenir({...d, books, goal});
    const c = counts();
    if (books.length) ui.tab = ongletDeDepart(c);
    render();
    checkBadges(true);
    // (première ouverture après le passage au format v3 : on propose d'exporter une sauvegarde)
    if (prefs.inviterSauvegarde && books.length && !ESSAI) { prefs.inviterSauvegarde = false; savePrefs(); toastLater('Ton appli a été mise à jour. Pense à faire une sauvegarde (Réglages → 💾 Sauvegarder).', 4000); }
    // Mise en ligne incomplète (un fichier envoyé sans l'autre) : on le dit au lieu de laisser l'appli se comporter bizarrement
    if (Recherche.VERSION !== VERSION || typeof Taxonomie === 'undefined' || Taxonomie.VERSION !== VERSION) {
      console.warn('Versions différentes : index.html ' + VERSION + ', recherche.js ' + Recherche.VERSION + ', taxonomie.js ' + (typeof Taxonomie === 'undefined' ? 'absent' : Taxonomie.VERSION));
      toastLater('⚠️ Mise à jour incomplète : ferme l\'appli et rouvre-la avec internet.', 1500);
    }
    if (!prefs.astuceGlisser && ('ontouchstart' in window)) { prefs.astuceGlisser = true; savePrefs(); toastLater('👆 Astuce : glisse à gauche ou à droite pour changer d\'onglet', 2500); }
    // Une fois par mois : préparer la sélection de 5 livres (en arrière-plan, s'il y a internet)
    if (navigator.onLine !== false && !ESSAI) { setTimeout(() => genSelection(), 4000); setTimeout(reprendreScans, 8000); }
    if (prefs.timer) paintTimerPill();
  } catch (e) {
    // (rien ne pourrait être enregistré : on cache aussi ce qui ajoute des livres)
    $('#fab').hidden = true; paintNotice();
    $('#main').innerHTML = `<div class="empty">⚠️ <b>Impossible de lire tes livres pour l'instant.</b><br>Ils ne sont <b>pas effacés</b> :
      ferme complètement l'appli puis rouvre-la. Si ça continue, redémarre le téléphone.<br><small>(${esc(e.message || e)})</small><br><br>
      <button class="btn pri" type="button" onclick="location.reload()"><span class="ico i-relire" aria-hidden="true">🔄</span> Réessayer</button></div>`;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !ESSAI) navigator.serviceWorker.register('sw.js').catch(() => {});
  // Page de tests : index.html?tests (mémoire séparée)
  if (ESSAI) { const t = document.createElement('script'); t.src = 'tests-appli.js?' + Date.now(); document.body.appendChild(t); }
})();
</script>
